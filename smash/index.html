<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>大乱闘まるりんブラザーズ</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overscroll-behavior:none;
               background:linear-gradient(180deg,#2a4c74 0%, #1d3350 60%, #16283f 100%); }
  body { color:#fff; font-family:"Segoe UI","Yu Gothic UI",system-ui,sans-serif;
         display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:min(100vw, calc(100vh * 1.777), 1100px); touch-action:none; }
  canvas { display:block; width:100%; height:auto;
           touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  /* ★背景の 黒は ゲーム画面(#cv)だけ。canvas 全部に かけると
     キャラ選択の 顔アイコン(canvas)まで まっ黒に なる */
  #cv { background:#10142a; }
  .csFace, .csBig { background:transparent; }

  /* ===== タッチ操作（1人プレイ用） ===== */
  #touch-controls { display:none; position:fixed; inset:0; z-index:20; pointer-events:none; }
  body.has-touch.playing #touch-controls { display:block; }
  #touch-controls .side { position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); pointer-events:none; }
  #touch-controls .side.left  { left:  max(14px, env(safe-area-inset-left)); }
  #touch-controls .side.right { right: max(14px, env(safe-area-inset-right)); }
  #dpad { position:relative; width:150px; height:150px; opacity:.9; pointer-events:none; }
  .dbtn { position:absolute; width:50px; height:50px; background:rgba(40,40,70,.55);
          border:2px solid rgba(255,255,255,.35); color:#fff; font-size:20px;
          display:flex; align-items:center; justify-content:center;
          pointer-events:auto; -webkit-tap-highlight-color:transparent; touch-action:none; }
  .dbtn.up{ top:0; left:50px; border-radius:10px 10px 0 0; }
  .dbtn.down{ bottom:0; left:50px; border-radius:0 0 10px 10px; }
  .dbtn.left{ left:0; top:50px; border-radius:10px 0 0 10px; }
  .dbtn.right{ right:0; top:50px; border-radius:0 10px 10px 0; }
  .dbtn.pressed{ background:rgba(233,69,96,.8); }
  /* ★ボタンは ほんものの ゲーム機コントローラーと 同じ ならび にする（ユーザー指定）。
     ふつうの コントローラー＝  X
                            Y   A
                              B
     スマホは 3つだけ 出すので X を のぞいた **Y（左）／A（右）／B（下）**。
     Y＝ジャンプ・A＝こうげき・B＝ひっさつ は コントローラーと 同じ わりあて。
     色も タイトル画面の ボタン説明（Y=みどり／A=あか／B=きいろ）と そろえる。 */
  #abtns { position:relative; width:200px; height:170px; pointer-events:none; }
  .rbtn { position:absolute; width:72px; height:72px; font-size:22px;
          border-radius:50%; color:#fff; font-weight:bold; line-height:1;
          display:flex; flex-direction:column; align-items:center; justify-content:center;
          pointer-events:auto; -webkit-tap-highlight-color:transparent; touch-action:none;
          box-shadow:0 4px 0 rgba(0,0,0,.35); border:3px solid rgba(255,255,255,.55); }
  .rbtn small { font-size:9.5px; font-weight:normal; opacity:.9; margin-top:2px; }
  .rbtn.y { left:0;   top:26px; background:rgba(60,176,110,.88); }   /* Y＝ジャンプ */
  .rbtn.a { right:0;  top:26px; background:rgba(233,69,96,.88); }    /* A＝こうげき */
  .rbtn.b { left:64px; bottom:0; background:rgba(240,190,60,.92); color:#20242f; } /* B＝ひっさつ */
  .rbtn.pressed { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.35); filter:brightness(1.2); }
  /* 画面が ひくい スマホでは 少し 小さく */
  @media (max-height:420px){
    #abtns { width:176px; height:150px; }
    .rbtn { width:64px; height:64px; font-size:20px; }
    .rbtn.y, .rbtn.a { top:22px; }
    .rbtn.b { left:56px; }
    #dpad { width:132px; height:132px; }
    .dbtn { width:44px; height:44px; }
    .dbtn.up{ left:44px; } .dbtn.down{ left:44px; }
    .dbtn.left{ top:44px; } .dbtn.right{ top:44px; }
  }

  /* ===== オーバーレイ（メニュー） ===== */
  /* ★明るく 楽しい 画面に（くさはらの 空と 草）。
     まえは まっ黒で さびしかった＝ユーザー指摘 */
  #overlay { position:absolute; inset:0; z-index:30; display:flex; flex-direction:column;
             align-items:center; justify-content:center; gap:7px; padding:8px 14px;
             text-align:center; overflow-y:auto; color:#1f3350;
             background:
               radial-gradient(circle at 14% 16%, rgba(255,255,255,.75), transparent 26%),
               radial-gradient(circle at 84% 10%, rgba(255,255,255,.6), transparent 22%),
               radial-gradient(circle at 62% 26%, rgba(255,255,255,.5), transparent 18%),
               linear-gradient(180deg,#63c6f5 0%, #9fe0fb 34%, #d8f3b0 62%, #8ed46a 100%); }
  #overlay.hide { display:none; }
  /* ゲームロゴらしく：太字＋こい ふちどり＋下に のびる かげ（立体っぽく） */
  .logo { line-height:1; transform:rotate(-1.5deg); margin-bottom:2px; }
  .logo span { display:block; font-weight:900;
               font-family:"Yu Gothic UI","Hiragino Sans","Segoe UI",sans-serif;
               -webkit-text-stroke:4px #17263f; paint-order:stroke fill; }
  .logo .l1 { font-size:clamp(24px,4.8vw,44px); letter-spacing:6px; color:#ffd23f;
              text-shadow:0 3px 0 #b8791a, 0 6px 0 #8d5a0e, 0 9px 12px rgba(0,0,0,.38); }
  .logo .l2 { font-size:clamp(16px,3.1vw,28px); letter-spacing:2px; color:#fff3d6;
              margin-top:2px; -webkit-text-stroke-width:3.4px;
              text-shadow:0 3px 0 #c25a6b, 0 5px 0 #97374a, 0 8px 10px rgba(0,0,0,.34); }
  .sub { display:inline-block; padding:1px 12px; border-radius:999px;
         background:rgba(255,255,255,.8); border:2px solid #fff;
         color:#2b4468; font-size:11px; font-weight:800; letter-spacing:2px; }
  /* ★#menuBody は ふつうの div。中の 固定幅の ボタンが 左に よってしまうので、
     ここも たて並びの センター そろえに する（これが 左よせの 原因だった） */
  #menuBody { display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; }
  .menu { display:flex; flex-direction:column; gap:10px; width:min(340px,86vw); }
  /* スマブラの メニューみたいな、色つきの 大きな タイル */
  button.big { font:inherit; font-size:17px; font-weight:800; padding:10px; border-radius:14px;
               border:3px solid rgba(255,255,255,.95); color:#fff; cursor:pointer;
               background:linear-gradient(180deg,#6b83e0,#3d4fae);
               box-shadow:0 5px 0 rgba(0,0,0,.22); text-shadow:0 2px 0 rgba(0,0,0,.28);
               -webkit-tap-highlight-color:transparent; transition:filter .1s, transform .1s; }
  button.big:hover { filter:brightness(1.12); }
  button.big:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.22); }
  button.big.prim   { background:linear-gradient(180deg,#ff7b8c,#e0344f); }
  button.big.c-blue { background:linear-gradient(180deg,#5fbdf5,#2a7fd0); }
  button.big.c-grn  { background:linear-gradient(180deg,#7fd86a,#3f9e3a); }
  button.big.c-yel  { background:linear-gradient(180deg,#ffd257,#f0a81e); color:#3b2b06;
                      text-shadow:0 1px 0 rgba(255,255,255,.5); }
  /* コントローラー／キーボードで えらんでいる ところ */
  button.big.focus { outline:4px solid #ffe14d; outline-offset:3px; filter:brightness(1.12); }
  /* ★カーソル（いま 見ている ところ）＝ふとい ふちが 光って、上に 1P/2P の ふだが ゆれる。
     「えらんだ キャラ（下の tint＋かどの ふだ）」と 見た目を はっきり 分ける。 */
  .csCell.cur1, .csCell.cur2 { z-index:3; transform:scale(1.10); }
  .csCell.cur1 { box-shadow:0 0 0 4px #ff2d45, 0 0 18px 4px rgba(255,45,69,.95); }
  .csCell.cur2 { box-shadow:0 0 0 4px #1b8fe0, 0 0 18px 4px rgba(27,143,224,.95); }
  .csCell.cur1.cur2 { box-shadow:0 0 0 4px #ff2d45, 0 0 0 8px #1b8fe0, 0 0 18px 6px rgba(0,0,0,.35); }
  /* まん中の 下に「▼1P」の ふだ。かどの「きまり」ふだとは 場所も かたちも 変える */
  .csCur { display:none; position:absolute; bottom:17px; left:50%; z-index:4;
           font-style:normal; font-size:9px; font-weight:900; color:#fff; line-height:1.15;
           padding:1px 5px 2px; border-radius:20px; border:2px solid #fff; white-space:nowrap;
           box-shadow:0 2px 3px rgba(0,0,0,.4); pointer-events:none; transform:translateX(-50%); }
  .csCell.cur1 .csCur.c1 { display:block; background:#ff2d45;
                           animation:csBob .5s ease-in-out infinite alternate; }
  .csCell.cur2 .csCur.c2 { display:block; background:#1b8fe0;
                           animation:csBob .5s ease-in-out infinite alternate; }
  /* 2人が 同じマスに いるときは 左右に わける */
  .csCell.cur1.cur2 .csCur.c1 { left:28%; }
  .csCell.cur1.cur2 .csCur.c2 { left:72%; }
  @keyframes csBob { from { margin-bottom:0; } to { margin-bottom:5px; } }
  .csHint { font-size:11px; color:#9aa6c8; line-height:1.7; }
  .csHint b { color:#ffd54a; }
  button.big.prim { background:#e94560; border-color:#ff98a8; }
  button.big.prim:hover { background:#ff5c76; }
  button.big:disabled { opacity:.45; cursor:default; }
  .note { color:#1c334f; font-size:11.5px; line-height:1.6; max-width:min(620px,94vw);
          font-weight:600; text-shadow:0 1px 0 rgba(255,255,255,.6); }
  .note b { color:#0b4f8a; }
  /* コントローラーの ボタン説明（キーボードの 説明は 使わないので やめた） */
  .pad { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center;
         background:rgba(255,255,255,.85); border:2px solid #fff; border-radius:14px;
         padding:5px 12px; box-shadow:0 2px 0 rgba(0,0,0,.12); }
  .pad .row { display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; color:#1c334f; }
  .pad .row + .row { margin-left:4px; }
  .btn { display:inline-flex; align-items:center; justify-content:center;
         width:22px; height:22px; border-radius:50%; color:#fff; font-weight:900; font-size:12px;
         border:2px solid rgba(255,255,255,.9); box-shadow:0 2px 0 rgba(0,0,0,.28); }
  .btn.x { background:#2a8fd6; }        /* うえ */
  .btn.y { background:#3aa85c; }        /* ひだり */
  .btn.a { background:#e0344f; }        /* みぎ */
  .btn.b { background:#e8a41e; }        /* した */
  .btn.d { width:auto; padding:0 8px; border-radius:8px; background:#5a6b86; font-size:11px; }
  #ver { position:absolute; right:10px; bottom:8px; font-size:11px; color:#3c5473; }
  .picks { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .pick { background:#1c2138; border:2px solid #333c56; border-radius:14px; padding:10px 12px; min-width:150px; }
  .pick h3 { margin:0 0 8px; font-size:14px; color:#9aa6c8; }
  .chip { display:block; width:100%; font:inherit; font-size:15px; font-weight:700; padding:9px 8px; margin-bottom:6px;
          border-radius:10px; border:2px solid transparent; background:#2b3352; color:#fff; cursor:pointer; }
  .chip.sel { border-color:#ffd54a; background:#48407a; }
  .chip small { display:block; font-size:10.5px; font-weight:400; opacity:.8; margin-top:2px; }
  /* ===== キャラクター選択（スマブラ風）===== */
  /* 幅は「ステージの中」で決める。vw を使うと ステージより広くなって はみ出す */
  #overlay.charsel { justify-content:center; gap:7px; padding:8px 10px; }
  /* ★ロゴは 小さくすると 3pxの 黒ぶちに 文字が つぶされて ほとんど 見えなくなる。
     キャラ選択では ロゴを 出さずに 見出しだけに する */
  #overlay.charsel .logo, #overlay.charsel .sub, #overlay.charsel #ver { display:none; }
  /* スマブラの 上に出る 黄色い おび みたいな 見出し */
  .csTitle { display:inline-block; padding:4px 30px; border-radius:999px;
             background:linear-gradient(180deg,#ffdf70,#f0a81e);
             border:3px solid #fff; box-shadow:0 3px 0 rgba(0,0,0,.22);
             font-size:16px; font-weight:900; color:#4a2f04; letter-spacing:5px; }
  /* 17体を たてに はみ出さず おさめる＝9列×2段 */
  .csGrid { display:grid; grid-template-columns:repeat(9, 1fr);
            gap:4px; width:100%; max-width:780px; }
  /* ★よこ長の スマホ（812x375 など）でも 9列のままの ほうが 2段で おさまる。
     6列に すると 3段に なって たてに あふれる ので、切りかえは もっと せまい ときだけ。 */
  @media (max-width:430px){ .csGrid { grid-template-columns:repeat(6, 1fr); } }
  @media (max-width:340px){ .csGrid { grid-template-columns:repeat(5, 1fr); } }
  .csCell { position:relative; padding:0; border:3px solid #ffffff; border-radius:10px;
            background:linear-gradient(180deg,#ffffff,#cfe4f5); cursor:pointer; overflow:hidden;
            aspect-ratio:1/1; -webkit-tap-highlight-color:transparent;
            box-shadow:0 2px 0 rgba(0,0,0,.18); }
  .csCell:hover { filter:brightness(1.06); }
  .csFace { width:100%; height:100%; display:block; }
  .csName { position:absolute; left:0; right:0; bottom:0; padding:2px 1px;
            background:rgba(255,255,255,.9); color:#16304f; font-size:8.5px; font-weight:800;
            letter-spacing:-.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* ★えらんだ キャラ（きまり）＝タイル全体に 色が つく＋かどに 1P/2P の ふだ。
     カーソル（ふとい 光る ふち＋上の ふだ）とは 別物だと ひと目で わかるように した。 */
  .csCell.s1 { border-color:#ff2d45; }
  .csCell.s2 { border-color:#1b8fe0; }
  .csCell.s1.s2 { border-color:#ff2d45; }
  .csCell.s1::before, .csCell.s2::before {
    content:""; position:absolute; inset:0; z-index:1; pointer-events:none; }
  .csCell.s1::before { background:rgba(255,45,69,.30); box-shadow:inset 0 0 0 3px rgba(255,45,69,.95); }
  .csCell.s2::before { background:rgba(27,143,224,.30); box-shadow:inset 0 0 0 3px rgba(27,143,224,.95); }
  .csCell.s1.s2::before {
    background:linear-gradient(90deg, rgba(255,45,69,.30) 50%, rgba(27,143,224,.30) 50%);
    box-shadow:inset 0 0 0 3px rgba(255,45,69,.95); }
  .csCell.s1::after, .csCell.s2::after {
    position:absolute; top:2px; z-index:2; font-size:10px; font-weight:900;
    padding:1px 4px; border-radius:4px; color:#fff; border:1.5px solid #fff; line-height:1.15; }
  .csCell.s1::after { content:"1P"; left:2px; background:#ff2d45; }
  .csCell.s2::after { content:"2P"; right:2px; background:#1b8fe0; }
  .csCell.s1.s2::after { content:"1P"; left:2px; background:#ff2d45; }

  .csPanels { display:flex; gap:8px; width:100%; max-width:720px; }
  /* 1P＝あか、2P＝あお（スマブラと同じ 色わけ） */
  /* ★たてに ならべる flex に して、下の「技」の 白い箱が パネルの 下まで のびるように する。
     さむらいだけ ※空中で下B の 1行が 増えて 背が 高くなり、
     となりの パネルに 青い すきまが できて 見た目が くずれていた（ユーザー指摘）。 */
  .csPanel { flex:1; display:flex; flex-direction:column;
             border:3px solid #fff; border-radius:12px; overflow:hidden; cursor:pointer;
             box-shadow:0 3px 0 rgba(0,0,0,.18); }
  .csPanel.p1 { background:linear-gradient(160deg,#ff9aa8 0%, #e6465f 100%); }
  .csPanel.p2 { background:linear-gradient(160deg,#8fccf7 0%, #2f7fc9 100%); }
  .csPanel.act { box-shadow:0 3px 0 rgba(0,0,0,.18), 0 0 0 4px #ffe14d; }
  .csBig { display:block; width:100%; height:90px; }
  .csBar { display:flex; align-items:center; gap:8px; padding:3px 8px; font-size:12px;
           background:rgba(255,255,255,.9); color:#16304f; font-weight:700; }
  .csPanel.p1 .csBar b { color:#d62b45; } .csPanel.p2 .csBar b { color:#1c6cb4; }
  /* 技は 4段ではなく 2×2（そのほうが 読みやすい） */
  /* キャラの「とくちょう」を 1行で 出す（型・固有の能力） */
  .csTag { font-size:10px; font-weight:800; color:#7a4a12; background:#ffe9ae;
           border-radius:999px; padding:2px 8px; margin:3px 4px 1px; text-align:center;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .csPanel.p2 .csTag { color:#12456f; background:#d8ecff; }
  .csMoves { display:grid; grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);
             align-content:start; flex:1;      /* ← あまった ぶんを 白い箱で うめる */
             gap:2px 5px; padding:5px 8px; background:rgba(255,255,255,.78);
             font-size:10.5px; line-height:1.5; color:#1b3450; text-align:left; }
  .csMoves b { color:#b03050; font-weight:800; white-space:nowrap; }
  .csPanel.p2 .csMoves b { color:#155a97; }
  .csMoves i { font-style:normal; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 空中で 別の技になる マスだけ 2行に する（さむらいの 下B＝構え／空中＝兜割り） */
  .csMoves i.hasAlt { white-space:normal; line-height:1.35; }
  .csMoves i small { display:block; font-size:8.5px; font-weight:700; color:#4a6684;
                     line-height:1.2; white-space:nowrap; }
  .csPanel.p2 .csMoves i small { color:#3d5f80; }
  /* ★どのキャラでも パネルの 高さが 変わらないように、技の箱に 下ささえを 入れる。
     さむらい（2行になる マスが ある）に 合わせた 高さ。 */
  .csMoves { min-height:56px; }
  .csHint { color:#20344f; font-weight:600; text-shadow:0 1px 0 rgba(255,255,255,.6); }

  /* ================================================================
     ★せまい 画面（スマホ・タブレットの よこ持ち）でも 見きれない ように 縮める。
       たて 620px 未満 → すこし 縮小／520px 未満 → もっと 縮小／420px 未満 → いちばん 小さく。
       「タイトルと キャラ選択が スマホだと 見きれる」という 指摘への 対応。
     ================================================================ */
  /* ★切りかえは **画面の 高さ ではなく ゲーム枠(#overlay)の 高さ** で 決める。
     #stage は 16:9 に そろえる ので、よこ長の 画面では 枠の 高さが
     画面の 高さより ずっと 小さい（例：726x790 の 画面でも 枠は 408px）。
     @media (max-height:...) だと そこが 見えず、見きれが 直らなかった。
     クラス（mh1/mh2/mh3）は fitMenu() が 枠を 実測して つける。 */
  body.mh1 #overlay { gap:5px; padding:5px 8px; }
  body.mh1 .logo .l1 { font-size:clamp(22px,4.4vw,34px); }
  body.mh1 .logo .l2 { font-size:clamp(14px,2.8vw,21px); }
  body.mh1 #menuBody { gap:7px; }
  body.mh1 .menu { gap:6px; width:min(300px,80vw); }
  body.mh1 button.big { font-size:15px; padding:7px; border-radius:11px; }
  body.mh1 .note { font-size:10.5px; line-height:1.45; }
  body.mh1 .pad { padding:3px 9px; gap:6px; }
  body.mh1 .csTitle { font-size:14px; padding:2px 20px; letter-spacing:3px; }
  body.mh1 .csGrid { max-width:700px; gap:3px; }
  body.mh1 .csBig { height:66px; }
  body.mh1 .csMoves { font-size:9.5px; min-height:46px; padding:3px 6px; line-height:1.35; }
  body.mh1 .csTag { font-size:9px; padding:1px 6px; margin:2px 3px 0; }
  body.mh1 .csHint { display:none; }
  body.mh1 .logo { margin-bottom:7px; }

  body.mh2 #overlay { gap:3px; }
  body.mh2 .logo .l1 { font-size:26px; letter-spacing:4px; -webkit-text-stroke-width:3px; }
  body.mh2 .logo .l2 { font-size:16px; -webkit-text-stroke-width:2.6px; }
  /* ロゴの 下の かげ＋ボタンの 黄色いふちが かさなって、
     「まるりんブラザーズ」が ボタンに かくれていた ので すきまを あける */
  body.mh2 .logo { margin-bottom:10px; }

const ACTS = ["left","right","up","down","jump","attack","special"];

const KEYMAP = [
  // 1P（キーボード左側）
  { left:"KeyA", right:"KeyD", up:"KeyW", down:"KeyS", jump:"KeyF", attack:"KeyG", special:"KeyH" },
  // 2P（キーボード右側）
  { left:"ArrowLeft", right:"ArrowRight", up:"ArrowUp", down:"ArrowDown",
    jump:"Comma", attack:"Period", special:"Slash" },
];
const keyDown = Object.create(null);
addEventListener("keydown", e => {
  keyDown[e.code] = true;
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space","Comma","Period","Slash"].includes(e.code)) e.preventDefault();
  if (state === "remap") remapKeyHint();
});
addEventListener("keyup", e => { keyDown[e.code] = false; });
addEventListener("blur", () => { for (const k in keyDown) keyDown[k] = false; });

// --- ゲームパッド（Proコン等）---
// ブラウザの「標準配置(STANDARD GAMEPAD)」では 顔の4ボタンは「場所」で番号が決まっている：
//   0 = 下（Proコンの B） / 1 = 右（A） / 2 = 左（Y） / 3 = 上（X）
// ユーザー指定＝ A:こうげき ／ B:ひっさつ ／ X と Y:ジャンプ（2つとも ジャンプ）
const DEFAULT_PAD = { jump:[3,2], attack:[1], special:[0] };
const BTN_LABEL = { 0:"B（した）", 1:"A（みぎ）", 2:"Y（ひだり）", 3:"X（うえ）" };
const btnName = v => (Array.isArray(v) ? v : [v]).map(n => BTN_LABEL[n] || ("ボタン"+n)).join("・");

// ★設定は「コントローラーごと」に持つ。
//   2台の型が違うとボタン番号も違うので、1つの設定を共用すると 片方が必ず壊れる。
let padMaps = loadPadMaps();     // { "<コントローラーのid>": {jump,attack,special} }
function loadPadMaps(){
  try {
    const s = JSON.parse(localStorage.getItem("maruring_smash_pads"));
    if (s && typeof s === "object") return s;
  } catch(e){}
  return {};
}
function savePadMaps(){ try { localStorage.setItem("maruring_smash_pads", JSON.stringify(padMaps)); } catch(e){} }
function mapFor(gp){
  if (!gp) return DEFAULT_PAD;
  let m = padMaps[gp.id];
  if (!m){ m = padMaps[gp.id] = { jump:DEFAULT_PAD.jump.slice(), attack:DEFAULT_PAD.attack.slice(),
                                  special:DEFAULT_PAD.special.slice() }; }
  // 古い保存（数字1つ）は 配列に そろえる
  for (const k of ["jump","attack","special"]) if (!Array.isArray(m[k])) m[k] = [m[k]];
  return m;
}

function padList(){
  const raw = navigator.getGamepads ? navigator.getGamepads() : [];
  const out = [];
  for (let i=0;i<raw.length;i++) if (raw[i]) out.push(raw[i]);
  return out;
}
// スティックの安全装置：
//   Proコンなどは、つないだ直後に「触っていないのに ±1」を返すことがある。
//   そのまま使うと 勝手に走りだして 場外に落ちるので、
//   「一度でも まん中(±0.2以内)を報告したスティックだけ」信用する。
//   （信用できるまでは 十字キーで動かせる）
const padTrust = Object.create(null);
function readPad(slot, dst){
  const pads = padList();
  const gp = pads[slot];
  if (!gp) return;
  const raw0 = gp.axes[0] || 0, raw1 = gp.axes[1] || 0;
  let tr = padTrust[gp.index];
  if (!tr) tr = padTrust[gp.index] = { x:false, y:false };
  if (Math.abs(raw0) < 0.2) tr.x = true;
  if (Math.abs(raw1) < 0.2) tr.y = true;
  const ax = tr.x ? raw0 : 0, ay = tr.y ? raw1 : 0;
  const DZ = 0.45;
  if (ax < -DZ) dst.left = true;
  if (ax >  DZ) dst.right = true;
  if (ay < -DZ) dst.up = true;
  if (ay >  DZ) dst.down = true;
  const b = gp.buttons;
  const on = i => b[i] && (b[i].pressed || b[i].value > 0.4);
  if (on(12)) dst.up = true;      // 十字キー
  if (on(13)) dst.down = true;
  if (on(14)) dst.left = true;
  if (on(15)) dst.right = true;
  const map = mapFor(gp);         // ★このコントローラー専用の設定
  const anyOn = arr => arr.some(on);
  if (anyOn(map.jump))    dst.jump = true;
  if (anyOn(map.attack))  dst.attack = true;
  if (anyOn(map.special)) dst.special = true;
}

// --- タッチ（1Pのみ） ---
const touchHeld = Object.create(null);
document.querySelectorAll("#touch-controls [data-act]").forEach(el => {
  const act = el.dataset.act;
  const press = e => { e.preventDefault(); touchHeld[act] = true;  el.classList.add("pressed"); };
  const rel   = e => { e.preventDefault(); touchHeld[act] = false; el.classList.remove("pressed"); };
  el.addEventListener("pointerdown", press);
  el.addEventListener("pointerup", rel);
  el.addEventListener("pointercancel", rel);
  el.addEventListener("pointerleave", rel);
});
addEventListener("blur", () => {
  for (const k in touchHeld) touchHeld[k] = false;
  document.querySelectorAll("#touch-controls .pressed").forEach(e => e.classList.remove("pressed"));
});

function blankInput(){ return { left:false,right:false,up:false,down:false,jump:false,attack:false,special:false }; }

// プレイヤーごとの入力をまとめて作る（キーボード＋パッド＋タッチをORする）
function gatherInput(pi){
  const d = blankInput();
  const km = KEYMAP[pi];
  for (const a of ACTS) if (keyDown[km[a]]) d[a] = true;
  readPad(pi, d);
  if (pi === 0) for (const a of ACTS) if (touchHeld[a]) d[a] = true;
  return d;
}

//  物理・更新
// ============================================================
function platformAt(f, prevBottom){
  // 下りてきたときだけ乗る（すり抜け床）
  for (const p of PLATS){
    if (f.x < p.x1 - f.w*0.35 || f.x > p.x2 + f.w*0.35) continue;
    if (prevBottom <= p.y + 1 && f.y >= p.y && f.vy >= 0){
      if (!p.solid && f.inp.down && f.inp.jump) continue;   // 下＋ジャンプですり抜け降り
      return p;
    }
  }
  return null;
}

function updateFighter(f, foe){
  f.animT++;
  if (f.hurtFlash > 0) f.hurtFlash--;
  if (f.invuln > 0) f.invuln--;
  if (f.floatT > 0 && (f.onGround || f.hitstun > 0)) f.floatT = 0;   // 着地／被弾で 解除
  else if (f.floatT > 0) f.floatT--;
  for (const k in f.spCd) if (f.spCd[k] > 0) f.spCd[k]--;
  if (f.shieldT > 0 && --f.shieldT === 0){ f.shield = false; f.shieldHard = false; }
  if (f.reflectT > 0) f.reflectT--;
  if (f.counterT > 0) f.counterT--;
  if (f.freezeT > 0) f.freezeT--;
  // やけど＝10フレームごとに じわっと ダメージ（ドラゴンまるりん）
  if (f.burnT > 0){
    f.burnT--;
    if (f.burnT % 10 === 0){
      f.dmg = Math.min(999, f.dmg + 0.7);
      particles.push({ x:f.x + (Math.random()-0.5)*f.w, y:f.y - f.h*Math.random(),
        vx:(Math.random()-0.5)*0.8, vy:-1.2 - Math.random(), r:2+Math.random()*2.5,
        life:18, t:0, c:"#ff9a3c" });
    }
  }

  // 入力
  f.prev = f.inp;
  f.inp = f.isCPU ? cpuThink(f, foe) : gatherInput(f.pi);
  // ★試合が はじまった 1フレーム目は「まえの入力＝いま押しているもの」に そろえる。
  //   そろえないと、キャラ選択の B（＝はじめる）を まだ 押しっぱなしの まま 試合に 入り、
  //   「押した しゅんかん」と 判定されて **必殺技が かってに 出た**（ユーザー報告）。
  if (f.freshStart){ f.prev = f.inp; f.freshStart = false; }
  const pressed = a => f.inp[a] && !f.prev[a];

  // 復活待ち
  if (f.respawnT > 0){
    f.respawnT--;
    if (f.respawnT === 0){
      f.x = W/2; f.y = 60; f.vx = 0; f.vy = 0;
      f.dmg = 0; f.hitstun = 0; f.tumble = 0; f.rot = 0; f.stun = 0;
      f.invuln = 110; f.atkName = null; f.spName = null; f.spKind = null;
      f.airJumpsLeft = f.ch.airJumps; f.upUsed = false;
      f.shield = false; f.shieldT = 0; f.shieldHard = false; f.armorHits = 0;
      f.ledge = null; f.ledgeT = 0; f.ledgeCool = 0; f.floatT = 0;
      f.reflectT = 0; f.counterT = 0; f.freezeT = 0; f.burnT = 0; f.lastHitBy = null;
    }
    return;
  }

  const ch = f.ch;
  // しこ を くらって しびれている あいだ は 何もできない（落ちはする）
  if (f.stun > 0){
    f.stun--;
    f.vx *= 0.86;
    f.vy += ch.grav;
    if (f.vy > ch.maxFall) f.vy = ch.maxFall;
    f.x += f.vx; f.y += f.vy;
    const pb0 = f.y - f.vy;
    const pl0 = platformAt(f, pb0);
    if (pl0){ f.y = pl0.y; f.vy = 0; f.onGround = true; }
    return;
  }
  // ============================================================
  //  崖つかみ（ぶら下がり）
  //   ★「場外に とばされると もどれない」ので 入れた。つかむと
  //     ①空中ジャンプと 上必殺が 回ふく ②しばらく むてき（飛び道具で 落とされない）
  // ============================================================
  if (f.ledgeCool > 0) f.ledgeCool--;
  if (f.ledge){
    const L = f.ledge;
    f.vx = 0; f.vy = 0; f.onGround = false;
    f.x = L.x; f.y = L.y; f.face = -L.side;
    f.rot = 0; f.tumble = 0;
    f.ledgeT++;
    f.airJumpsLeft = ch.airJumps; f.upUsed = false;   // ここで 復帰技が また使える
    // のぼる＝ジャンプ／上／こうげき　　はなす＝下／外がわ
    //   ★3秒 ぶら下がったままなら 自動で のぼる。
    //     （ボタンが わからなくても 止まらない ように。ぶら下がり続けの ずるも ふせげる）
    const climb = pressed("jump") || pressed("up") || pressed("attack") ||
                  (f.isCPU && f.ledgeT > 12) || f.ledgeT > 180;
    // CPUは はなさない（外へ 歩こうとして 自分から 落ちるのを ふせぐ）
    const drop  = !f.isCPU && (f.inp.down || (L.side < 0 ? f.inp.left : f.inp.right));
    if (climb){
      f.ledge = null; f.ledgeT = 0; f.ledgeCool = 26;
      f.x = L.gx; f.y = L.gy; f.vx = 0; f.vy = 0;
      f.onGround = true; f.squash = 0.78;
      f.invuln = Math.max(f.invuln, 16);
      se("jump"); puff(f.x, f.y, 6);
    } else if (drop && f.ledgeT > 6){
      f.ledge = null; f.ledgeT = 0; f.ledgeCool = 22; f.vy = 1.5;
    }
    f.squash += (1 - f.squash) * 0.18;
    return;
  }

  const controllable = f.hitstun <= 0 && !f.atkName && !f.spName;

  // --- 必殺技（進行中） ---
  if (f.spName){
    updateSpecial(f, foe);
  }
  // --- 通常攻撃（進行中） ---
  else if (f.atkName){
    updateAttack(f, foe);
  }

  // --- 操作 ---
  if (controllable){
    // こおっている あいだは 走りも ジャンプも にぶくなる
    const fz = f.freezeT > 0 ? 0.5 : 1;
    const acc = (f.onGround ? ch.accel : ch.airAccel) * fz;
    let dir = 0;
    if (f.inp.left)  dir -= 1;
    if (f.inp.right) dir += 1;
    if (dir !== 0){
      f.vx += dir * acc;
      if (Math.abs(f.vx) > ch.speed * fz) f.vx = ch.speed * fz * Math.sign(f.vx);
      if (f.onGround) f.face = dir;
    } else if (f.onGround){
      f.vx *= ch.friction;
      if (Math.abs(f.vx) < 0.1) f.vx = 0;
    }

    // ジャンプ
    if (pressed("jump")){
      if (f.onGround){
        f.vy = -ch.jump; f.onGround = false; f.squash = 0.72; se("jump");
      } else if (f.airJumpsLeft > 0){
        f.airJumpsLeft--; f.vy = -ch.airJump; f.squash = 0.78; se("jump");
        puff(f.x, f.y, 6);
      }
    }
    // ボタンを離すと低いジャンプ（可変ジャンプ）
    if (!f.inp.jump && f.vy < -4) f.vy *= 0.86;

    // 攻撃
    if (pressed("attack")){
      let n = "side";
      if (!f.onGround) n = "air";
      else if (f.inp.up) n = "up";
      startAttack(f, n);
    }
    // 必殺（方向で 4種類に わかれる）
    if (pressed("special")) startSpecial(f);
  }

  // --- ヒットスタン ---
  if (f.hitstun > 0){
    f.hitstun--;
    if (f.tumble > 0){ f.rot += f.vx * 0.035 + 0.12 * Math.sign(f.vx || 1); f.tumble--; }
    if (f.hitstun === 0){ f.rot = 0; f.tumble = 0; }
  }

  // --- 重力・移動 ---
  //   frozen    ＝その場に とどまる（ワープで 消えている あいだ）
  //   noGravity ＝落ちないが 横には 進む（ほうきダッシュ）。技のほうで 毎フレーム 立てる
  const prevBottom = f.y;
  if (f.frozen){
    f.vx = 0; f.vy = 0;
  } else {
    if (!f.noGravity){
      // 浮遊ちゅうは 落ちかたが ゆっくりに なる
      const gv = f.floatT > 0 ? ch.grav * 0.38 : ch.grav;
      const mf = f.floatT > 0 ? ch.maxFall * 0.45 : ch.maxFall;
      f.vy += gv;
      if (f.vy > mf) f.vy = mf;
    }
    f.x += f.vx;
    f.y += f.vy;
    if (!f.onGround && f.hitstun <= 0) f.vx *= 0.995;
  }
  f.noGravity = false;

  // --- 床 ---
  f.onGround = false;
  const p = platformAt(f, prevBottom);
  if (p){
    f.y = p.y; f.vy = 0; f.onGround = true;
    f.airJumpsLeft = ch.airJumps;
    f.upUsed = false;                 // 着地したら 上必殺が また使える
    if (f.hitstun > 0 && Math.abs(f.vx) > 6){ f.vx *= 0.55; }   // 地面をすべる
  }
  // 本体ステージの側面（横からめり込まない）
  const main = PLATS[0];
  const halfW = f.w/2;
  if (f.y > main.y + 2 && f.y - f.h < main.y + 110){
    if (f.vx > 0 && f.x < main.x1 && f.x + halfW > main.x1) { f.x = main.x1 - halfW; f.vx = 0; }
    if (f.vx < 0 && f.x > main.x2 && f.x - halfW < main.x2) { f.x = main.x2 + halfW; f.vx = 0; }
  }

  // --- 崖を つかむ ---
  //   落ちている とちゅう（または 上必殺で 上がってきた ところ）に 崖の 角が あれば つかまる。
  //   外がわを おしっぱなし の ときは つかまない（わざと 外へ 出たい ときが あるので）。
  if (!f.ledge && f.ledgeCool <= 0 && !f.onGround && f.hitstun <= 0 && f.stun <= 0 &&
      !f.frozen && f.vy >= -2 && (!f.spName || f.spKind === "rise")){
    for (const side of [-1, 1]){
      const ex = side < 0 ? main.x1 : main.x2;             // 崖の 角
      if (side < 0 ? f.inp.left : f.inp.right) continue;   // 外へ 行きたい
      const out = (f.x - ex) * side;                       // プラス＝ステージの 外がわ
      if (out < -8 || out > 64) continue;
      if (f.y < main.y - 8 || f.y > main.y + 96) continue;
      // 体の 内がわの はしが 崖の 角に くるように 置く（ケルベロスなど 横に 長い子でも
      // 体が 地面に めりこんで 見えない ように）
      f.ledge = { side, x: ex + side * Math.max(10, f.w * 0.5 - 8), y: main.y + f.h * 0.95,
                  gx: ex - side * (f.w * 0.62), gy: main.y };
      f.x = f.ledge.x; f.y = f.ledge.y;
      f.vx = 0; f.vy = 0; f.ledgeT = 0; f.rot = 0; f.tumble = 0;
      f.atkName = null; f.atkBox = null; f.spName = null; f.spKind = null;
      f.spCharging = false;
      f.airJumpsLeft = ch.airJumps; f.upUsed = false;
      f.invuln = Math.max(f.invuln, 44);                   // つかんだ ちょくごは むてき
      se("windup"); puff(f.x, f.y, 5);
      break;
    }
  }

  // つぶれ演出の戻り
  f.squash += (1 - f.squash) * 0.18;

  // --- 場外判定 ---
  if (f.x < BLAST.left || f.x > BLAST.right || f.y > BLAST.bottom || f.y - f.h < BLAST.top){
    knockOut(f);
  }
}

// 相方（ニセペギ）を すすめる。位置は 本人の すこし前の記録を そのまま使う。
function updatePal(f, foe){
  const p = f.pal;
  if (!p) return;
  p.hist.push({ x:f.x, y:f.y, face:f.face, air:!f.onGround, moving:Math.abs(f.vx) > 0.5 });
  const delay = f.ch.palDelay || 15;
  if (p.hist.length > delay + 2) p.hist.shift();
  const h = p.hist.length > delay ? p.hist[0] : null;
  if (!h) return;
  p.x = h.x; p.y = h.y; p.face = h.face; p.air = h.air; p.moving = h.moving;
  if (f.respawnT > 0) { p.hist.length = 0; return; }
  // 本人の 攻撃が 当たっているときは、相方も おくれて 同じところを たたく（威力は半分）
  if (f.atkBox && foe && foe.respawnT <= 0 && foe.invuln <= 0){
    const b = f.atkBox;
    const box = { x: p.x + (b.x - f.x), y: p.y + (b.y - f.y), w: b.w, h: b.h,
                  dmg: b.dmg * 0.40, base: b.base * 0.6, scale: b.scale * 0.7, angle: b.angle };
    if (!p.hitList.has(foe) && boxHitsFighter(box, foe)){
      p.hitList.add(foe);
      applyHit(f, foe, box, p.face);
    }
  } else {
    p.hitList.clear();
  }
}

// 押し合い（重なりすぎ防止）
function pushApart(a, b){
  if (a.respawnT > 0 || b.respawnT > 0) return;
  const dx = b.x - a.x;
  const minD = (a.w + b.w) * 0.42;
  if (Math.abs(dx) < minD && Math.abs((b.y - b.h/2) - (a.y - a.h/2)) < (a.h + b.h) * 0.4){
    const push = (minD - Math.abs(dx)) * 0.06 * (dx >= 0 ? 1 : -1);
    a.x -= push; b.x += push;
  }
}

// ============================================================
//  攻撃
// ============================================================
function startAttack(f, name){
  const d = f.ch.atk[name];
  if (!d) return;
  f.atkName = name; f.atkT = 0; f.hitList = new Set();
}
function updateAttack(f, foe){
  const d = f.ch.atk[f.atkName];
  f.atkT++;
  const t = f.atkT;
  if (t > d.pre && t <= d.pre + d.act){
    const box = {
      x: f.x + d.ox * f.face, y: f.y + d.oy,
      w: d.w, h: d.h, dmg: d.dmg, base: d.base, scale: d.scale, angle: d.angle,
    };
    f.atkBox = box;
    tryHit(f, foe, box);
  } else {
    f.atkBox = null;
  }
  if (t >= d.pre + d.act + d.post){ f.atkName = null; f.atkBox = null; }
}

// 入力の方向から どの必殺技かを決める（上→下→横→通常 のゆうせん順）
function specialSlot(f){
  if (f.inp.up)   return "up";
  if (f.inp.down) return "down";
  if (f.inp.left || f.inp.right) return "side";
  return "neutral";
}

// 当たり判定の箱を 技の設定から 組み立てる（キャラの大きさに 合わせて のびる）
function spBox(f, d){
  return {
    x: f.x + (d.bx || 0) * f.face,
    y: f.y - f.h * (d.byf != null ? d.byf : 0.5),
    w: d.bw != null ? d.bw : f.w + (d.bwAdd || 0),
    h: d.bh != null ? d.bh : (d.bhf != null ? f.h * d.bhf : f.h + (d.bhAdd || 0)),
    dmg: d.dmg, base: d.base, scale: d.scale, angle: d.angle,
  };
}

// 技を「出す」ところ（ため技は ボタンを離してから ここに来る）
function fireSpecial(f, d){
  f.spT = 0; f.hitList = new Set();
  const k = d.charge ? (f.spCharge / d.maxT) : 0;   // 0＝ためなし … 1＝満タン
  f.spK = k;
  switch (d.t){
    case "proj": {
      const n = d.n || 1;
      const spd  = d.spd  * (1 + k * (d.kSpd  || 0));
      const life = d.life * (1 + k * (d.kLife || 0));
      const dmg  = d.dmg  * (1 + k * (d.kDmg  || 0));
      for (let i=0;i<n;i++){
        const kk = n === 1 ? 0 : (i - (n-1)/2);
        projectiles.push({
          // gap＝よこに ずらして 出す（SPが 2人 ならんで 走る ときに つかう）
          x: f.x + (f.w*0.55 + kk*(d.gap||0))*f.face,
          y: f.y - f.h*d.oyf + kk*(d.gap ? 0 : 7),
          vx: (spd + Math.abs(kk)*(d.gap ? 0 : 0.6)) * f.face, vy: kk*(d.spread||0),
          w:d.pw, h:d.ph, t:0, life:life, owner:f, big:k > 0.55, steer:d.steer,
          dmg:dmg, base:d.base*(1+k*0.5), scale:d.scale, angle:d.angle, vis:d.vis,
          suck:d.suck, ground:d.ground, freeze:d.freeze,
        });
      }
      se("shoot"); break;
    }
    case "pillar": {
      let px = f.x + d.dist * f.face;
      px = Math.max(PLATS[0].x1 + 20, Math.min(PLATS[0].x2 - 20, px));
      // ひかりの柱は 上から下まで／ロブは 落ちてきた ボールの まわりだけ
      const lob = d.vis === "lob";
      projectiles.push({
        pillar:true, x:px,
        y: lob ? GROUND_Y - 18 : (GROUND_Y + 20)/2,
        w: d.pw, h: lob ? 64 : GROUND_Y + 20,
        vx:0, vy:0, t:0, mark:d.mark, life:d.mark + d.beam, owner:f,
        dmg:d.dmg, base:d.base, scale:d.scale, angle:d.angle, vis: d.vis || "pillar",
      });
      se("windup"); break;
    }
    case "warp":
      f.warpHide = true; f.frozen = true; f.vx = 0; f.vy = 0;
      f.invuln = Math.max(f.invuln, d.hide + 6);
      se("shoot"); puff(f.x, f.y, 12); break;
    case "multi":   se("windup"); break;
    case "counter": f.counterT = d.active; se("windup"); break;
    case "shield":  f.shield = true; f.shieldT = d.time;
                    f.shieldHard = !!d.hard; f.armorHits = d.hard ? 3 : 0;
                    se("windup"); break;
    case "reflect": f.reflectT = d.active; se("windup"); break;
    case "heal":    se("windup"); break;
    case "pull":    se("windup"); break;
    // ★空中で 出した 上必殺（＝復帰）だけ 出だしに 短い むてき。
    //   もどる とちゅうを 飛び道具で 落とされ続ける のを ふせぐ ため。
    case "rise":    if (!f.onGround) f.invuln = Math.max(f.invuln, 10);
                    f.vy = d.vy; f.onGround = false; se("jump"); puff(f.x, f.y, 7); break;
    case "press":   f.vy = d.upVy; f.onGround = false; se("windup"); break;
    // 地上で 出したときも いったん 跳ぶ。跳ばないと 落ちる先が なくて
    // 「なにも 起きない 技」に 見えた（重り）
    case "dive":    f.vy = 0; if (f.onGround){ f.vy = -7.5; f.onGround = false; }
                    se("windup"); break;
    case "dash":    se(d.charge ? "dash" : "windup"); break;
  }
}

function startSpecial(f){
  let slot = specialSlot(f);
  // 横必殺を 持っていないキャラは、前を押しながらでも 通常必殺が出る
  // （前に歩きながら Bを押すのは よくあるので、出ないと 不親切）
  if (!f.ch.sp[slot] && slot === "side") slot = "neutral";
  let d = f.ch.sp[slot];
  if (!d) return;
  // 空中では べつの技になる スロット（さむらいの 下B＝地上かまえ／空中かぶとわり）
  if (d.airAlt && !f.onGround) d = d.airAlt;
  if (f.spCd[slot] > 0) return;
  // 上必殺（復帰技）は 着地するまで 1回だけ。でないと 何度でも空中に戻れてしまう
  if (slot === "up" && !f.onGround && f.upUsed) return;
  if (slot === "up" && !f.onGround) f.upUsed = true;
  // ★以前は「dive は 空中でしか 出せない」にしていたが、そのせいで 重力まるりんの
  //   下B（重り）は 地上で 押しても **なにも 起きない 死に技** だった。
  //   いまは 地上で 出すと 小さく 跳んでから 落ちる（fireSpecial の dive）。
  // 横必殺は 押した方向へ 向きなおす
  if (slot === "side"){ if (f.inp.left) f.face = -1; else if (f.inp.right) f.face = 1; }

  f.spName = d.name; f.spKind = d.t; f.spDef = d; f.spSlot = slot;
  f.spCd[slot] = d.cd; f.spCharge = 0; f.spK = 0;

  if (d.charge){                      // ため技＝ボタンを 押しているあいだ ためる
    f.spCharging = true; f.spT = 0; f.hitList = new Set();
    se("windup");
    return;
  }
  fireSpecial(f, d);
}

function endSpecial(f){
  f.spName = null; f.spKind = null; f.spDef = null; f.atkBox = null;
  f.spCharging = false; f.spCharge = 0;
  f.frozen = false; f.warpHide = false;
}

function updateSpecial(f, foe){
  const d = f.spDef;
  const m = PLATS[0];
  if (!d){ endSpecial(f); return; }

  // ---- ため中：ボタンを離すか、満タンになったら 発動 ----
  if (f.spCharging){
    f.spCharge = Math.min(d.maxT, f.spCharge + 1);
    f.vx *= 0.82;
    if (f.spCharge >= d.maxT || !f.inp.special){
      f.spCharging = false;
      fireSpecial(f, d);
    }
    return;
  }

  f.spT++;

  switch (d.t){

    // ===== とびどうぐ／しかけ を 出しておわり =====
    case "proj":
    case "pillar":
      f.vx *= 0.84;
      if (f.spT >= d.dur) endSpecial(f);
      break;

    // ===== ワープ（ゲドルフの上必殺）＝消えている間は 当たらない =====
    case "warp":
      if (f.spT < d.hide){
        f.vx = 0; f.vy = 0; f.frozen = true;
      } else if (f.spT === d.hide){
        let dx = 0;
        if (f.inp.left) dx = -1; else if (f.inp.right) dx = 1;
        f.x = Math.max(30, Math.min(W - 30, f.x + dx * d.dist));
        f.y -= d.up;
        f.warpHide = false; f.frozen = false;
        f.vy = -1.5;
        puff(f.x, f.y, 14); se("jump");
        if (d.burst) f.hitList = new Set();
      }
      // ★出てきた しゅんかんに 光が はじける（攻撃判定なしでは 弱すぎたため）
      if (d.burst && f.spT > d.hide && f.spT <= d.hide + d.burst){
        const box = spBox(f, d);
        f.atkBox = box; tryHit(f, foe, box);
        if (f.spT === d.hide + 1){
          se("smash"); shake = 7;
          for (let i=0;i<14;i++){
            const a = Math.random()*Math.PI*2, sp = 2+Math.random()*4;
            particles.push({ x:f.x, y:f.y - f.h*0.5, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                             r:2.5+Math.random()*3, life:22, t:0, c:"#ffe27a" });
          }
        }
      } else if (f.spT > d.hide) f.atkBox = null;
      if (f.spT >= d.dur){ f.warpHide = false; f.frozen = false; endSpecial(f); }
      break;

    // ===== ハンバーガー＝ダメージ％を へらす（食べおわるまで すきだらけ）=====
    case "heal":
      f.vx *= 0.7;
      if (f.spT % 8 === 0){
        particles.push({ x:f.x + (Math.random()-0.5)*20, y:f.y - f.h*0.7,
          vx:(Math.random()-0.5)*1.2, vy:-1.2, r:2.5, life:22, t:0, c:"#8ef2a0" });
      }
      if (f.spT === d.dur - 6){          // 食べおわった しゅんかんに 回復
        f.dmg = Math.max(0, f.dmg - d.amount);
        se("jump");
        for (let i=0;i<14;i++){
          const a = Math.random()*Math.PI*2;
          particles.push({ x:f.x, y:f.y - f.h*0.5, vx:Math.cos(a)*2.5, vy:Math.sin(a)*2.5,
                           r:3, life:26, t:0, c:"#8ef2a0" });
        }
      }
      if (f.spT >= d.dur) endSpecial(f);
      break;

    // ===== 引きよせる（テレキネシス／ちょうじゅうりょく）=====
    //   ダメージは 無し。あいてを こちらへ 引っぱるだけ＝場外に つれ出す ための 技
    case "pull": {
      f.vx *= 0.8;
      if (foe && foe.respawnT <= 0 && foe.invuln <= 0 && !foe.shield){
        const dx = f.x - foe.x, dy = (f.y - foe.y);
        const dist = Math.hypot(dx, dy);
        if (dist < d.reach && dist > 1){
          foe.vx += (dx / dist) * d.force;
          foe.vy += (dy / dist) * d.force * 0.5 + d.lift;
          foe.vx = Math.max(-9, Math.min(9, foe.vx));
          foe.vy = Math.max(-9, Math.min(9, foe.vy));
          if (f.spT % 4 === 0){
            const a = Math.atan2(dy, dx);
            particles.push({ x:foe.x - Math.cos(a)*10, y:foe.y - foe.h*0.5,
              vx:Math.cos(a)*3.5, vy:Math.sin(a)*3.5, r:2.5, life:16, t:0, c:"#c9a6ff" });
          }
        }
      }
      // ★魔法まるりん だけ：引きよせ おわりに 相手が しばらく 動けなくなる
      //   （ただ 引きよせるだけ だと 何が おきたか わからなかった）
      if (d.hold && f.spT === d.dur - 1 && foe && foe.respawnT <= 0 && foe.invuln <= 0 &&
          !foe.shield && Math.abs(foe.x - f.x) < d.reach * 0.55){
        foe.stun = d.hold; foe.hurtFlash = 10; se("smash");
      }
      if (f.spT >= d.dur) endSpecial(f);
      break;
    }

    // ===== あわバリアを はる =====
    case "shield":
      f.vx *= 0.80;
      if (f.spT >= d.dur) endSpecial(f);
      break;

    // ===== かまえ（さむらい）＝この間に 飛び道具を はね返す =====
    case "reflect":
      f.vx *= 0.72;
      if (f.spT <= d.active) f.reflectT = 2;   // updateProjectiles 側で使う
      if (f.spT >= d.dur) endSpecial(f);
      break;

    // ===== 復帰技（上必殺）=====
    case "rise":
      if (f.spT <= (d.push || 3)) f.vy = d.vy;
      // 浮遊（重力まるりん）＝上がりきったら その場で ふわふわ 浮く。
      //   技が おわった あとも しばらく ゆっくり 落ちる（floatT）
      if (d.float && f.spT > (d.push || 3)){
        f.vy = Math.sin(f.spT * 0.14) * 0.7;
        f.noGravity = true;
        f.floatT = 60;
      }
      if (f.inp.left)  f.vx -= d.drift;
      if (f.inp.right) f.vx += d.drift;
      f.vx = Math.max(-d.dmax, Math.min(d.dmax, f.vx));
      if (f.spT <= d.hit){
        const box = spBox(f, d);
        f.atkBox = box; tryHit(f, foe, box);
        if (d.multi && f.spT % d.multi === 0) f.hitList = new Set();
      } else f.atkBox = null;
      if (f.spT >= d.dur || (f.onGround && f.spT > 8)) endSpecial(f);
      break;

    // ===== とっしん技（横必殺）=====
    case "dash":
      if (f.spT <= d.wind){                       // ため
        f.vx *= 0.7;
        if (f.spT === d.wind){
          se("dash");
          if (d.hop){ f.vy = -d.hop; f.onGround = false; }   // アイガーニー＝とびひざ
        }
      } else if (f.spT <= d.wind + d.dur){        // 突進
        // ため技なら ためた分だけ 速く＝遠くまで行く。ためなしは ほぼその場で斬る
        const spd = d.charge ? (d.spdMin + (d.spdMax - d.spdMin) * f.spK) : d.spd;
        f.vx = spd * f.face;
        if (d.fly){ f.vy = 0; f.noGravity = true; }   // ほうきダッシュ＝水平に とぶ
        if (d.spin) f.rot += d.spin * f.face;
        const box = spBox(f, d);
        f.atkBox = box; tryHit(f, foe, box);
        if (d.ghost && f.spT % 3 === 0) ghosts.push({ x:f.x, y:f.y, face:f.face, ch:f.ch, t:0, life:14 });
        // かげわたり＝かげに なって すりぬける あいだは 当たらない
        if (d.shadow){
          f.invuln = Math.max(f.invuln, 3);
          if (f.spT % 2 === 0) ghosts.push({ x:f.x, y:f.y, face:f.face, ch:f.ch, t:0, life:12 });
        }
        if (d.flame && f.spT % 2 === 0){
          particles.push({ x:f.x - 10*f.face, y:f.y - f.h*0.5 + (Math.random()-0.5)*20,
            vx:-f.face*2, vy:-1 - Math.random(), r:4+Math.random()*4, life:16, t:0, c:"#ff9a3c" });
        }
        // ステージの端で止まる（勢いあまって 自分から 落ちないように）。
        // ※「外へ向かっているとき」だけ止める。外から中へ もどる突進は 止めない
        //   （止めてしまうと 場外から 帰ってこられなくなる）
        const goingOut = (f.face > 0 && f.x > m.x2 - 24) || (f.face < 0 && f.x < m.x1 + 24);
        if (goingOut){ f.spT = d.wind + d.dur + 1; f.vx = 0; }
      } else {                                    // 硬直（ここがスキ）
        f.atkBox = null; f.vx *= 0.80; if (d.spin) f.rot *= 0.7;
        if (f.spT >= d.wind + d.dur + d.rec){ if (d.spin) f.rot = 0; endSpecial(f); }
      }
      break;

    // ===== しっぽスピン＝その場で しっぽを ふりまわし 左右どちらの相手も ふきとばす =====
    //   ★体は 回さない（異世界編と同じ）。回すのは しっぽだけ
    case "spin":
      f.vx *= 0.72;                    // 異世界編と同じ「その場で回る」感じ
      if (f.spT >= d.hit0 && f.spT <= d.hit1){
        const box = spBox(f, d);
        f.atkBox = box; tryHit(f, foe, box);
        if (d.multi && f.spT % d.multi === 0) f.hitList = new Set();
      } else f.atkBox = null;
      if (f.spT % (d.blizzard ? 2 : 4) === 0){
        // ふぶきは 白い雪、しっぽスピンは みどりの風
        const w = d.blizzard ? 90 : 76;
        particles.push({ x:f.x + (Math.random()-0.5)*w, y:f.y - f.h*(d.blizzard ? 0.9*Math.random() : 0.45),
          vx:(Math.random()-0.5)*(d.blizzard ? 3.5 : 1.5), vy:-0.6 - Math.random()*(d.blizzard ? 1.5 : 0),
          r:2+Math.random()*2, life:d.blizzard ? 26 : 18, t:0, c:d.blizzard ? "#ffffff" : "#dff0e2" });
      }
      if (f.spT >= d.dur) endSpecial(f);
      break;

    // ===== 連打（ドリル突き・三つ首かみつき・二段斬り）=====
    //   その場から 動かずに 前だけを 何回も たたく。突進とは ちがって 前に 出ない ので、
    //   「近づいてから 出す」技。突進だらけを へらす ために 足した 型。
    case "multi":
      f.vx *= 0.80;
      if (f.spT >= d.wind && f.spT <= d.wind + d.dur){
        const box = spBox(f, d);
        f.atkBox = box; tryHit(f, foe, box);
        if (d.hits && (f.spT - d.wind) % d.hits === 0){ f.hitList = new Set(); se("hit"); }
      } else f.atkBox = null;
      if (f.spT >= d.wind + d.dur + d.rec) endSpecial(f);
      break;

    // ===== うけとめ（はっけよい）＝殴られた しゅんかんに 投げ返す =====
    case "counter":
      f.vx *= 0.7;
      if (f.spT >= d.dur) endSpecial(f);
      break;

    // ===== きゅうこうか（かぶとわり）＝真下に落ちて 着地でまわりをなぎ払う =====
    case "dive":
      // 一瞬とまってから 落ちる（地上で出した ときの 小ジャンプは 消さない）
      if (f.spT < 6){ if (f.vy > 0) f.vy = 0; f.vx *= 0.7; }
      else if (!f.onGround){
        f.vy = d.spd; f.vx *= 0.86;
        const box = spBox(f, d);
        f.atkBox = box; tryHit(f, foe, box);
      }
      if (f.onGround && f.spT > 6 && f.spT < 900){
        const box = { x:f.x, y:f.y - 16, w:d.landR*2, h:48,
                      dmg:d.landDmg, base:d.landBase, scale:d.landScale, angle:d.landAngle };
        f.hitList = new Set();
        f.atkBox = box; tryHit(f, foe, box);
        shake = 10; se("smash");
        for (let i=0;i<12;i++){
          const a = Math.PI + Math.random()*Math.PI;
          particles.push({ x:f.x + (Math.random()-0.5)*70, y:f.y, vx:Math.cos(a)*3.2, vy:-Math.abs(Math.sin(a))*3,
                           r:2.5+Math.random()*3, life:22, t:0, c:"#e8e2d0" });
        }
        f.spT = 900;
      }
      if (f.spT >= 900 + d.lag || f.spT >= d.dur + 900) endSpecial(f);
      else if (f.spT >= d.dur && f.spT < 900) endSpecial(f);
      break;

    // ===== ふみつけプレス（しこ／ずしんプレス）=====
    case "press":
      if (!f.onGround && f.spT > 4){
        f.vy += d.acc;                            // ふつうより 速く落ちる
        f.vx *= 0.9;
      }
      if (f.onGround && f.spT > 6 && f.spT < 900){
        // ドスン！＝地上にいる相手は はなれていても しびれる（空中なら 無事）
        if (foe && foe.respawnT <= 0 && foe.invuln <= 0 && foe.onGround && Math.abs(foe.x - f.x) < d.stunR){
          if (foe.shield){ foe.shield = false; foe.shieldT = 0; }   // あわバリアで しびれも ふせげる
          else { foe.stun = d.stunT; foe.hurtFlash = 10; }
        }
        const box = spBox(f, { bw:d.bw, bh:d.bh, byf:0, dmg:d.dmg, base:d.base, scale:d.scale, angle:d.angle });
        box.y = f.y - 14;
        f.atkBox = box; tryHit(f, foe, box);
        shake = 13; se("smash");
        for (let i=0;i<14;i++){
          const a = Math.PI + Math.random()*Math.PI;
          particles.push({ x:f.x + (Math.random()-0.5)*90, y:f.y, vx:Math.cos(a)*3, vy:-Math.abs(Math.sin(a))*3,
                           r:3+Math.random()*3, life:24, t:0, c:"#d8c39a" });
        }
        f.spT = 900;
      }
      if (f.spT >= 900 + d.lag) endSpecial(f);
      break;
  }
}

function boxHitsFighter(box, t){
  const tx1 = t.x - t.w/2, tx2 = t.x + t.w/2;
  const ty1 = t.y - t.h,   ty2 = t.y;
  const bx1 = box.x - box.w/2, bx2 = box.x + box.w/2;
  const by1 = box.y - box.h/2, by2 = box.y + box.h/2;
  return bx1 < tx2 && bx2 > tx1 && by1 < ty2 && by2 > ty1;
}

function tryHit(att, def, box){
  if (!def || def.respawnT > 0 || def.invuln > 0) return;
  if (att.hitList && att.hitList.has(def)) return;
  if (!boxHitsFighter(box, def)) return;
  if (att.hitList) att.hitList.add(def);
  applyHit(att, def, box, att.face);
}

function applyHit(att, def, hb, dir){
  // ★はっけよい（こうよう）＝うけとめて 投げ返す。
  //   1回だけ。うけた 攻撃が 強いほど 返しも 強い（1.4倍）。
  if (def.counterT > 0 && att && att !== def){
    def.counterT = 0;
    def.spName = null; def.spKind = null; def.spDef = null;
    def.invuln = Math.max(def.invuln, 18);
    def.face = att.x > def.x ? 1 : -1;
    const back = { dmg: Math.max(9, hb.dmg * 1.4), base: 6.2, scale: 0.115, angle: -0.55,
                   x: def.x + def.face * def.w * 0.7, y: def.y - def.h * 0.5 };
    att.dmg = Math.min(999, att.dmg + back.dmg);
    const kb = (back.base + att.dmg * back.scale) / att.ch.weight;
    att.vx = Math.cos(back.angle) * kb * def.face;
    att.vy = Math.sin(back.angle) * kb;
    att.hitstun = Math.max(14, Math.round(kb * 3.6));
    att.tumble = att.hitstun; att.hurtFlash = 14; att.onGround = false;
    att.atkName = null; att.spName = null; att.atkBox = null;
    hitstop = 14; shake = 11; se("smash");
    burst(back.x, back.y, 10);
    return;
  }
  // ★装甲（ロボット）＝あわバリアとは べつ物。はじかずに「のけぞらない」。
  //   ダメージは 6わり 入るが 止まらないので、押しながら 殴りかえせる。
  //   3回 当てられると 板が こわれる。
  if (def.shield && def.shieldHard){
    def.dmg = Math.min(999, def.dmg + hb.dmg * 0.6);
    const kb = (hb.base + def.dmg * hb.scale) / def.ch.weight * 0.35;
    def.vx = Math.cos(hb.angle) * kb * dir;
    def.vy = Math.min(0, Math.sin(hb.angle) * kb);
    def.hurtFlash = 12;
    def.armorHits--;
    if (def.armorHits <= 0){
      def.shield = false; def.shieldT = 0; def.shieldHard = false;
      se("shoot"); burst(def.x, def.y - def.h/2, 6);
      for (let i=0;i<10;i++){
        const a = Math.random()*Math.PI*2, sp = 2+Math.random()*3;
        particles.push({ x:def.x, y:def.y - def.h/2, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                         r:2.5+Math.random()*3, life:22, t:0, c:"#c8d4e4" });
      }
    }
    hitstop = 5; shake = 4; se("hit");
    burst(hb.x, hb.y, 3);
    return;
  }
  // あわバリア＝1回だけ 攻撃を はじく（ダメージも 吹っ飛びも 無し）
  if (def.shield){
    def.shield = false; def.shieldT = 0;
    def.invuln = Math.max(def.invuln, 22);
    hitstop = 6; shake = 4; se("shoot");
    for (let i=0;i<16;i++){
      const a = Math.random()*Math.PI*2, sp = 2 + Math.random()*3.5;
      particles.push({ x:def.x, y:def.y - def.h/2, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                       r:2.5+Math.random()*3, life:24, t:0, c:"rgba(180,235,255,0.95)" });
    }
    return;
  }
  // ===== キャラ固有の 特徴（1人1つ）=====
  let dmgMul = 1, kbMul = 1;
  if (att && att.ch){
    // 氷まるりん：当たった相手は しばらく 足が おそくなる
    if (att.ch.freezes) def.freezeT = Math.max(def.freezeT, att.ch.freezes);
    // ドラゴンまるりん：当てると 相手が しばらく 燃えつづける
    if (att.ch.burns){ def.burnT = Math.max(def.burnT, att.ch.burns); def.burnBy = att; }
    // ばつりん：自分の ダメージが たまるほど 強くなる（うらの力）
    if (att.ch.rage && att.dmg >= att.ch.rage){ dmgMul = 1.18; kbMul = 1.08; }
    // 織田信長：ダメージの たまった 相手に とどめが 決まりやすい
    if (att.ch.exec && def.dmg >= att.ch.exec) kbMul *= 1.35;
  }
  def.lastHitBy = att || null;
  const dealt = hb.dmg * dmgMul;
  def.dmg = Math.min(999, def.dmg + dealt);
  // こうよう：小さい 攻撃では のけぞらない（すもうの ふんばり。地上のみ）
  if (def.ch.armorUnder && dealt < def.ch.armorUnder && def.onGround){
    def.hurtFlash = 10;
    hitstop = 3; se("hit"); burst(hb.x, hb.y, 2);
    return;
  }
  const kb = (hb.base + def.dmg * hb.scale) / def.ch.weight * kbMul;
  def.vx = Math.cos(hb.angle) * kb * dir;
  def.vy = Math.sin(hb.angle) * kb;
  def.hitstun = Math.max(8, Math.round(kb * 3.4));
  def.tumble = kb > 7.5 ? def.hitstun : 0;
  def.hurtFlash = 12;
  def.onGround = false;
  def.atkName = null; def.spName = null; def.atkBox = null;

  hitstop = Math.min(14, 3 + Math.round(dealt * 0.6));
  shake = Math.min(12, 2 + kb * 0.55);
  se(kb > 9 ? "smash" : "hit");
  burst(hb.x, hb.y, kb);
}

function knockOut(f){
  if (f.respawnT > 0) return;
  // 死神まるりん：落とした 相手の 魂を 刈って 自分の ダメージが すこし 回復する
  const killer = f.lastHitBy;
  if (killer && killer !== f && killer.ch.reap && killer.respawnT <= 0){
    killer.dmg = Math.max(0, killer.dmg * (1 - killer.ch.reap));
    for (let i=0;i<14;i++){
      const a = Math.random()*Math.PI*2;
      particles.push({ x:killer.x, y:killer.y - killer.h*0.5,
        vx:Math.cos(a)*2, vy:Math.sin(a)*2 - 1, r:2+Math.random()*3,
        life:26, t:0, c:"#9fe3c0" });
    }
  }
  f.stocks--;
  f.respawnT = 70;
  f.atkBox = null; f.atkName = null; f.spName = null;
  shake = 14; hitstop = 8;
  se("ko");
  // 画面のふちに爆発
  const ex = Math.max(20, Math.min(W-20, f.x));
  const ey = Math.max(20, Math.min(H-20, f.y - f.h/2));
  for (let i=0;i<26;i++){
    const a = Math.random()*Math.PI*2, sp = 3 + Math.random()*7;
    particles.push({ x:ex, y:ey, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:3+Math.random()*4,
                     life:36, t:0, c:"#ffd54a" });
  }
  if (f.stocks <= 0){
    winner = fighters.find(o => o !== f);
    state = "result"; resultT = 0;
  }
}

// ============================================================
//  飛び道具・エフェクト
// ============================================================
function updateProjectiles(){
  for (let i = projectiles.length - 1; i >= 0; i--){
    const s = projectiles[i];
    s.t++;
    if (s.pillar){
      // ひかりの柱＝しるしが出ている あいだは 何も起きない（よけられる）
      if (s.t <= s.mark){ if (s.t >= s.life) projectiles.splice(i,1); continue; }
      if (s.t === s.mark + 1){ se("smash"); shake = 9; }
    } else {
      // ひかりのたま だけは あいてを おいかけて じわっと 曲がる（異世界編と同じ）
      if (s.steer){
        const tgt = fighters.find(f2 => f2 !== s.owner && f2.respawnT <= 0);
        if (tgt){
          const dx = tgt.x - s.x, dy = (tgt.y - tgt.h/2) - s.y;
          const dist = Math.hypot(dx, dy) || 1;
          const sp = Math.hypot(s.vx, s.vy) || 1;
          s.vx += (dx/dist*sp - s.vx) * s.steer;
          s.vy += (dy/dist*sp - s.vy) * s.steer;
        }
      }
      // それ以外は まっすぐ飛ぶ（重力なし）。
      // 途中で 下に落ちると 狙って撃てないので、落下は かけない。
      s.x += s.vx; s.y += s.vy;
    }
    // ★飛び道具は ステージの 外まで 追いかけない。
    //   場外で ずっと 撃たれると 復帰できなく なるので、崖から 110px で 消える。
    const stg = PLATS[0];
    let gone = s.t > s.life ||
               (!s.pillar && (s.x < stg.x1 - 110 || s.x > stg.x2 + 110 || s.y > H+60 || s.y < -90));

    // ブラックホール（重力まるりん）＝そばに いる 相手を じわじわ 吸いこむ
    if (s.suck){
      for (const f of fighters){
        if (f === s.owner || f.respawnT > 0 || f.ledge) continue;
        const dx = s.x - f.x, dy = s.y - (f.y - f.h*0.5);
        const dist = Math.hypot(dx, dy);
        if (dist < s.suck && dist > 1){
          const pw = (1 - dist/s.suck) * 0.6;
          f.vx += (dx/dist) * pw;
          f.vy += (dy/dist) * pw * 0.75;
        }
      }
    }
    for (const f of fighters){
      if (f === s.owner || f.respawnT > 0) continue;
      if (!boxHitsFighter(s, f)) continue;
      // かまえ（さむらい）＝飛び道具を はね返す。相手の技が こちらの技になる
      if (f.reflectT > 0 && !s.pillar){
        s.vx = -s.vx * 1.35; s.vy = -Math.abs(s.vy) * 0.4;
        s.owner = f; s.t = 0; s.life = Math.max(s.life, 70);
        s.dmg *= 1.4; s.base *= 1.15;
        s.x += s.vx; hitstop = 5; shake = 4; se("shoot");
        burst(s.x, s.y, 4);
        break;
      }
      if (f.invuln > 0) continue;
      // 柱は 真上から落ちるので、当たった人が いる側へ ふきとばす
      const dir = s.pillar ? (Math.sign(f.x - s.x) || 1) : (Math.sign(s.vx) || 1);
      applyHit(s.owner, f, s, dir);
      gone = true; break;
    }
    if (gone) projectiles.splice(i,1);
  }
  // ざんぞう（しゅくちぎり）
  for (let i = ghosts.length - 1; i >= 0; i--){
    if (++ghosts[i].t >= ghosts[i].life) ghosts.splice(i,1);
  }
}
function burst(x, y, power){
  const n = Math.min(18, 5 + Math.round(power));
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 1.5 + Math.random()*(2 + power*0.35);
    particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1,
                     r:2 + Math.random()*3.4, life:20 + Math.random()*12, t:0, c:"#fff2b0" });
  }
  particles.push({ x, y, r:6 + power*1.6, life:9, t:0, flash:true, vx:0, vy:0, c:"#fff" });
}
function puff(x, y, n){
  for (let i=0;i<n;i++){
    const a = Math.PI + Math.random()*Math.PI, sp = 1 + Math.random()*2;
    particles.push({ x, y, vx:Math.cos(a)*sp, vy:-Math.sin(a)*sp*0.6 + 0.6,
                     r:3 + Math.random()*3, life:18, t:0, c:"rgba(255,255,255,0.75)" });
  }
}
function updateParticles(){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.t++; p.x += p.vx; p.y += p.vy;
    if (!p.flash) p.vy += 0.16;
    if (p.t >= p.life) particles.splice(i,1);
  }
}

// ============================================================
//  BGM（ステージの曲）
//    ★異世界編 ステージ1「はじまりの草原」の曲（元＝tanoshiibouken.mp3／
//      異世界編の audio/bgm_isekai1.mp3）。
//      世界編ステージ1「くさはら」の曲とは 別物なので まちがえない こと。
//    ブラウザは 画面を さわる前に 音を 鳴らせないので、
//    「はじめる！」を おした ときに 鳴らしはじめる。
// ============================================================
let bgm = null, bgmOn = true;
try {
  bgm = new Audio("audio/bgm_kusahara.mp3");
  bgm.loop = true;
  bgm.volume = 0.13;      // 世界編・異世界編と同じくらいの 小音量（0.28では 大きすぎた）
  bgm.preload = "auto";
} catch(e){ bgm = null; }
try { bgmOn = localStorage.getItem("maruring_smash_bgm") !== "off"; } catch(e){}

function startBGM(){
  if (!bgm || !bgmOn) return;
  try { bgm.currentTime = 0; const p = bgm.play(); if (p && p.catch) p.catch(() => {}); } catch(e){}
}
function stopBGM(){ if (!bgm) return; try { bgm.pause(); } catch(e){} }
function setBGM(on){
  bgmOn = on;
  try { localStorage.setItem("maruring_smash_bgm", on ? "on" : "off"); } catch(e){}
  if (!on) stopBGM();
  else if (state === "fight") startBGM();
}

// ============================================================
//  かんたんな効果音（音声ファイル不要・その場で合成）
// ============================================================
let actx = null;
function se(kind){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch(e){ return; }
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.connect(g); g.connect(actx.destination);
  let f0 = 400, f1 = 200, dur = 0.09, vol = 0.10, type = "square";
  if (kind === "jump")   { f0=380; f1=760; dur=0.10; vol=0.05; type="sine"; }
  if (kind === "hit")    { f0=300; f1=110; dur=0.09; vol=0.10; }
  if (kind === "smash")  { f0=200; f1=60;  dur=0.20; vol=0.15; type="sawtooth"; }
  if (kind === "shoot")  { f0=700; f1=380; dur=0.07; vol=0.05; type="triangle"; }
  if (kind === "windup") { f0=140; f1=260; dur=0.22; vol=0.05; type="sine"; }
  if (kind === "dash")   { f0=520; f1=180; dur=0.14; vol=0.08; type="sawtooth"; }
  if (kind === "ko")     { f0=520; f1=70;  dur=0.45; vol=0.16; type="sawtooth"; }
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}

// ============================================================
//  CPU（かんたんな相手）
// ============================================================
function cpuThink(f, foe){
  const d = blankInput();
  if (!foe || f.respawnT > 0) return d;
  const main = PLATS[0];
  const dx  = foe.x - f.x;
  const dy  = (foe.y - foe.h/2) - (f.y - f.h/2);   // マイナス＝相手が上
  const adx = Math.abs(dx), ady = Math.abs(dy);
  const reach = 40 + f.ch.w * 0.5;                 // 攻撃が届くくらいの距離
  let move = 0, jump = false;

  if (f.x < main.x1 + 8 || f.x > main.x2 - 8){
    // --- 場外：とにかくステージに戻る ---
    move = (f.x < main.x1 + 8) ? 1 : -1;
    if (!f.onGround && (f.vy > 0.5 || f.y > GROUND_Y - 40)) jump = (frame % 10 < 2);
    // 空中ジャンプを使いきって まだ下にいるなら 上必殺で 復帰する
    if (!f.onGround && f.airJumpsLeft <= 0 && !f.upUsed && f.vy > 1 && f.spCd.up <= 0){
      if (move > 0) d.right = true; else d.left = true;
      d.up = true; d.special = true;
      return d;
    }
  } else if (dy < -55){
    // --- 相手が上にいる：真下にもぐりこんでから跳ぶ ---
    if (adx > 26) move = dx > 0 ? 1 : -1;
    if (f.onGround) { if (adx < 110) jump = true; }
    // 空中ジャンプは「のぼりきる ちょっと前」から つなぐ。
    // 落ちきってから だと 高さが たりず 足場に とどかない
    else if (f.vy > -2.5 && ady > 45 && f.airJumpsLeft > 0) jump = true;
  } else if (dy > 60){
    // --- 相手が下にいる：足場から おりる ---
    //   ★これが 無いと、上の足場に 乗ったまま その場で 跳びつづけて 試合が 進まなかった
    if (adx > 24) move = dx > 0 ? 1 : -1;
    else move = (f.x > (main.x1 + main.x2) / 2) ? 1 : -1;   // 真下なら よこへ はずれて 落ちる
    // 上へ 跳んでも しかたないので ジャンプは しない
  } else {
    // --- 同じくらいの高さ：間合いをとる ---
    if (adx > reach)            move = dx > 0 ? 1 : -1;
    else if (adx < reach * 0.45) move = dx > 0 ? -1 : 1;
    if (f.onGround && frame % 150 < 2) jump = true;
  }
  if (move > 0) d.right = true; else if (move < 0) d.left = true;

  // ★ジャンプは「押しっぱなし」に する。
  //   2フレームだけ 押すと 可変ジャンプの 減速（vy*=0.86）で つぶれて、
  //   本来 108px とべる キャラが 54px しか 上がらなかった。
  if (jump && f.cpuJumpHold <= 0 && f.cpuJumpCool <= 0){ f.cpuJumpHold = 13; f.cpuJumpCool = 16; }
  if (f.cpuJumpHold > 0){ d.jump = true; f.cpuJumpHold--; }
  if (f.cpuJumpCool > 0) f.cpuJumpCool--;

  // 上に とどかないときは 上必殺（復帰技）で のぼる
  if (!f.onGround && dy < -40 && f.airJumpsLeft <= 0 && !f.upUsed && f.spCd.up <= 0 && f.vy > -1){
    d.up = true; d.special = true;
  }

  // --- 攻撃 ---
  if (adx < reach + 20 && ady < 65 && frame % 18 < 2) d.attack = true;
  if (dy < -25 && dy > -115 && adx < 55 && frame % 22 < 2){ d.up = true; d.attack = true; }

  // --- 必殺技（間合いで 使いわける）---
  if (f.onGround && f.hitstun <= 0){
    // 遠い＝通常必殺（とびどうぐ）
    if (adx > 150 && ady < 70 && f.spCd.neutral <= 0 && frame % 66 < 2){
      d.special = true;
      d.left = d.right = d.up = d.down = false;
    }
    // 中くらい＝横必殺（とっしん）
    else if (adx > 90 && adx < 330 && ady < 50 && f.spCd.side <= 0 && frame % 104 < 2){
      d.special = true; d.up = d.down = false;
      if (dx > 0){ d.right = true; d.left = false; } else { d.left = true; d.right = false; }
    }
    // 近い＝下必殺（しこ／あわバリア）
    else if (adx < 130 && ady < 60 && f.spCd.down <= 0 && frame % 150 < 2){
      d.special = true; d.down = true;
      d.left = d.right = d.up = false;
    }
  }
  return d;
}

// ============================================================
//  描画
// ============================================================
function drawBg(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#1b2450"); g.addColorStop(0.55,"#2a3566"); g.addColorStop(1,"#3d3f6e");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // 遠景の丘
  ctx.fillStyle = "rgba(255,255,255,0.05)";
  for (let i=0;i<4;i++){
    const cx = 120 + i*250, r = 150 + i*22;
    ctx.beginPath(); ctx.arc(cx, H+60, r, Math.PI, 0); ctx.fill();
  }
  // 星
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  for (let i=0;i<30;i++){
    const x = (i*137) % W, y = (i*89) % 240;
    const tw = 1 + Math.sin(frame*0.05 + i)*0.6;
    ctx.beginPath(); ctx.arc(x, y, tw, 0, 7); ctx.fill();
  }
}
function drawStage(){
  // 本体
  const m = PLATS[0];
  ctx.fillStyle = "#6b4a2f";
  ctx.fillRect(m.x1, m.y, m.x2-m.x1, 120);
  ctx.fillStyle = "#8a6340";
  ctx.fillRect(m.x1, m.y, m.x2-m.x1, 16);
  ctx.fillStyle = "#4aa84a";
  ctx.fillRect(m.x1, m.y-8, m.x2-m.x1, 12);
  ctx.fillStyle = "#57c257";
  for (let x = m.x1; x < m.x2; x += 22){
    ctx.beginPath(); ctx.ellipse(x+11, m.y-8, 12, 6, 0, Math.PI, 0); ctx.fill();
  }
  // すり抜け床
  for (let i=1;i<PLATS.length;i++){
    const p = PLATS[i];
    ctx.fillStyle = "#7d6bd0";
    roundRect(p.x1, p.y-10, p.x2-p.x1, 14, 6); ctx.fill();
    ctx.fillStyle = "#9c8ce8";
    roundRect(p.x1, p.y-10, p.x2-p.x1, 5, 3); ctx.fill();
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x,y,w,h,r);
  else ctx.rect(x,y,w,h);
}

// キャラ別の 絵を よびわける（キャラ選択画面の 顔アイコンでも 同じものを使う）
const CHAR_DRAW = {
  maru: drawMaru, kouyou: drawKouyou, zagat: drawZagat,
  dragon: drawDragon, samurai: drawSamurai, ice: drawIce, gedorufu: drawGedorufu,
  penguins: drawPenguins, clovis: drawClovis, dramp: drawDramp,
  nobunaga: drawNobunaga, batsurin: drawBatsurin,
  reaper: drawReaper, robot: drawRobot,
  magic: drawMagic, gravity: drawGravity, cerberus: drawCerberus, fairy: drawFairy,
};
function drawChar(f){ (CHAR_DRAW[f.ch.key] || drawMaru)(f); }

// 相方（ニセペギ）＝本人の うしろに、おくれて ついてくる
function drawPal(f){
  const p = f.pal;
  if (!p || !p.hist.length || f.respawnT > 0 || f.warpHide) return;
  ctx.save();
  ctx.globalAlpha = 0.96;
  ctx.translate(p.x, p.y);
  ctx.scale(p.face, 1);
  drawPenguin({ w:f.w*0.94, h:f.h*0.94, hurtFlash:0 }, true);
  ctx.restore();
}

function drawFighter(f){
  if (f.warpHide) return;              // ワープで 消えている
  if (f.respawnT > 0){
    // 復活台
    if (f.respawnT < 40){
      ctx.save(); ctx.globalAlpha = 0.6;
      ctx.fillStyle = "#8fd6ff";
      roundRect(W/2-34, 66, 68, 8, 4); ctx.fill();
      ctx.restore();
    }
    return;
  }
  // 崖つかみ：「ジャンプで のぼれるよ」の やじるし（点滅中でも 出したまま）
  if (f.ledge && !f.isCPU){
    ctx.save();
    ctx.translate(f.x, PLATS[0].y - 84 + Math.sin(frame * 0.18) * 3);
    ctx.fillStyle = "#ffd23f"; ctx.strokeStyle = "#17263f"; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(0, -11); ctx.lineTo(9, 1); ctx.lineTo(3.6, 1);
    ctx.lineTo(3.6, 9); ctx.lineTo(-3.6, 9); ctx.lineTo(-3.6, 1); ctx.lineTo(-9, 1);
    ctx.closePath(); ctx.stroke(); ctx.fill();
    ctx.restore();
  }
  if (f.invuln > 0 && Math.floor(f.invuln/4) % 2 === 0) return;   // 点滅

  ctx.save();
  ctx.translate(f.x, f.y);
  if (f.rot) ctx.rotate(f.rot);
  ctx.scale(f.face, 1);
  const sq = f.squash;
  ctx.scale(1 + (1-sq)*0.4, sq);

  drawChar(f);
  ctx.restore();

  // 崖つかみ：崖の 角に かけた 手（キャラの 上に かさねる）
  if (f.ledge){
    const ex = f.ledge.side < 0 ? PLATS[0].x1 : PLATS[0].x2;
    ctx.save();
    ctx.fillStyle = "#fff4e2"; ctx.strokeStyle = "#3a2a17"; ctx.lineWidth = 1.8;
    for (const k of [4, 14]){
      ctx.beginPath();
      ctx.ellipse(ex - f.ledge.side * k, PLATS[0].y - 3, 5.4, 4.6, 0, 0, 7);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // こおり（氷まるりんに 当てられた）＝体に 水色の こおりが つく
  if (f.freezeT > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(0.55, 0.2 + f.freezeT / 140);
    ctx.translate(f.x, f.y - f.h * 0.5);
    ctx.fillStyle = "#bfeaff";
    ctx.beginPath(); ctx.ellipse(0, 0, f.w * 0.56, f.h * 0.56, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++){
      const a = i * 2.1 + 0.4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*f.w*0.4, Math.sin(a)*f.h*0.42);
      ctx.lineTo(Math.cos(a+1.2)*f.w*0.3, Math.sin(a+1.2)*f.h*0.3);
      ctx.stroke();
    }
    ctx.restore();
  }
  // やけど（ドラゴンまるりんに 当てられた）＝あたまの上で 小さな 炎
  if (f.burnT > 0){
    ctx.save();
    ctx.translate(f.x, f.y - f.h - 4);
    for (let i = -1; i <= 1; i++){
      const w = 3.4 + Math.sin(frame * 0.4 + i) * 1.1;
      ctx.fillStyle = i === 0 ? "rgba(255,220,120,0.95)" : "rgba(255,140,50,0.85)";
      ctx.beginPath();
      ctx.moveTo(i*7 - w, 4);
      ctx.quadraticCurveTo(i*7 - w, -6, i*7, -11 - w);
      ctx.quadraticCurveTo(i*7 + w, -6, i*7 + w, 4);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  // 構え（さむらいの 下必殺）：はね返せる あいだ だけ 前に 光る かべ。
  //   立ちポーズと 見分けが つかず「いつ 効いているのか」が わからなかった。
  if (f.reflectT > 0){
    ctx.save();
    ctx.translate(f.x + f.face * f.w * 0.62, f.y - f.h * 0.52);
    const w = 7, h = f.h * 0.85;
    const sh = 0.55 + 0.45 * Math.sin(frame * 0.5);
    ctx.fillStyle = "rgba(180,225,255," + (0.22 + sh*0.2).toFixed(2) + ")";
    roundRect(-w, -h/2, w*2, h, w); ctx.fill();
    ctx.strokeStyle = "rgba(225,245,255," + (0.7 + sh*0.3).toFixed(2) + ")"; ctx.lineWidth = 2.4;
    roundRect(-w, -h/2, w*2, h, w); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 1.4;
    for (let i = -1; i <= 1; i++){
      const yy = ((frame * 2 + i * 20) % h) - h/2;
      ctx.beginPath(); ctx.moveTo(-w*0.6, yy); ctx.lineTo(w*0.6, yy - 4); ctx.stroke();
    }
    ctx.restore();
  }
  // 装甲（ロボットの 下必殺）：あわバリアと 見分けが つくよう **かたい板**で 表す
  if (f.shield && f.shieldHard){
    const k = f.h / 56;
    const sh = 0.55 + 0.45 * Math.sin(frame * 0.12);
    const fade = f.shieldT < 50 ? (0.45 + 0.55*Math.abs(Math.sin(frame*0.35))) : 1;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(f.x, f.y - f.h * 0.5);
    for (const sd of [-1, 1]){                       // 肩の 板
      ctx.save(); ctx.translate(sd * f.w * 0.52, 0); ctx.rotate(sd * 0.26); ctx.scale(k, k);
      ctx.fillStyle = "#e9eff7"; roundRect(-7, -11, 14, 22, 5); ctx.fill();
      ctx.strokeStyle = "#6e7c93"; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.strokeStyle = "rgba(70,224,255," + (0.5 + sh*0.45) + ")"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-4, 3); ctx.lineTo(4, 3); ctx.stroke();
      ctx.restore();
    }
    ctx.save(); ctx.scale(k, k);                     // 胸の 板
    ctx.fillStyle = "#b3c0d2"; roundRect(-9, -2, 18, 13, 4); ctx.fill();
    ctx.strokeStyle = "#6e7c93"; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = "rgba(70,224,255," + (0.35 + sh*0.4) + ")";
    roundRect(-6, 1, 12, 3, 1.5); ctx.fill();
    // のこりの 板の 数（3→0）
    ctx.fillStyle = "#fff";
    for (let i = 0; i < f.armorHits; i++){
      ctx.beginPath(); ctx.arc(-5 + i*5, -6, 1.7, 0, 7); ctx.fill();
    }
    ctx.restore();
    ctx.restore();
  }
  // あわバリア（まるりんの 下必殺）：半とうめいの あわで つつむ
  if (f.shield && !f.shieldHard){
    const rr = f.h * 0.72 + Math.sin(frame * 0.2) * 1.8;
    const fade = f.shieldT < 50 ? (0.4 + 0.6*Math.abs(Math.sin(frame*0.35))) : 1;  // 切れる前は 点滅
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(f.x, f.y - f.h/2);
    ctx.fillStyle = "rgba(175,230,255,0.20)";
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(150,220,255,0.9)"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, 7); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.beginPath(); ctx.ellipse(-rr*0.4, -rr*0.45, 3.5, 6.5, -0.5, 0, 7); ctx.fill();
    ctx.restore();
  }

  // ため中：頭の上に ゲージ（どれだけ ためたか 見えるように）
  if (f.spCharging && f.spDef){
    const k = f.spCharge / f.spDef.maxT;
    // 兜・ぼうしなど 頭の かざりが f.h より上に出るキャラが いるので 高めに置く
    const bw = 36, bh = 6, bx = f.x - bw/2, by = f.y - f.h - 50;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(bx-1, by-1, bw+2, bh+2, 3); ctx.fill();
    ctx.fillStyle = k >= 1 ? "#ff5f6d" : "#ffd54a";
    roundRect(bx, by, bw*k, bh, 2); ctx.fill();
    if (k >= 1){                      // 満タン＝ぴかぴか光る
      ctx.globalAlpha = 0.35 + Math.abs(Math.sin(frame*0.4))*0.4;
      ctx.fillStyle = "#fff";
      roundRect(bx, by, bw, bh, 2); ctx.fill();
    }
    ctx.restore();
  }

  // しこ を くらって しびれ中：頭の上で星がくるくる
  if (f.stun > 0){
    ctx.save();
    ctx.translate(f.x, f.y - f.h - 12);
    for (let i=0;i<3;i++){
      const a = frame * 0.16 + i * (Math.PI*2/3);
      ctx.fillStyle = "#ffe14d";
      ctx.save(); ctx.translate(Math.cos(a)*13, Math.sin(a)*5); ctx.rotate(a);
      ctx.beginPath();
      for (let k=0;k<5;k++){
        const ang = k*(Math.PI*2/5) - Math.PI/2;
        ctx.lineTo(Math.cos(ang)*5, Math.sin(ang)*5);
        ctx.lineTo(Math.cos(ang + Math.PI/5)*2.2, Math.sin(ang + Math.PI/5)*2.2);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    ctx.restore();
  }

  // プレイヤー番号のしるし（頭の上の三角）
  ctx.save();
  ctx.fillStyle = f.pi === 0 ? "#ff5f6d" : "#4fb4ea";
  const my = f.y - f.h - 14;      // 背の高いキャラの 頭かざりと かぶらないよう 少し上げる
  ctx.beginPath();
  ctx.moveTo(f.x, my);
  ctx.lineTo(f.x - 7, my - 12);
  ctx.lineTo(f.x + 7, my - 12);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// --- まるりん（世界編の絵をそのまま移植）---
// スキル姿（ドラゴン／さむらい）も この絵を土台にして、
// o.behind＝体のうしろ、o.front＝体の手前 に かざりを足すだけで作れる。
function drawMaru(f, o){
  o = o || {};
  const sc = f.h / 42;
  ctx.save();
  ctx.scale(sc, sc);
  ctx.translate(0, -21);      // 足元が原点になるように
  const flash = f.hurtFlash > 0 && Math.floor(f.hurtFlash/3) % 2 === 0;
  const run = Math.abs(f.vx) > 0.5 && f.onGround;
  const air = !f.onGround;
  const legPhase = Math.sin(f.animT * 0.4);
  const bodyR = 17;

  // 影
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath(); ctx.ellipse(0, 18, 15, 4, 0, 0, 7); ctx.fill();
  // 後ろ足
  ctx.fillStyle = "#f6e2c0";
  const fs = run ? legPhase*6 : (air ? -3 : 0);
  ctx.beginPath(); ctx.ellipse(-6, 15 - fs*0.3, 6, 5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 7, 15 + fs*0.3, 6, 5, 0, 0, 7); ctx.fill();

  // はねジャンプ（上必殺）：背中に 白いはねが 生えて パタパタする
  if (f.spDef && f.spDef.wings){
    const wf = Math.sin(f.spT * 0.7) * 0.6;
    for (const s of [-1, 1]){
      ctx.save();
      ctx.translate(s*12, -4);
      ctx.rotate(s*(0.55 + wf));
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.beginPath(); ctx.ellipse(0, 0, 6, 14, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(150,200,240,0.8)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0, 0, 6, 14, 0, 0, 7); ctx.stroke();
      ctx.restore();
    }
  }
  if (o.behind) o.behind(f, flash);        // つばさ・しっぽ・陣羽織 など（体のうしろ）
  // 体
  ctx.fillStyle = flash ? "#ffd7d7" : (o.bodyA || "#b8bcc4");
  ctx.beginPath(); ctx.ellipse(0, 0, bodyR, bodyR+2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = flash ? "#ffc2c2" : (o.bodyB || "#a7abb4");

  ctx.fillStyle = "#e2d0ac";
  ctx.beginPath(); ctx.ellipse(-9, -14, 2.4, 3, -0.3, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 9, -14, 2.4, 3,  0.3, 0, 7); ctx.fill();
  // お腹
  ctx.fillStyle = "#fbf3e2";
  ctx.beginPath(); ctx.ellipse(3, 3, 13, 15, 0, 0, 7); ctx.fill();
  // ほっぺ
  ctx.fillStyle = "#f7d3ca";
  ctx.beginPath(); ctx.arc(-2, 2, 3.2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(12, 2, 3.2, 0, 7); ctx.fill();
  // 目
  ctx.fillStyle = "#4fb4ea";
  ctx.beginPath(); ctx.arc(2, -4, 5.4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -4, 4.8, 0, 7); ctx.fill();
  ctx.fillStyle = "#15151a";
  ctx.beginPath(); ctx.arc(2, -4, 4.2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -4, 3.6, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(3.4, -5.2, 1.4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(14, -5, 1.2, 0, 7); ctx.fill();
  // 鼻
  ctx.fillStyle = "#161619";
  ctx.beginPath(); ctx.ellipse(8, 1, 4.6, 3.9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.beginPath(); ctx.arc(6.6, -0.4, 1.3, 0, 7); ctx.fill();
  // 口
  ctx.strokeStyle = "#3a3128"; ctx.lineWidth = 1.4; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(8, 4); ctx.quadraticCurveTo(5, 8, 2, 5.5);
  ctx.moveTo(8, 4); ctx.quadraticCurveTo(11, 8, 14, 5.5);
  ctx.stroke();
  // 前足（攻撃中は前に突き出す）
  const swing = run ? legPhase * 2 : 0;
  const punch = (f.atkName === "side" || f.atkName === "air") ? 9 : 0;
  const lift  = air ? -2 : 0;
  ctx.fillStyle = "#f6e2c0";
  ctx.beginPath(); ctx.ellipse(-13, 8 + lift - swing, 3.3, 4.2, 0, 0, 7); ctx.fill();

  ctx.fillStyle = "#f0bd98";

  ctx.beginPath(); ctx.arc(15 + punch, 9 + lift + swing - punch*0.4, 1.6, 0, 7); ctx.fill();
  if (o.front) o.front(f, flash, punch);   // つの・はちまき・刀 など（体の手前）
  ctx.restore();
}
