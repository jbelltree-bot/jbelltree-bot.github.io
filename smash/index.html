// --- ばつりん（異世界編 batsuRealBody の移植）＝まるりんの「うら」---
function drawBatsurin(f){
  const sc = f.h / 59;                  // 元の絵は だいたい 59 の 高さ
  const hurt = f.hurtFlash > 0 && Math.floor(f.hurtFlash/4) % 2 === 0;
  const rolling = f.spKind === "dash" && f.spDef && f.spT > f.spDef.wind;
  ctx.save();
  ctx.scale(sc, sc);
  ctx.translate(0, -27);
  if (rolling){
    // まるまった すがた（ころがる中）
    ctx.fillStyle = hurt ? "#ffffff" : "#c9c3d8";
    ctx.beginPath(); ctx.arc(0, 6, 25, 0, 7); ctx.fill();
    ctx.fillStyle = hurt ? "#ffffff" : "#e4e0ee";
    ctx.beginPath(); ctx.arc(3, 9, 15, 0, 7); ctx.fill();
    ctx.strokeStyle = "#7b7392"; ctx.lineWidth = 1.4;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(-19, -5); ctx.lineTo(-8, 1); ctx.lineTo(-16, 10); ctx.lineTo(-4, 17);
    ctx.stroke();
    // ★ばつ印（ころがって いる ときも 見える。異世界編の drawBatsuBall と 同じ）
    ctx.save();
    ctx.translate(9, -6); ctx.rotate(0.15);
    ctx.strokeStyle = "#a33c58"; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(-4.6, -4.6); ctx.lineTo(4.6, 4.6);
    ctx.moveTo(4.6, -4.6); ctx.lineTo(-4.6, 4.6);
    ctx.stroke();
    ctx.restore();
    ctx.restore(); return;
  }
  // からだ（耳・足・胴を まとめて ひとつの かたちに）
  ctx.beginPath();
  const el2 = (x, y, rx, ry, rot) => {
    ctx.moveTo(x + rx * Math.cos(rot), y + rx * Math.sin(rot));
    ctx.ellipse(x, y, rx, ry, rot, 0, 7);
  };
  el2(-8, 20.5, 8, 6.4, 0);
  el2(9.5, 20.5, 8, 6.4, 0);
  el2(-13, -23, 6.6, 9, -0.32);
  el2(13, -23, 6.6, 9, 0.32);
  el2(0, 0, 22.5, 25.5, 0);
  el2(11, 3, 12, 13, 0);
  ctx.fillStyle = hurt ? "#ffffff" : "#c9c3d8"; ctx.fill();
  ctx.fillStyle = hurt ? "#ffffff" : "#e4e0ee";
  ctx.beginPath(); ctx.ellipse(4, 5, 13, 14, 0, 0, 7); ctx.fill();
  ctx.fillStyle = hurt ? "#f2f2f8" : "#b3aac6";
  ctx.beginPath(); ctx.ellipse(-13, -22, 3.2, 4.6, -0.32, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -22, 3.2, 4.6, 0.32, 0, 7); ctx.fill();
  // ひび（みみの つけねから 足もとまで）
  ctx.strokeStyle = "#7b7392"; ctx.lineWidth = 1.2;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(-11, -23);
  ctx.lineTo(-17, -13); ctx.lineTo(-10, -4); ctx.lineTo(-17, 5);
  ctx.lineTo(-9, 13); ctx.lineTo(-12, 22);
  ctx.moveTo(-10, -4); ctx.lineTo(-1, -1); ctx.lineTo(3, 8);
  ctx.moveTo(-17, 5); ctx.lineTo(-22, 2);
  ctx.moveTo(-5, -21); ctx.lineTo(-9, -14); ctx.lineTo(-4, -8);
  ctx.stroke();
  // 左目＝とじた まま
  ctx.strokeStyle = "#4a4560"; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-3.4, -6); ctx.quadraticCurveTo(2, -2.4, 7, -6); ctx.stroke();
  // 右目＝まるりんと 同じ
  const dizzy = f.stun > 0;
  if (dizzy){
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(14, -6, 5.4, 0, 7); ctx.fill();
    ctx.strokeStyle = "#4a4560"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i <= 22; i++){
      const a = i * 0.52, rr = i * 0.235;
      const xx = 14 + Math.cos(a) * rr, yy = -6 + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
    }
    ctx.stroke();
  } else {
    ctx.fillStyle = "#4fb4ea";
    ctx.beginPath(); ctx.arc(14, -6, 5.4, 0, 7); ctx.fill();
    ctx.fillStyle = "#15151a";
    ctx.beginPath(); ctx.arc(14, -6, 4.1, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(15.2, -7.4, 1.5, 0, 7); ctx.fill();
  }
  // はなと まっすぐな 口
  ctx.fillStyle = "#4a4560";
  ctx.beginPath(); ctx.ellipse(9, 2, 5.0, 4.2, 0, 0, 7); ctx.fill();
  const mouth = (f.spKind === "proj" && f.spT < 12) ? 0.45 : 0;
  if (mouth > 0.02){
    // 口を あける（たね）。前歯が 見える＝異世界編と 同じ 出しかた
    const mh = 2.5 + mouth * 8, mw = 5 + mouth * 7, my = 8 + mouth * 2;
    ctx.fillStyle = "#3a2130";
    ctx.beginPath(); ctx.ellipse(10.5, my, mw, mh, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffffff";
    const th = 3 + mouth * 2.6;
    ctx.fillRect(7.2, my - mh, 3.6, th);
    ctx.fillRect(11.6, my - mh, 3.6, th);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.fillRect(7.6, my + mh - th * 0.6, 7.4, th * 0.6);
  } else {
    // 「おこって いるのか かなしいのか 分からない」少し しなった 口（原作どおり）
    ctx.strokeStyle = "#4a4560"; ctx.lineWidth = 1.7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(4, 9); ctx.quadraticCurveTo(9, 7.4, 15, 8.6); ctx.stroke();
  }
  // ★ばつ印（左の こめかみ）＝ばつりんの いちばんの 目じるし。
  //   移植したとき 入れわすれて いて、ユーザーに「×マークが ない」と 指摘された。
  //   異世界編 `batsuRealBody` と 同じ 位置・角度・色。
  ctx.save();
  ctx.translate(-12, -9); ctx.rotate(0.15);
  ctx.strokeStyle = "#a33c58"; ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(-4.2, -4.2); ctx.lineTo(4.2, 4.2);
  ctx.moveTo(4.2, -4.2); ctx.lineTo(-4.2, 4.2);
  ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// --- 大まどうし ゲドルフ（異世界編ステージ2のボス）---
function drawGedorufu(f){
  const W2 = f.w, H2 = f.h;
  const flash = f.hurtFlash > 0 && Math.floor(f.hurtFlash/3) % 2 === 0;
  const robe  = flash ? "#c9a6e8" : "#4b3a7a";
  const robeD = flash ? "#b48fd8" : "#382a5e";
  const cast  = f.spKind === "proj" || f.spKind === "pillar";

  // 影
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath(); ctx.ellipse(0, 2, W2*0.55, 7, 0, 0, 7); ctx.fill();

  // ローブ（すそが 広がった 三角）
  ctx.fillStyle = robe;
  ctx.beginPath();
  ctx.moveTo(-W2*0.20, -H2*0.72);
  ctx.lineTo( W2*0.20, -H2*0.72);
  ctx.lineTo( W2*0.58, 0);
  ctx.lineTo(-W2*0.58, 0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = robeD;
  ctx.beginPath();
  ctx.moveTo(-4, -H2*0.72); ctx.lineTo(4, -H2*0.72); ctx.lineTo(10, 0); ctx.lineTo(-10, 0);
  ctx.closePath(); ctx.fill();
  // ★金の ふちどり（異世界編 drawWizardBoss の #d8b955）＝移植で 抜けていた
  ctx.strokeStyle = "#d8b955"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-4, -H2*0.72); ctx.lineTo(-10, 0);
  ctx.moveTo( 4, -H2*0.72); ctx.lineTo( 10, 0);
  ctx.stroke();

  // つえ（先の玉が 技のときに 光る）
  ctx.save();
  ctx.translate(W2*0.44, -H2*0.34); ctx.rotate(0.12);
  ctx.strokeStyle = "#6b4a2f"; ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(0, -30); ctx.stroke();
  const glow = cast ? 8 + Math.sin(f.spT*0.6)*2.5 : 5;
  ctx.fillStyle = cast ? "#ffe27a" : "#7fd6ff";
  ctx.beginPath(); ctx.arc(0, -33, glow, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.beginPath(); ctx.arc(-2, -35, glow*0.35, 0, 7); ctx.fill();
  ctx.restore();

  // 手（技のときは 前に出す）
  ctx.fillStyle = robeD;
  ctx.beginPath(); ctx.ellipse(-W2*0.34, -H2*0.42, 7, 8, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( W2*0.30 + (cast?10:0), -H2*0.46, 7, 8, 0, 0, 7); ctx.fill();

  // 顔（ローブのフードの 中は くらい）
  const hy = -H2*0.80;
  ctx.fillStyle = "#efe0c8";
  ctx.beginPath(); ctx.ellipse(0, hy, W2*0.30, W2*0.30, 0, 0, 7); ctx.fill();
  // 目（光る）
  ctx.fillStyle = flash ? "#ff6b6b" : "#3aa0e8";
  ctx.beginPath(); ctx.ellipse(-W2*0.12, hy - 1, 3.2, 3.6, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( W2*0.12, hy - 1, 3.2, 3.6, 0, 0, 7); ctx.fill();
  // まゆ（きりっと）
  ctx.strokeStyle = "#cfcfd8"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-W2*0.22, hy - 7); ctx.lineTo(-W2*0.04, hy - 4);
  ctx.moveTo( W2*0.22, hy - 7); ctx.lineTo( W2*0.04, hy - 4);
  ctx.stroke();
  // ながい 白ひげ
  ctx.fillStyle = "#eef0f5";
  ctx.beginPath();
  ctx.moveTo(-W2*0.22, hy + 5);
  ctx.quadraticCurveTo(0, hy + 12, W2*0.22, hy + 5);
  ctx.quadraticCurveTo(W2*0.14, hy + 34, 0, hy + 40);
  ctx.quadraticCurveTo(-W2*0.14, hy + 34, -W2*0.22, hy + 5);
  ctx.closePath(); ctx.fill();

  // とんがりぼうし
  ctx.fillStyle = robe;
  ctx.beginPath();
  ctx.moveTo(-W2*0.40, hy - W2*0.22);
  ctx.quadraticCurveTo(-W2*0.16, hy - H2*0.52, W2*0.30, hy - H2*0.42);
  ctx.quadraticCurveTo(W2*0.16, hy - W2*0.20, W2*0.40, hy - W2*0.22);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ffd54a";
  ctx.fillRect(-W2*0.42, hy - W2*0.26, W2*0.84, 5);
  // ★ほしの かざり＝まるい 点では なく 5とがりの 星（異世界編 #ffd85e と 同じ）
  ctx.fillStyle = "#ffd85e";
  const sx = W2*0.28, sy = hy - H2*0.40;
  ctx.beginPath();
  for (let i = 0; i < 5; i++){
    const a = -Math.PI/2 + i * 1.257;
    ctx.lineTo(sx + Math.cos(a) * 6, sy + Math.sin(a) * 6);
    ctx.lineTo(sx + Math.cos(a + 0.628) * 2.6, sy + Math.sin(a + 0.628) * 2.6);
  }
  ctx.closePath(); ctx.fill();
}

// --- ザガット（世界編 drawZagat の移植）---
function drawZagat(f){
  const W2 = f.w, H2 = f.h * 0.88;      // 頭が h より上に出る絵なので すこし縮めて 背丈を合わせる
  const flash = f.hurtFlash > 0 && Math.floor(f.hurtFlash/4) % 2 === 0;
  const skin  = flash ? "#ffdcb4" : "#e2a064";   // 日焼けした肌
  const skinD = "#c07c44";
  const wrap  = "#f2efe6";                        // 白いテープ（拳・足首）
  const shooting  = f.spKind === "proj";
  const shotLow   = shooting && f.spSlot === "down";   // グランドアイガーショット
  const upper     = f.spKind === "rise";
  const knee      = f.spKind === "dash";               // アイガーニー＝とびひざ
  ctx.save();
  if (shotLow) ctx.scale(1.08, 0.78);             // 下段は 低くしゃがむ
  if (knee) ctx.rotate(-0.22);                    // とびひざ＝前のめりに とびこむ

  // 影
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath(); ctx.ellipse(0, 2, W2*0.62, 7, 0, 0, 7); ctx.fill();
  if (knee){
    // ★アイガーニー＝ヒザは トランクスより 手前に 描く（下に 描くと かくれる）。
    //   ここでは うしろ足だけ。まえヒザは トランクスの あとで。
    ctx.strokeStyle = skin; ctx.lineWidth = W2*0.28; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(-W2*0.1, -H2*0.4); ctx.lineTo(-W2*0.36, -H2*0.26); ctx.lineTo(-W2*0.54, -H2*0.4);
    ctx.stroke();
    ctx.fillStyle = skinD;
    ctx.beginPath(); ctx.ellipse(-W2*0.56, -H2*0.42, W2*0.16, 5, -0.5, 0, 7); ctx.fill();
  } else {
  // 脚（太もも→ふくらはぎ）
  ctx.fillStyle = skin;
  roundRect(-W2*0.37, -H2*0.34, W2*0.3, H2*0.34, 6); ctx.fill();
  roundRect(W2*0.07, -H2*0.34, W2*0.3, H2*0.34, 6); ctx.fill();
  // 足首の白テープ
  ctx.fillStyle = wrap;
  ctx.fillRect(-W2*0.37, -H2*0.11, W2*0.3, H2*0.06);
  ctx.fillRect(W2*0.07, -H2*0.11, W2*0.3, H2*0.06);
  // 足
  ctx.fillStyle = skinD;
  ctx.beginPath(); ctx.ellipse(-W2*0.2, -2, W2*0.18, 5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(W2*0.24, -2, W2*0.18, 5, 0, 0, 7); ctx.fill();
  }
  // 青いトランクス（赤サイドライン＋白ベルト）
  ctx.fillStyle = "#2a4fb5";
  roundRect(-W2*0.45, -H2*0.53, W2*0.9, H2*0.26, 7); ctx.fill();
  ctx.fillStyle = skin;                 // 股の切れ込み
  ctx.beginPath(); ctx.moveTo(-W2*0.07, -H2*0.27); ctx.lineTo(0, -H2*0.42); ctx.lineTo(W2*0.07, -H2*0.27); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#d62c2c";            // 赤サイドライン
  ctx.fillRect(-W2*0.45, -H2*0.53, W2*0.08, H2*0.26);
  ctx.fillRect(W2*0.37, -H2*0.53, W2*0.08, H2*0.26);
  ctx.fillStyle = wrap;                 // 白ベルト
  ctx.fillRect(-W2*0.45, -H2*0.53, W2*0.9, H2*0.05);
  ctx.fillStyle = "#cfcabb"; ctx.fillRect(-W2*0.07, -H2*0.525, W2*0.14, H2*0.035);  // バックル

  // まえヒザ（アイガーニー）＝トランクスの 手前に 高く かかげる
  if (knee){
    ctx.strokeStyle = skin; ctx.lineWidth = W2*0.28; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(W2*0.06, -H2*0.36); ctx.lineTo(W2*0.5, -H2*0.52); ctx.lineTo(W2*0.3, -H2*0.16);
    ctx.stroke();
    ctx.fillStyle = skinD;                                    // つまさき
    ctx.beginPath(); ctx.ellipse(W2*0.3, -H2*0.13, W2*0.15, 5, 0.4, 0, 7); ctx.fill();
    ctx.fillStyle = wrap;                                     // ヒザの 白テープ
    ctx.beginPath(); ctx.ellipse(W2*0.5, -H2*0.52, W2*0.2, W2*0.17, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "#cfcabb"; ctx.lineWidth = 1.4;
    for (let k = -1; k <= 1; k++){
      ctx.beginPath();
      ctx.moveTo(W2*0.4, -H2*0.52 + k*4); ctx.lineTo(W2*0.6, -H2*0.52 + k*4); ctx.stroke();
    }
    ctx.fillStyle = "rgba(255,220,120,0.5)";                  // ヒザの 光
    ctx.beginPath(); ctx.arc(W2*0.62, -H2*0.54, 9, 0, 7); ctx.fill();
  }

  // 胴（広い肩・逆三角の筋肉質）
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.moveTo(-W2*0.4, -H2*0.5);
  ctx.lineTo(W2*0.4, -H2*0.5);
  ctx.lineTo(W2*0.52, -H2*0.82);
  ctx.quadraticCurveTo(W2*0.42, -H2*0.9, W2*0.22, -H2*0.88);
  ctx.lineTo(-W2*0.22, -H2*0.88);
  ctx.quadraticCurveTo(-W2*0.42, -H2*0.9, -W2*0.52, -H2*0.82);
  ctx.closePath(); ctx.fill();
  // 胸筋・腹筋
  ctx.strokeStyle = skinD; ctx.lineWidth = 1.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -H2*0.52); ctx.lineTo(0, -H2*0.8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-W2*0.28, -H2*0.72); ctx.lineTo(W2*0.28, -H2*0.72); ctx.stroke();
  for (let i = 1; i <= 2; i++){ const yy = -H2*(0.52 + i*0.055); ctx.beginPath(); ctx.moveTo(-W2*0.15, yy); ctx.lineTo(W2*0.15, yy); ctx.stroke(); }
  // 胸の大きな傷跡
  ctx.strokeStyle = "#a85a3a"; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(-W2*0.28, -H2*0.82); ctx.lineTo(W2*0.22, -H2*0.55); ctx.stroke();

  // 拳（白いテープ）
  const fist = (fx, fy) => {
    ctx.fillStyle = wrap;
    ctx.beginPath(); ctx.arc(fx, fy, W2*0.17, 0, 7); ctx.fill();
    ctx.strokeStyle = "#cfcabb"; ctx.lineWidth = 1.4;
    for (let k = -1; k <= 1; k++){ ctx.beginPath(); ctx.moveTo(fx - W2*0.09, fy + k*3.4); ctx.lineTo(fx + W2*0.09, fy + k*3.4); ctx.stroke(); }
  };
  // 腕は 肌色の太いストローク。先端に 白い拳を置く
  ctx.strokeStyle = skin; ctx.lineWidth = W2*0.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (upper){
    // アイガーアッパーカット：前腕を まっすぐ上へ 突き上げる
    ctx.beginPath(); ctx.moveTo(-W2*0.4, -H2*0.8); ctx.lineTo(-W2*0.3, -H2*0.56); ctx.lineTo(-W2*0.08, -H2*0.66); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W2*0.34, -H2*0.82); ctx.lineTo(W2*0.3, -H2*1.02); ctx.lineTo(W2*0.27, -H2*1.2); ctx.stroke();
    fist(-W2*0.08, -H2*0.66);
    fist(W2*0.27, -H2*1.24);
    ctx.fillStyle = "#fff2b0"; ctx.beginPath(); ctx.arc(W2*0.27, -H2*1.38, 9, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffd34d"; ctx.beginPath(); ctx.arc(W2*0.27, -H2*1.38, 4, 0, 7); ctx.fill();
  } else if (shooting){
    // アイガーショット：前腕を まっすぐ前へ 伸ばして撃つ
    const fy = shotLow ? -H2*0.34 : -H2*0.66;
    ctx.beginPath(); ctx.moveTo(-W2*0.4, -H2*0.82); ctx.lineTo(-W2*0.3, -H2*0.58); ctx.lineTo(-W2*0.08, -H2*0.72); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W2*0.26, -H2*0.8); ctx.lineTo(W2*0.5, fy - H2*0.03); ctx.lineTo(W2*0.76, fy); ctx.stroke();
    fist(-W2*0.08, -H2*0.72);
    fist(W2*0.76, fy);
    ctx.fillStyle = "#ffd8a0"; ctx.beginPath(); ctx.arc(W2*0.94, fy, 8, 0, 7); ctx.fill();
    ctx.fillStyle = "#ff9a3c"; ctx.beginPath(); ctx.arc(W2*0.94, fy, 4.5, 0, 7); ctx.fill();
  } else {
    // 構え：両腕を曲げて こぶしを 胸の前に
    ctx.beginPath(); ctx.moveTo(-W2*0.4, -H2*0.82); ctx.lineTo(-W2*0.34, -H2*0.58); ctx.lineTo(-W2*0.06, -H2*0.72); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W2*0.4, -H2*0.82); ctx.lineTo(W2*0.46, -H2*0.58); ctx.lineTo(W2*0.18, -H2*0.78); ctx.stroke();
    fist(-W2*0.06, -H2*0.72);
    fist(W2*0.18, -H2*0.78);
  }

  // 首
  ctx.fillStyle = skin; ctx.fillRect(-W2*0.13, -H2*0.92, W2*0.26, H2*0.1);
  // つるつる頭
  ctx.beginPath(); ctx.arc(0, -H2*1.0, W2*0.31, 0, 7); ctx.fill();
  // 耳
  ctx.beginPath(); ctx.arc(-W2*0.29, -H2*1.0, 4, 0, 7); ctx.arc(W2*0.29, -H2*1.0, 4, 0, 7); ctx.fill();
  // 怒り眉（前の目）
  ctx.strokeStyle = "#3a2418"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-W2*0.02, -H2*1.07); ctx.lineTo(W2*0.2, -H2*1.01); ctx.stroke();
  // 前の目
  ctx.fillStyle = "#3a2418"; ctx.beginPath(); ctx.arc(W2*0.13, -H2*0.99, 2.7, 0, 7); ctx.fill();
  // 眼帯（奥の目＋ストラップ）
  ctx.strokeStyle = "#242424"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-W2*0.3, -H2*1.11); ctx.lineTo(-W2*0.02, -H2*0.96); ctx.stroke();
  ctx.fillStyle = "#1c1c1c";
  ctx.beginPath(); ctx.ellipse(-W2*0.13, -H2*1.02, 6, 4.6, -0.3, 0, 7); ctx.fill();
  // への字口
  ctx.strokeStyle = "#7a4a2a"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W2*0.03, -H2*0.9); ctx.lineTo(W2*0.19, -H2*0.9); ctx.stroke();
  ctx.restore();
}

function drawProjectiles(){
  for (const s of projectiles){
    // ロブシュート：しるしの あと ボールが 空から 落ちてくる
    if (s.vis === "lob"){
      const gy = GROUND_Y;
      if (s.t <= s.mark){
        const k = s.t / s.mark;
        ctx.save();
        ctx.globalAlpha = 0.4 + Math.abs(Math.sin(s.t*0.35))*0.45;
        ctx.strokeStyle = "#ff5f6d"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(s.x, gy + 2, s.w*0.5, 8, 0, 0, 7); ctx.stroke();
        ctx.fillStyle = "rgba(255,95,109,0.18)";
        ctx.beginPath(); ctx.ellipse(s.x, gy + 2, s.w*0.5*k, 8*k, 0, 0, 7); ctx.fill();
        ctx.restore();
        // 落ちてくる ボール（しるしの あいだに 空から おりてくる）
        drawSoccerBall(s.x, -30 + (gy + 20) * k, 13, s.t * 0.3);
      } else {
        const life = s.life - s.mark, k = (s.t - s.mark) / life;
        ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k);
        drawSoccerBall(s.x, gy - 12, 13 + k*10, s.t * 0.3);
        ctx.restore();
      }
      continue;
    }
    // 火柱（ドラゴン）：しるし → 地面から 炎が 立ちのぼる
    if (s.vis === "firepillar"){
      const gy = GROUND_Y;
      if (s.t <= s.mark){
        const k = s.t / s.mark;
        ctx.save();
        ctx.globalAlpha = 0.4 + Math.abs(Math.sin(s.t*0.45))*0.45;
        ctx.strokeStyle = "#ff9a3c"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(s.x, gy + 2, s.w*0.6, 7, 0, 0, 7); ctx.stroke();
        ctx.fillStyle = "rgba(255,150,60,0.25)";
        ctx.beginPath(); ctx.ellipse(s.x, gy + 2, s.w*0.6*k, 7*k, 0, 0, 7); ctx.fill();
        ctx.restore();
      } else {
        const life = s.life - s.mark, k = 1 - (s.t - s.mark) / life;
        ctx.save();
        ctx.globalAlpha = Math.max(0, k);
        const hgt = 150 + Math.sin(s.t*0.7)*10;
        for (const lay of [[s.w*0.52,"rgba(255,110,30,0.75)"],
                           [s.w*0.32,"rgba(255,178,60,0.9)"],
                           [s.w*0.14,"rgba(255,246,200,0.95)"]]){
          ctx.fillStyle = lay[1];
          ctx.beginPath();
          ctx.moveTo(s.x - lay[0], gy + 4);
          ctx.quadraticCurveTo(s.x - lay[0]*1.2, gy - hgt*0.55, s.x + Math.sin(s.t*0.5)*6, gy - hgt);
          ctx.quadraticCurveTo(s.x + lay[0]*1.2, gy - hgt*0.55, s.x + lay[0], gy + 4);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
      continue;
    }
    // ひかりの柱：まず しるし → そのあと 光の柱
    if (s.vis === "pillar"){
      const gy = GROUND_Y;
      if (s.t <= s.mark){
        const k = s.t / s.mark;
        ctx.save();
        ctx.globalAlpha = 0.35 + Math.abs(Math.sin(s.t*0.4))*0.45;
        ctx.strokeStyle = "#ffe27a"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(s.x, gy + 2, s.w*0.6, 7, 0, 0, 7); ctx.stroke();
        ctx.fillStyle = "rgba(255,226,122,0.20)";
        ctx.beginPath(); ctx.ellipse(s.x, gy + 2, s.w*0.6*k, 7*k, 0, 0, 7); ctx.fill();
        ctx.restore();
      } else {
        const life = s.life - s.mark, k = 1 - (s.t - s.mark) / life;
        ctx.save();
        ctx.globalAlpha = Math.max(0, k);
        const g = ctx.createLinearGradient(0, 0, 0, gy);
        g.addColorStop(0, "rgba(255,255,255,0.95)");
        g.addColorStop(1, "rgba(255,214,90,0.55)");
        ctx.fillStyle = g;
        ctx.fillRect(s.x - s.w/2, 0, s.w, gy + 6);
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.fillRect(s.x - s.w*0.18, 0, s.w*0.36, gy + 6);
        ctx.restore();
      }
      continue;
    }

    ctx.save();
    ctx.translate(s.x, s.y);
    if (s.vis === "salt"){
      // しおまき：白いつぶが パラパラ
      ctx.fillStyle = "#ffffff";
      for (let i=0;i<4;i++){
        const a = s.t*0.3 + i*1.6;
        ctx.beginPath(); ctx.arc(Math.cos(a)*4, Math.sin(a)*3.5, 2.2, 0, 7); ctx.fill();
      }
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, 7); ctx.fill();
    } else if (s.vis === "fire"){
      // 火の玉：まんなかが 白く、まわりが オレンジ。うしろに 尾
      ctx.fillStyle = "rgba(255,120,40,0.35)";
      ctx.beginPath(); ctx.ellipse(-Math.sign(s.vx)*9, 0, 12, 6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#ff8a2b";
      ctx.beginPath(); ctx.arc(0, 0, 9 + Math.sin(s.t*0.5)*1.2, 0, 7); ctx.fill();
      ctx.fillStyle = "#ffd15c";
      ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff6d8";
      ctx.beginPath(); ctx.arc(-1, -1, 2.6, 0, 7); ctx.fill();
    } else if (s.vis === "bolt"){
      // まほうだん：むらさきの ひかりの玉
      ctx.fillStyle = "rgba(150,110,255,0.35)";
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.fill();
      ctx.fillStyle = "#9a6bff";
      ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill();
      ctx.fillStyle = "#e0d0ff";
      ctx.beginPath(); ctx.arc(-1.5, -1.5, 3, 0, 7); ctx.fill();
    } else if (s.vis === "orb"){
      // ひかりのたま（おいかけてくる）
      const gl = 0.6 + 0.4*Math.sin(s.t*0.4);
      ctx.fillStyle = "rgba(200,170,255,0.35)";
      ctx.beginPath(); ctx.arc(0, 0, 13 + gl*2, 0, 7); ctx.fill();
      ctx.fillStyle = "#c9a6ff";
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(-1.5, -1.5, 3.4, 0, 7); ctx.fill();
    } else if (s.vis === "gball"){
      // じゅうりょくだま（黒いたま。まわりが ゆがむ）
      ctx.strokeStyle = "rgba(180,150,255,0.55)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 13 + Math.sin(s.t*0.3)*2, 0, 7); ctx.stroke();
      ctx.fillStyle = "#1a1426";
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.fill();
      ctx.strokeStyle = "#8a6ad8"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.stroke();
    } else if (s.vis === "beam"){
      // ビームショット：まっすぐ 長い ひかり（ためると 太くなる）
      const bw = s.big ? 15 : 10;
      ctx.scale(Math.sign(s.vx) || 1, 1);
      ctx.fillStyle = "rgba(70,224,255,0.30)";
      roundRect(-26, -bw/2 - 3, 52, bw + 6, bw); ctx.fill();
      ctx.fillStyle = "#46e0ff";
      roundRect(-22, -bw/2, 44, bw, bw/2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      roundRect(-18, -bw/4, 36, bw/2, bw/4); ctx.fill();
    } else if (s.vis === "golf"){
      // ゴルフボール（白い小さな玉）
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
      ctx.strokeStyle = "#c9ccd4"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.stroke();
      ctx.fillStyle = "rgba(150,160,175,0.6)";
      for (let i=0;i<4;i++){ const a=i*1.6+s.t*0.1; ctx.beginPath(); ctx.arc(Math.cos(a)*3.5, Math.sin(a)*3.5, 1.1, 0, 7); ctx.fill(); }
    } else if (s.vis === "arrow"){
      // や（信長のまっすぐな矢）
      ctx.scale(Math.sign(s.vx) || 1, 1);
      ctx.strokeStyle = "#8a6a3a"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(9, 0); ctx.stroke();
      ctx.fillStyle = "#d8dde6";
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(7, -4); ctx.lineTo(7, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#efe6d2";
      ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(-8, -4); ctx.lineTo(-6, 0); ctx.lineTo(-8, 4); ctx.closePath(); ctx.fill();
    } else if (s.vis === "ball"){
      drawSoccerBall(0, 0, 11, s.t * 0.35 * (Math.sign(s.vx) || 1));
    } else if (s.vis === "cuke"){
      // キュウリ（ニセペギの 投げもの）
      ctx.rotate(s.t * 0.22 * Math.sign(s.vx));
      ctx.fillStyle = "#6fae3f";
      roundRect(-10, -5, 20, 10, 5); ctx.fill();
      ctx.fillStyle = "#8fce5c";
      roundRect(-8, -4, 12, 4, 2); ctx.fill();
      ctx.fillStyle = "#4f7f2a";
      for (let i=-1;i<=1;i++){ ctx.beginPath(); ctx.arc(i*5, 1, 1.1, 0, 7); ctx.fill(); }
    } else if (s.vis === "frost"){
      // こおりのいき：白〜水いろの つめたい いき
      ctx.scale(Math.sign(s.vx) || 1, 1);
      ctx.fillStyle = "rgba(190,240,255,0.35)";
      ctx.beginPath(); ctx.ellipse(-6, 0, 14, 9, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(230,250,255,0.9)";
      ctx.beginPath(); ctx.ellipse(0, 0, 10, 7, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#ffffff";
      for (let i=0;i<3;i++){
        const a = s.t*0.25 + i*2.1;
        ctx.beginPath(); ctx.arc(Math.cos(a)*5, Math.sin(a)*4, 1.8, 0, 7); ctx.fill();
      }
    } else if (s.vis === "puck"){
      // ホッケーダッシュ：氷のかたまりが すべっていく
      ctx.fillStyle = "rgba(180,235,255,0.4)";
      ctx.beginPath(); ctx.ellipse(-Math.sign(s.vx)*10, 2, 14, 5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#bfe9ff";
      roundRect(-11, -8, 22, 16, 4); ctx.fill();
      ctx.strokeStyle = "#6fb6d8"; ctx.lineWidth = 1.6;
      roundRect(-11, -8, 22, 16, 4); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      roundRect(-8, -6, 8, 5, 2); ctx.fill();
    } else if (s.vis === "tiger"){
      // アイガーショット：オレンジの 虎じま ファイアボール
      ctx.scale(Math.sign(s.vx) || 1, 1);
      ctx.fillStyle = "rgba(255,150,40,0.30)";
      ctx.beginPath(); ctx.ellipse(-12, 0, 14, 8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#f77f1c";
      ctx.beginPath(); ctx.ellipse(0, 0, 12, 8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#3a2410";
      for (let i=-1;i<=1;i++){
        ctx.beginPath(); ctx.ellipse(i*4.5, 0, 1.4, 5.5 - Math.abs(i)*1.6, 0, 0, 7); ctx.fill();
      }
      ctx.fillStyle = "#ffd98a";
      ctx.beginPath(); ctx.ellipse(7, -1.5, 3, 2.2, 0, 0, 7); ctx.fill();
    } else if (s.vis === "sp"){
      // SP（ドランプの けいご）＝ふたり ならんで 走っていく
      ctx.scale(Math.sign(s.vx) || 1, 1);
      ctx.translate(0, 31);                 // 足もとを 原点に
      drampSP(0, s.t * 1.6);
    } else if (s.vis === "hole"){
      // 暗黒球＝まっ黒な 玉。まわりの 空間が うずを まいて 吸いこまれる
      const p = s.t * 0.12;
      for (let i = 0; i < 3; i++){
        const k = ((s.t * 2 + i * 22) % 66) / 66;
        ctx.strokeStyle = "rgba(180,150,255," + (0.5 * k).toFixed(2) + ")";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 16 + (1 - k) * 44, p, p + 4.2); ctx.stroke();
      }
      ctx.fillStyle = "rgba(150,110,255,0.28)";
      ctx.beginPath(); ctx.arc(0, 0, 20 + Math.sin(s.t*0.2)*2, 0, 7); ctx.fill();
      ctx.fillStyle = "#0d0818";
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
      ctx.strokeStyle = "#9a6bff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.stroke();
    } else if (s.vis === "trap"){
      // 闇のわな＝地面に ひろがる 黒い もよう。ふむと 発動
      const pu = 0.5 + 0.5 * Math.sin(s.t * 0.14);
      ctx.fillStyle = "rgba(30,10,50,0.65)";
      ctx.beginPath(); ctx.ellipse(0, 6, 18, 7, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(255,216,94," + (0.35 + pu*0.5).toFixed(2) + ")"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 6, 16, 6, 0, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 6, 8, 3, 0, 0, 7); ctx.stroke();
      for (let i = 0; i < 5; i++){                 // 立ちのぼる 黒い もや
        const a = s.t * 0.05 + i * 1.26;
        const yy = 4 - ((s.t * 0.9 + i * 8) % 22);
        ctx.fillStyle = "rgba(120,70,190," + (0.5 * (1 + yy/22)).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(Math.cos(a)*11, yy, 2.6, 0, 7); ctx.fill();
      }
    } else {
      ctx.rotate(s.t * 0.4 * Math.sign(s.vx));
      ctx.fillStyle = "#e8c34a";
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#a8842a";
      ctx.beginPath(); ctx.ellipse(-2, -1, 3, 2, 0, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
}

// しゅくちぎり の ざんぞう
function drawGhosts(){
  for (const g of ghosts){
    ctx.save();
    ctx.globalAlpha = 0.35 * (1 - g.t / g.life);
    ctx.translate(g.x, g.y);
    ctx.scale(g.face, 1);
    const stub = { ch:g.ch, w:g.ch.w, h:g.ch.h, face:1, hurtFlash:0, animT:0,
                   vx:0, onGround:true, atkName:null, spKind:null, spDef:null, spT:0 };
    drawChar(stub);
    ctx.restore();
  }
}
function drawParticles(){
  for (const p of particles){
    const k = 1 - p.t / p.life;
    ctx.save();
    ctx.globalAlpha = Math.max(0, k);
    if (p.flash){
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + (1-k)*1.4), 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
}

function drawHUD(){
  const boxW = 190, boxH = 74, gap = 40;
  const total = boxW*2 + gap;
  const x0 = (W - total)/2, y0 = H - boxH - 12;
  fighters.forEach((f, i) => {
    const x = x0 + i*(boxW+gap);
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.42)";
    roundRect(x, y0, boxW, boxH, 12); ctx.fill();
    ctx.strokeStyle = f.pi === 0 ? "rgba(255,95,109,0.9)" : "rgba(79,180,234,0.9)";
    ctx.lineWidth = 3; roundRect(x, y0, boxW, boxH, 12); ctx.stroke();

    // 名前
    ctx.fillStyle = "#cfd7f0"; ctx.font = "bold 13px system-ui"; ctx.textAlign = "left";
    ctx.fillText(f.ch.name + (f.isCPU ? "（CPU）" : ""), x + 12, y0 + 18);

    // ダメージ％（多いほど赤く大きく）
    const dp = Math.min(1, f.dmg / 150);
    const r = Math.round(255), g = Math.round(255 - dp*200), b = Math.round(255 - dp*230);
    ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
    ctx.font = "bold " + (30 + dp*10).toFixed(0) + "px system-ui";
    ctx.textAlign = "right";
    ctx.fillText(Math.floor(f.dmg) + "%", x + boxW - 12, y0 + 50);

    // ストック
    ctx.textAlign = "left";
    for (let s=0; s<3; s++){
      ctx.fillStyle = s < f.stocks ? (f.pi===0 ? "#ff5f6d" : "#4fb4ea") : "rgba(255,255,255,0.18)";
      ctx.beginPath(); ctx.arc(x + 20 + s*20, y0 + 52, 7, 0, 7); ctx.fill();
    }
    ctx.restore();
  });
}

function drawResult(){
  ctx.save();
  ctx.fillStyle = "rgba(10,12,28,0.72)"; ctx.fillRect(0,0,W,H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd54a"; ctx.font = "bold 52px system-ui";
  ctx.fillText(winner ? (winner.ch.name + " の かち！") : "ひきわけ", W/2, H/2 - 20);
  if (resultT > 50){
    ctx.fillStyle = "#fff"; ctx.font = "18px system-ui";
    ctx.fillText("タップ / ジャンプボタン でメニューへ", W/2, H/2 + 40);
  }
  ctx.restore();
}

// ============================================================
//  メインループ
// ============================================================
function update(){
  frame++;
  if (shake > 0) shake *= 0.85;
  if (hitstop > 0){ hitstop--; return; }

  if (state === "fight"){
    updateFighter(fighters[0], fighters[1]);
    updateFighter(fighters[1], fighters[0]);
    updatePal(fighters[0], fighters[1]);
    updatePal(fighters[1], fighters[0]);
    pushApart(fighters[0], fighters[1]);
    updateProjectiles();
  }
  if (state === "result"){
    resultT++;
    if (resultT > 60){
      const any = gatherInput(0).jump || gatherInput(1).jump;
      if (any) showMenu();
    }
  }
  updateParticles();
}

function draw(){
  ctx.save();
  if (shake > 0.3){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }
  drawBg();
  drawStage();
  if (fighters.length){
    drawGhosts();
    for (const f of fighters) drawPal(f);      // 相方は 本人より 後ろに
    drawProjectiles();
    for (const f of fighters) drawFighter(f);
    drawSwings();
  }
  drawParticles();
  ctx.restore();
  if (state === "fight" || state === "result") drawHUD();
  if (state === "result") drawResult();
}

// ============================================================
//  メニューを コントローラー／キーボードで 動かす
//    ★メニューは HTML なので、ほうっておくと マウスとタッチでしか さわれない。
//      ここで 十字＝カーソル移動、A＝きまり、B＝はじめる を 受けとる。
// ============================================================
let cs = null;                       // キャラ選択画面の 状態（showCharSel が 入れる）
let menuFocus = 0;
const menuPrev = [blankInput(), blankInput()];

function menuInput(){
  if (state !== "menu" && state !== "charsel") return;
  const btns = [...overlay.querySelectorAll("button.big")];

  for (let pi = 0; pi < 2; pi++){
    const cur = gatherInput(pi), prev = menuPrev[pi];
    const hit = a => cur[a] && !prev[a];
    menuPrev[pi] = cur;

    if (state === "menu"){
      if (pi !== 0 || !btns.length) continue;        // タイトルは 1Pだけ
      if (menuFocus >= btns.length) menuFocus = 0;
      if (hit("down") || hit("up")){
        menuFocus = (menuFocus + (hit("down") ? 1 : btns.length - 1)) % btns.length;
        se("shoot");
      }
      btns.forEach((b, i) => b.classList.toggle("focus", i === menuFocus));
      if (hit("attack") || hit("jump")) btns[menuFocus].click();

    } else if (cs && cs.refresh){
      // 1人プレイでは 1Pの コントローラーだけ／2人対戦では それぞれが 自分のカーソル
      if (mode === "cpu" && pi !== 0) continue;
      const who = mode === "cpu" ? 0 : pi;           // どちらの カーソルを 動かすか
      const n = cs.cells.length;
      const cols = Math.max(1, getComputedStyle(document.querySelector(".csGrid"))
                                 .gridTemplateColumns.split(/\s+/).filter(Boolean).length);
      let c = cs.cursor[who], moved = false;
      if (hit("left"))  { c = (c - 1 + n) % n; moved = true; }
      if (hit("right")) { c = (c + 1) % n;     moved = true; }
      if (hit("up"))    { c = (c - cols + n) % n; moved = true; }
      if (hit("down"))  { c = (c + cols) % n;     moved = true; }
      if (moved){ cs.cursor[who] = c; se("shoot"); cs.refresh(); }
      // A＝そのキャラに きめる
      if (hit("attack") || hit("jump")){
        const target = mode === "cpu" ? cs.focusPi : pi;
        cs.pick(target, cs.cursor[who], mode === "cpu");
      }
      // B＝はじめる
      if (hit("special")) cs.start();
    }
  }
}

function loop(){
  if (state === "fight" || state === "result") update();
  else menuInput();
  draw();
  requestAnimationFrame(loop);
}

// ============================================================
//  メニュー（HTMLオーバーレイ）
// ============================================================
// ★メニューの 大きさを 枠(#overlay)の 実さいの 高さで 切りかえる。
//   スマホ・タブレットの よこ持ちだと 枠が ひくいので、そのままだと 見きれる。
function fitMenu(){
  // ★オーバーレイが かくれて いる（display:none）と clientHeight が 0 に なる。
  //   そのときは 親の #stage を 見る。innerHeight に 落とすと
  //   よこ長の 画面で「大きいまま」に なって 見きれる。
  const st = document.getElementById("stage");
  const h = overlayEl.clientHeight || (st && st.clientHeight) || innerHeight;
  document.body.classList.toggle("mh1", h < 620);
  document.body.classList.toggle("mh2", h < 500);
  document.body.classList.toggle("mh3", h < 400);
}
addEventListener("resize", fitMenu);
addEventListener("orientationchange", () => setTimeout(fitMenu, 120));

function showMenu(){
  state = "menu";
  document.body.classList.remove("playing");
  overlayEl.classList.remove("hide", "charsel");
  fitMenu();                 // ★かくしを といた あとで 測る（前だと 高さ 0 で 効かない）
  stopBGM();
  // ★スマホ・タブレットでは コントローラーの 話は 出さない（ユーザー指定）。
  //   つないでいる 台数も ボタン設定も いらないので、画面が すっきりして
  //   せまい 画面に おさまる ように なる。
  const padN = padList().length;
  overlay.innerHTML =
    '<div class="menu">' +
      '<button class="big prim" id="b1">ひとりで あそぶ<br><span style="font-size:12px;font-weight:500">CPUと たいせん</span></button>' +
      '<button class="big c-blue" id="b2">ふたりで たいせん<br><span style="font-size:12px;font-weight:500">おなじ画面で 2人</span></button>' +
      (hasTouch ? '' :
      '<button class="big c-grn" id="b3" style="font-size:14px;padding:10px">🎮 コントローラーのボタン設定</button>') +
      '<button class="big c-yel" id="b4" style="font-size:14px;padding:10px">' +
        (bgmOn ? "🔊 音楽：オン" : "🔈 音楽：オフ") + '</button>' +
    '</div>' +
    (hasTouch ? '' :
      '<div class="note">つながっているコントローラー：<b style="color:#ffd54a">' + padN + ' 個</b>' +
      (padN === 0 ? '（コントローラーのボタンを1回押すと認識されます）'
                  : '　<b>A</b>＝こうげき／<b>B</b>＝ひっさつ／<b>X・Y</b>＝ジャンプ') + '</div>') +
    '<div class="pad">' +
      '<span class="row"><b class="btn d">十字</b>いどう</span>' +
      (hasTouch ? '' : '<span class="row"><b class="btn x">X</b><b class="btn y">Y</b>ジャンプ</span>') +
      (hasTouch ? '<span class="row"><b class="btn y">Y</b>ジャンプ</span>' : '') +
      '<span class="row"><b class="btn a">A</b>こうげき</span>' +
      '<span class="row"><b class="btn b">B</b>ひっさつ</span>' +
    '</div>' +
    '<div class="note">' +
      (hasTouch

// ★キャラ選択で 名前を かくす キャラ（`secret:true`）。
//   妖精＝異世界編の **ほんとうの 最後のボス** なので、まだ 遊んで いない子への
//   ネタバレに ならない よう「？？？」に する（ユーザー指定）。
//   えらんで 試合に 入れば ふつうに 名前が 出る（もう 知って いる ので）。
function selName(ch){ return ch.secret ? "？？？" : ch.name; }

function showCharSel(){
  state = "charsel";
  overlayEl.classList.remove("hide");
  overlayEl.classList.add("charsel");
  fitMenu();
  const p2label = mode === "cpu" ? "CPU" : "2P";
  overlay.innerHTML =
    '<div class="csTitle">キャラクター選択</div>' +
    '<div class="csGrid" id="csGrid">' +
      CHAR_LIST.map(k =>
        '<button class="csCell" data-k="'+k+'">' +
          '<canvas class="csFace" width="150" height="150"></canvas>' +
          '<span class="csName">' + selName(CHARS[k]) + '</span>' +
          '<i class="csCur c1">1P</i><i class="csCur c2">2P</i>' +
        '</button>').join("") +
    '</div>' +
    '<div class="csPanels">' +
      [0,1].map(pi =>
        '<div class="csPanel" data-pi="'+pi+'">' +
          '<canvas class="csBig" width="190" height="150"></canvas>' +
          '<div class="csBar"><b>' + (pi===0 ? "1P" : p2label) + '</b><span class="csPick"></span></div>' +
          '<div class="csTag"></div>' +
          '<div class="csMoves"></div>' +
        '</div>').join("") +
    '</div>' +
    '<div style="display:flex;gap:8px;margin-top:2px">' +
      '<button class="big prim" id="go" style="padding:9px 26px">はじめる！</button>' +
      '<button class="big" id="back" style="font-size:13px;padding:9px 16px">もどる</button>' +
    '</div>' +
    '<div class="csHint">コントローラー：<b>十字</b>でえらぶ／<b>A</b>できまり／<b>B</b>ではじめる' +
      (mode === "vs" ? "（1P・2P それぞれ 自分のコントローラーで）" : "") + '</div>';

  // どちらのプレイヤーを えらんでいるか（パネルを押すと 切りかわる）
  const cells  = [...overlay.querySelectorAll(".csCell")];
  const panels = [...overlay.querySelectorAll(".csPanel")];
  // ★コントローラーからも 動かせるように、この画面の 状態を 外に 出しておく
  cs = { cells, panels, focusPi:0, cursor:[Math.max(0, CHAR_LIST.indexOf(sel[0])),
                                            Math.max(0, CHAR_LIST.indexOf(sel[1]))],
         refresh:null, start:null, back:null };

  // 顔アイコンは ゲーム中と同じ絵を そのまま描く
  cells.forEach((cell, idx) => {
    const key = cell.dataset.k;
    drawPortrait(cell.querySelector(".csFace"), key, 0.86);
    cell.onclick = () => {
      cs.cursor[cs.focusPi] = idx;
      pickChar(cs.focusPi, idx, true);
    };
  });
  panels.forEach((p, i) => { p.onclick = e => { if (e.target === p || e.target.closest(".csBar,.csBig")) { cs.focusPi = i; refresh(); } }; });

  // キャラを 決める（クリックでも コントローラーでも ここを通る）
  function pickChar(pi, idx, advance){
    sel[pi] = CHAR_LIST[idx];
    se("shoot");
    // 1人プレイのときは 選んだら もう片方（CPU）へ 自動で 移る
    if (advance && mode === "cpu") cs.focusPi = cs.focusPi === 0 ? 1 : 0;
    refresh();
  }
  cs.pick = pickChar;

  function refresh(){
    panels.forEach((p, i) => {
      p.classList.toggle("act", i === cs.focusPi);
      p.classList.toggle("p1", i === 0);
      p.classList.toggle("p2", i === 1);
      const ch = CHARS[sel[i]];
      p.querySelector(".csPick").textContent = selName(ch);
      p.querySelector(".csTag").textContent = ch.tag || "";
      drawPortrait(p.querySelector(".csBig"), sel[i], 0.92, true);   // パネルは 大きい版
      const s = ch.sp;
      const nm = d => d ? (d.name + (d.charge ? "(ため)" : "")) : "—";
      const rows = [["B", s.neutral], ["横B", s.side], ["上B", s.up], ["下B", s.down]]
        .filter(r => r[1]);                      // 持っていない必殺は 出さない
      // ★空中で 別の技になる スロット（さむらいの 下B）は **同じマスの 中**に 小さく そえる。
      //   3行目に して いたら さむらいだけ パネルが 高くなって、
      //   えらんだ ときに 画面が がくっと 動いて 見えた（ユーザー指摘）。技は いつも 2×2。
      p.querySelector(".csMoves").innerHTML = rows.map(r => {
        const alt = r[1].airAlt;
        return '<b>' + r[0] + '</b><i' + (alt ? ' class="hasAlt"' : '') + '>' + nm(r[1]) +
               (alt ? '<small>空中＝' + alt.name + '</small>' : '') + '</i>';
      }).join("");
    });
    cells.forEach((c, i) => {
      c.classList.toggle("s1", sel[0] === c.dataset.k);
      c.classList.toggle("s2", sel[1] === c.dataset.k);
      // コントローラーの カーソル（1人プレイのときは 1Pのぶんだけ）
      c.classList.toggle("cur1", cs.cursor[0] === i);
      c.classList.toggle("cur2", mode === "vs" && cs.cursor[1] === i);
    });
  }
  cs.refresh = refresh;
  cs.start = () => { se("jump"); startFight(); };
  cs.back  = showMenu;
  refresh();
  document.getElementById("go").onclick = cs.start;
  document.getElementById("back").onclick = cs.back;
}

// 2人セットの キャラは アイコンの 描きかたを 変える。
//   小さいアイコン＝2人が 半身ずつ／大きいパネル＝2人とも 全身
const PORTRAIT_2P = {
  penguins: (c, cvw, cvh, ch, big) => {
    if (big){
      // パネル：2人とも 全身。ならべて 入るように 少し 小さく。
      // ★足が 下のふちに ついて 切れていたので、すこし 上げて 余白を とる
      const sc = Math.min(cvh * 0.78 / ch.h, cvw * 0.30 / ch.w);
      for (const [dx, green] of [[-0.20, false], [0.20, true]]){
        c.save();
        c.translate(cvw/2 + cvw*dx, cvh * 0.86);
        c.scale(sc, sc);
        drawPenguin({ w:ch.w, h:ch.h, hurtFlash:0 }, green);
        c.restore();
      }
    } else {
      // アイコン：左に ペギ、右に にせペギ。それぞれ 半分だけ 見える
      const sc = cvh * 0.92 / ch.h;
      for (const [dx, green] of [[-0.26, false], [0.26, true]]){
        c.save();
        c.translate(cvw/2 + cvw*dx, cvh * 0.96);
        c.scale(sc, sc);
        drawPenguin({ w:ch.w, h:ch.h, hurtFlash:0 }, green);
        c.restore();
      }
    }
  },
};

// ★キャラの絵は、当たり判定の 高さ(ch.h)より 上に はみ出す ことが 多い
//   （兜・ぼうし・つの・ケルベロスの首 など）。そのまま ch.h で 縮めると
//   アイコンの 上が 見きれる。ここで **実際に 描いた はんい** を 測って おき、
//   それに 合わせて 入れる。キャラごとの 手あては いらない。
const artBoxCache = Object.create(null);
function artBox(key){
  if (artBoxCache[key]) return artBoxCache[key];
  const ch = CHARS[key];
  // ★測る キャンバスは 大きめに とる。せまいと 大がまの 先などが
  //   measure の 時点で 切れて、box が 小さく 出て 本番で はみ出す
  const S = 3;
  const w = Math.ceil(ch.w * S * 5), h = Math.ceil(ch.h * S * 3.4);
  const t = document.createElement("canvas"); t.width = w; t.height = h;
  const c = t.getContext("2d");
  const footY = h * 0.75;
  const old = ctx;
  try {
    ctx = c;
    c.save(); c.translate(w/2, footY); c.scale(S, S);
    drawChar({ ch, w:ch.w, h:ch.h, face:1, hurtFlash:0, animT:0, vx:0, onGround:true,
               atkName:null, spKind:null, spDef:null, spT:0, squash:1, stun:0, shield:false });
    c.restore();
  } catch(e){ } finally { ctx = old; }
  let x0 = w, y0 = h, x1 = 0, y1 = 0, found = false;
  try {
    const d = c.getImageData(0, 0, w, h).data;
    for (let y = 0; y < h; y++){
      for (let x = 0; x < w; x++){
        if (d[(y*w + x)*4 + 3] > 10){
          found = true;
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    }
  } catch(e){}
  const box = found
    ? { w:(x1-x0+1)/S, h:(y1-y0+1)/S, cx:((x0+x1)/2 - w/2)/S, cy:((y0+y1)/2 - footY)/S }
    : { w:ch.w, h:ch.h, cx:0, cy:-ch.h/2 };
  artBoxCache[key] = box;
  return box;
}

// キャラの絵を 小さなcanvasに 描く（ゲーム中の描画関数を そのまま使う）
function drawPortrait(cv2, key, fill, big){
  const ch = CHARS[key];
  // 画面上の大きさに canvas の中身を そろえる（合わせないと 絵が つぶれて 見きれる）
  const r = cv2.getBoundingClientRect();
  const dw = Math.max(40, Math.round(r.width)), dh = Math.max(40, Math.round(r.height));
  if (cv2.width !== dw*2 || cv2.height !== dh*2){ cv2.width = dw*2; cv2.height = dh*2; }
  const c = cv2.getContext("2d");
  c.clearRect(0, 0, cv2.width, cv2.height);
  const old = ctx;
  try {
    ctx = c;                                   // 描画関数は ctx を見るので 一時的に すりかえる
    const two = PORTRAIT_2P[key];
    if (two){
      two(c, cv2.width, cv2.height, ch, !!big);
    } else {
      const box = artBox(key);
      let sc, ox, oy;
      if (big){
        // ★下の 1P/2P パネル＝**見きれさせない**。実際に描くはんい(box)に ぴったり 合わせる
        sc = Math.min((cv2.height * (fill || 0.86)) / box.h, (cv2.width * 0.86) / box.w);
        ox = cv2.width/2 - box.cx * sc;
        oy = cv2.height/2 - box.cy * sc;
      } else {
        // ★上の アイコン＝**キャラどうしの 大きさを そろえる**（身長 ch.h きじゅん）。
        //   兜や ぼうしが すこし 見きれても かまわない、とのこと。
        //   よこ幅の おさえは ゆるめ（1.25倍まで はみ出してよい）。きつくすると
        //   つばさや 大がまの ぶん だけ 小さく なって、大きさが そろわない
        sc = Math.min((cv2.height * 0.78) / ch.h, (cv2.width * 1.25) / box.w);
        ox = cv2.width/2;
        oy = cv2.height * 0.93;          // 足もとを そろえる
      }
      c.save();
      c.translate(ox, oy);
      c.scale(sc, sc);
      const stub = { ch, w:ch.w, h:ch.h, face:1, hurtFlash:0, animT:0, vx:0, onGround:true,
                     atkName:null, spKind:null, spDef:null, spT:0, squash:1, stun:0, shield:false };
      drawChar(stub);
      c.restore();
    }
  } finally { ctx = old; }
}

// --- コントローラーのボタン設定 ---
// ★1台ずつ設定する。設定中のコントローラー以外の入力は 受けつけない。
//   （前は どのコントローラーで押しても 共通の設定を書きかえていたので、
//     2台目を設定すると 1台目が おかしくなっていた）
const REMAP_ORDER = [["jump","ジャンプ"],["attack","こうげき"],["special","ひっさつ"]];
let remapPadIdx = 0, remapStep = 0, remapPrev = [];

function showRemap(){
  const pads = padList();
  if (pads.length === 0){
    overlay.innerHTML =
      '<div class="note" style="font-size:16px;color:#fff;line-height:2">' +
        'コントローラーが 見つかりません。<br>' +
        '<span style="font-size:13px;color:#9aa6c8">つないでから、コントローラーのボタンを1回押すと認識されます</span></div>' +
      '<div class="menu"><button class="big prim" id="ok">メニューへ</button></div>';
    document.getElementById("ok").onclick = showMenu;
    return;
  }
  state = "remap"; remapPadIdx = 0; remapStep = 0; remapPrev = [];
  drawRemap();
  pollRemap();
}

function drawRemap(){
  const pads = padList();
  const gp = pads[remapPadIdx];
  // このコントローラーの3つが 終わったら 次のコントローラーへ
  if (remapStep >= REMAP_ORDER.length){
    savePadMaps();
    remapPadIdx++; remapStep = 0; remapPrev = [];
    if (remapPadIdx < pads.length){ drawRemap(); return; }
    // 全部おわり
    const rows = pads.map((g,i) => {
      const m = mapFor(g);
      return '<div style="margin-bottom:8px"><b style="color:#ffd54a">' + (i+1) + '台目</b> ' +
        '<span style="font-size:11px;color:#7b86a8">' + g.id.slice(0,30) + '</span><br>' +
        'ジャンプ＝' + btnName(m.jump) + '　こうげき＝' + btnName(m.attack) + '　ひっさつ＝' + btnName(m.special) + '</div>';
    }).join("");
    overlay.innerHTML =
      '<div class="note" style="font-size:15px;color:#fff;line-height:1.8">✅ 設定しました！<br><br>' + rows + '</div>' +
      '<div class="menu"><button class="big prim" id="ok">メニューへ</button></div>';
    state = "menu";
    document.getElementById("ok").onclick = showMenu;
    return;
  }
  const [, label] = REMAP_ORDER[remapStep];
  overlay.innerHTML =
    '<div class="note" style="font-size:14px;color:#9aa6c8">' +
      '<b style="color:#fff;font-size:17px">' + (remapPadIdx+1) + '台目のコントローラー</b>' +
      ' <span style="font-size:11px">(' + (gp ? gp.id.slice(0,26) : "") + ')</span><br>' +
      'ぜんぶで ' + pads.length + '台 ／ 1台ずつ 設定します</div>' +
    '<div class="note" style="font-size:21px;color:#fff;line-height:2">' +
      '🎮 <b style="color:#ffd54a">' + label + '</b> に使うボタンを<br>' +
      '<b>' + (remapPadIdx+1) + '台目</b>で 押してください' +
      '<br><span style="font-size:13px;color:#9aa6c8">(' + (remapStep+1) + ' / ' + REMAP_ORDER.length + ')</span></div>' +
    '<div class="menu">' +
      '<button class="big" id="std" style="font-size:14px;padding:9px">標準にもどす（A=こうげき / B=ひっさつ / X・Y=ジャンプ）</button>' +
      '<button class="big" id="skip" style="font-size:14px;padding:9px">やめる（メニューへ）</button>' +
    '</div>';
  document.getElementById("skip").onclick = () => { state = "menu"; showMenu(); };
  document.getElementById("std").onclick = () => {
    for (const g of padList()) delete padMaps[g.id];   // 消せば mapFor が 標準を入れなおす
    savePadMaps(); state = "menu"; showMenu();
  };
}

function pollRemap(){
  if (state !== "remap") return;
  const pads = padList();
  const gp = pads[remapPadIdx];
  if (!gp){ state = "menu"; showMenu(); return; }
  for (let i=0;i<gp.buttons.length;i++){
    const on = gp.buttons[i].pressed || gp.buttons[i].value > 0.5;
    if (on && !remapPrev[i]){
      mapFor(gp)[REMAP_ORDER[remapStep][0]] = [i];
      remapStep++;
      // 指を離すまで 次に進まないよう、いま全部「押されている」扱いにする
      remapPrev = [];
      for (let k=0;k<gp.buttons.length;k++) remapPrev[k] = true;
      drawRemap();
      if (state !== "remap") return;
      setTimeout(pollRemap, 60);
      return;
    }
    remapPrev[i] = on;
  }
  requestAnimationFrame(pollRemap);
}

// ============================================================
//  ピンチ拡大・ダブルタップ拡大の防止（タブレット対策）
// ============================================================
(function blockZoom(){
  const stop = e => e.preventDefault();
  document.addEventListener("gesturestart", stop, { passive:false });
  document.addEventListener("gesturechange", stop, { passive:false });
  document.addEventListener("gestureend", stop, { passive:false });
  let lastTap = 0;
  document.addEventListener("touchend", e => {
    const onCtl = e.target.closest && e.target.closest("#touch-controls, #overlay");
    const now = Date.now();
    if (!onCtl && now - lastTap < 320) e.preventDefault();
    lastTap = now;
  }, { passive:false });
  document.addEventListener("dblclick", stop, { passive:false });
})();

// ---- 開発用のテスト窓口（遊ぶぶんには影響なし） ----
window.__smash = {
  get state(){ return state; },
  get frame(){ return frame; },
  info(){ return fighters.map(f => ({
    name:f.ch.name, cpu:f.isCPU, x:Math.round(f.x), y:Math.round(f.y),
    dmg:+f.dmg.toFixed(1), stocks:f.stocks, atk:f.atkName, sp:f.spName, spKind:f.spKind,
    hitstun:f.hitstun, onGround:f.onGround, respawn:f.respawnT,
    stun:f.stun, shield:f.shield, upUsed:f.upUsed, spCd:Object.assign({}, f.spCd),
    charging:!!f.spCharging, charge:f.spCharge|0,
    ledge:f.ledge ? f.ledge.side : null, ledgeT:f.ledgeT, ledgeCool:f.ledgeCool,
    invuln:f.invuln, vx:+f.vx.toFixed(2), vy:+f.vy.toFixed(2),
  })); },
  // テスト用：ファイターを 好きな ところに 置く
  place(i, x, y, vx, vy){ const f = fighters[i];
    f.x = x; f.y = y; f.vx = vx||0; f.vy = vy||0; f.onGround = false;
    f.hitstun = 0; f.invuln = 0; f.ledge = null; f.ledgeCool = 0; return f.ch.name; },
  start(a, b, m){ sel = [a||"maru", b||"kouyou"]; mode = m || "cpu"; startFight(); },
  // バランス測定用：両方を CPUに して 総当たりを 回す
  startCPU(a, b, jitter){ sel = [a, b]; mode = "cpu"; startFight();
    fighters.forEach(f => { f.isCPU = true; });
    // 開始位置を すこし ずらして 何回か 測る（同じ位置だと 毎回 同じ試合に なる）
    if (jitter){ fighters[0].x += jitter; fighters[1].x -= jitter; } },
  menu(){ showMenu(); return state; },
  result(){ return { state, winner: winner ? winner.ch.key : null,
    stocks: fighters.map(f => f.stocks), dmg: fighters.map(f => +f.dmg.toFixed(1)) }; },
  // 手動で コマを進める。ブラウザが 裏に回っていると requestAnimationFrame が
  // 止まって テストが動かないので、フレーム数を こちらから 指定できるようにしてある。
  tick(n){ for (let i = 0; i < (n || 1); i++) update(); return frame; },
  menuTick(n){ for (let i = 0; i < (n || 1); i++) menuInput(); return state; },
  menuInfo(){ return { state, focus: menuFocus,
    btns: [...overlay.querySelectorAll("button.big")].map(b => b.innerText.split("\n")[0]),
    cursor: cs ? cs.cursor.slice() : null, focusPi: cs ? cs.focusPi : null, sel: sel.slice() }; },
  render(){ draw(); },     // 画面を 1回だけ 描きなおす（スクショ確認用）
  bgmState(){ return bgm ? { on:bgmOn, paused:bgm.paused, t:+bgm.currentTime.toFixed(2),
    vol:bgm.volume, loop:bgm.loop, src:bgm.src.split("/").pop(),
    readyState:bgm.readyState, duration:+(bgm.duration||0).toFixed(1) } : "なし"; },
  projList(){ return projectiles.map(s => ({ vis:s.vis, x:Math.round(s.x), y:Math.round(s.y),
    vx:+s.vx.toFixed(1), owner:s.owner ? s.owner.ch.name : null, t:s.t, life:Math.round(s.life),
    dmg:+(s.dmg||0).toFixed(1), pillar:!!s.pillar })); },
  chars(){ return CHAR_LIST.slice(); },
  press(pi, act, on){ touchHeldTest(pi, act, on); },
  setDmg(i, v){ fighters[i].dmg = v; },
  version: GAME_VERSION,
};
// テスト用の擬似入力（1P/2Pどちらにも入れられる）
const testHeld = [Object.create(null), Object.create(null)];
function touchHeldTest(pi, act, on){ testHeld[pi][act] = !!on; }
const _gather = gatherInput;
gatherInput = function(pi){
  const d = _gather(pi);
  const t = testHeld[pi];
  if (t) for (const a of ACTS) if (t[a]) d[a] = true;
  return d;
};

showMenu();
loop();

})();
</script>
