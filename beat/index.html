// --- まほうまるりん（とんがりぼうし＋マント＋ほうき）---
function drawMagic(f){
  drawMaru(f, {
    behind: (f2) => {
      const run = Math.abs(f2.vx) > 0.5 && f2.onGround;
      const flow = (run ? 5 : 0) + (!f2.onGround ? 4 : 0) + Math.sin(f2.animT * 0.11) * 2;
      ctx.fillStyle = "#4a2f7a";
      ctx.beginPath();
      ctx.moveTo(-6, -14);
      ctx.quadraticCurveTo(-27 - flow, -4, -25 - flow * 1.3, 18);
      ctx.quadraticCurveTo(-11, 13, -1, 16);
      ctx.quadraticCurveTo(-4, 0, -6, -14);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#6a45a8";
      ctx.beginPath();
      ctx.moveTo(-6, -14);
      ctx.quadraticCurveTo(-20 - flow*0.7, -4, -18 - flow, 12);
      ctx.quadraticCurveTo(-9, 9, -2, 13);
      ctx.closePath(); ctx.fill();
      // ほうき（ダッシュ中は またがる）
      const d = f2.spDef;
      const flying = (d && d.fly && f2.spKind === "dash") || f2.spKind === "rise";
      if (flying){
        ctx.save(); ctx.translate(-4, 10); ctx.rotate(-0.12);
        ctx.strokeStyle = "#8a6a3a"; ctx.lineWidth = 3.4; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(20, -2); ctx.stroke();
        ctx.fillStyle = "#c9a24a";
        ctx.beginPath();
        ctx.moveTo(-18, 0); ctx.lineTo(-30, -7); ctx.lineTo(-32, 5); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    },
    front: (f2) => {
      // ★とんがりぼうしと つえ＝異世界編 drawMagicHat を そのまま移植。
      //   自分で 描きなおして いたので **つば・★の かざり・つえ が まるごと 無かった**
      //   （ユーザー指摘で 見つかった。ばつりんの ×印と 同じ たぐいの 抜け）。
      const run2 = Math.abs(f2.vx) > 0.5 && f2.onGround;
      const air2 = !f2.onGround;
      const sway = Math.sin(f2.animT * (run2 ? 0.28 : 0.08)) * (run2 ? 3.2 : 1.4);
      ctx.save();
      ctx.translate(1, -15);
      // つば
      ctx.fillStyle = "#4b3b8f";
      ctx.beginPath(); ctx.ellipse(0, 0, 17, 4.6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#6a55c4";
      ctx.beginPath(); ctx.ellipse(0, -1.2, 15, 3.6, 0, 0, 7); ctx.fill();
      // とんがり（先が すこし 曲がる）
      ctx.fillStyle = "#5b47a8";
      ctx.beginPath();
      ctx.moveTo(-11, -1);
      ctx.quadraticCurveTo(-5, -16, 2 + sway, -25);
      ctx.quadraticCurveTo(6 + sway * 0.6, -13, 11, -1);
      ctx.closePath(); ctx.fill();
      // 帯
      ctx.fillStyle = "#f0c33c";
      ctx.beginPath();
      ctx.moveTo(-11.5, -1.5); ctx.lineTo(11.5, -1.5); ctx.lineTo(10, -5.5); ctx.lineTo(-10, -5.5);
      ctx.closePath(); ctx.fill();
      // ★の かざり（さきっぽ）
      ctx.fillStyle = "#ffe98a";
      const stx = 2 + sway, sty = -25;
      for (let i = 0; i < 5; i++){
        const a = -Math.PI/2 + i * (Math.PI * 2 / 5);
        const px = stx + Math.cos(a) * 4.2, py = sty + Math.sin(a) * 4.2;
        if (i === 0){ ctx.beginPath(); ctx.moveTo(px, py); } else ctx.lineTo(px, py);
        const a2 = a + Math.PI / 5;
        ctx.lineTo(stx + Math.cos(a2) * 1.8, sty + Math.sin(a2) * 1.8);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
      // つえ（右手のあたり。先の玉が いつも ほんのり 光る）
      ctx.save();
      ctx.translate(15, 6);
      ctx.rotate(0.35 + (air2 ? -0.5 : 0) + Math.sin(f2.animT * 0.1) * 0.06);
      ctx.strokeStyle = "#8a6a45"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, -14); ctx.stroke();
      const gl2 = 0.6 + 0.4 * Math.sin(f2.animT * 0.18);
      ctx.globalAlpha = 0.5 + gl2 * 0.3;
      ctx.fillStyle = "#cfc2ff";
      ctx.beginPath(); ctx.arc(0, -16, 6.5, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#8f7fe8";
      ctx.beginPath(); ctx.arc(0, -16, 3.6, 0, 7); ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(-1.2, -17.2, 1.3, 0, 7); ctx.fill();
      ctx.restore();
      // 手のさきに 光（技のとき）
      if (f2.spKind === "proj" || f2.spKind === "pull"){
        const gl = 0.5 + 0.5*Math.sin(f2.animT*0.4);
        ctx.fillStyle = "rgba(200,170,255," + (0.4 + gl*0.4) + ")";
        ctx.beginPath(); ctx.arc(19, 7, 6 + gl*2, 0, 7); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(19, 7, 2.4, 0, 7); ctx.fill();
      }
    },
  });
}

// --- じゅうりょくまるりん（うちゅう服）---
function drawGravity(f){
  drawMaru(f, {
    behind: (f2) => {
      // ★まわりを ふわふわ する 星（異世界編 drawGravStars）
      ctx.fillStyle = "rgba(255,225,150,0.9)";
      for (let i = 0; i < 3; i++){
        const a = f2.animT * 0.03 + i * 2.09;
        const x = Math.cos(a) * 27, y = Math.sin(a * 1.3) * 20;
        const s = 1.6 + Math.sin(f2.animT * 0.09 + i) * 0.5;
        ctx.beginPath(); ctx.arc(x, y, s, 0, 7); ctx.fill();
      }
      // わっかの おくがわ（土星の わ）
      ctx.strokeStyle = "#8a7fb0"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(4, -3, 25, 7, -0.32, Math.PI, Math.PI*2); ctx.stroke();
    },
    // ★紺の うちゅう服（異世界編 drawGravSuit）＝体の 上・かおの 下に かさねる。
    //   移植で 抜けていて「ただの 灰色の 玉」に 見えていた（ユーザー指摘で 見つかった）。
    onBody: () => {
      ctx.save();
      ctx.beginPath(); ctx.ellipse(0, 0, 17, 19, 0, 0, 7); ctx.clip();
      ctx.fillStyle = "#1e2a5e";
      ctx.beginPath(); ctx.ellipse(-9, 0, 15, 20, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#2b3a7d";
      ctx.beginPath(); ctx.ellipse(-11, -3, 11, 13, 0, 0, 7); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = "#f0b23c"; ctx.lineWidth = 1.6;      // えりの 金ライン
      ctx.beginPath(); ctx.arc(3, 3, 13.5, -2.5, -0.5); ctx.stroke();
    },
    front: (f2) => {
      const run2 = Math.abs(f2.vx) > 0.5 && f2.onGround;
      const fs2 = run2 ? Math.sin(f2.animT * 0.4) * 6 : (!f2.onGround ? -3 : 0);
      // ★紺の ブーツ（異世界編 drawGravBoots）
      ctx.fillStyle = "#25306b";
      ctx.beginPath(); ctx.ellipse(-6, 16 - fs2*0.3, 6.4, 5.2, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse( 7, 16 + fs2*0.3, 6.4, 5.2, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = "#f0b23c"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-11.5, 14 - fs2*0.3); ctx.lineTo(-0.5, 14 - fs2*0.3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(1.6, 14 + fs2*0.3); ctx.lineTo(12.6, 14 + fs2*0.3); ctx.stroke();
      // すきとおった ヘルメット（異世界編 drawGravHelmet）
      ctx.save();
      const hx = 4, hy = -5, hr = 21;
      const gg = ctx.createRadialGradient(hx - 7, hy - 9, 2, hx, hy, hr);
      gg.addColorStop(0, "rgba(215,240,255,0.30)");
      gg.addColorStop(0.6, "rgba(150,200,255,0.10)");
      gg.addColorStop(1, "rgba(110,170,255,0.20)");
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(200,235,255,0.8)"; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 7); ctx.stroke();
      ctx.strokeStyle = "#f0b23c"; ctx.lineWidth = 2.6;      // 首もとの 金の ふち
      ctx.beginPath(); ctx.arc(hx, hy, hr, 0.55, 2.6); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.lineWidth = 2.4;   // てかり
      ctx.beginPath(); ctx.arc(hx, hy, hr - 3.5, -2.5, -1.6); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.7)";               // うつりこむ 星
      for (const s of [[-8, -14, 1.0], [12, -13, 0.8], [-11, 2, 0.7]]){
        ctx.beginPath(); ctx.arc(hx + s[0], hy + s[1], s[2], 0, 7); ctx.fill();
      }
      // わっかの 手前がわ
      ctx.strokeStyle = "#c9bff0"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(4, -3, 25, 7, -0.32, 0, Math.PI); ctx.stroke();
      ctx.strokeStyle = "#ffd54a"; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.ellipse(4, -3, 25, 7, -0.32, 0, Math.PI); ctx.stroke();
      ctx.restore();
      // 技のとき まわりに 引きよせの わ
      if (f2.spKind === "pull"){
        const k = (f2.spT % 20) / 20;
        ctx.strokeStyle = "rgba(190,150,255," + (0.8 - k*0.8).toFixed(2) + ")";
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, 20 + k*34, 0, 7); ctx.stroke();
      }
      // 浮遊＝足もとに 紫の わっかが 出て、ふわりと 浮いている のが わかる
      if (f2.floatT > 0){
        const k = (frame % 24) / 24;
        ctx.strokeStyle = "rgba(190,150,255," + (0.7 - k*0.7).toFixed(2) + ")";
        ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.ellipse(0, 20 + k*8, 20 - k*8, 6 - k*3, 0, 0, 7); ctx.stroke();
        ctx.fillStyle = "rgba(214,190,255,0.75)";
        for (let i=0;i<3;i++){
          const a = frame*0.08 + i*2.1;
          ctx.beginPath(); ctx.arc(Math.cos(a)*15, 14 - ((frame*0.8 + i*9) % 22), 1.9, 0, 7); ctx.fill();
        }
      }
      // 重り＝真下に 大きな 鉄のおもり（「重」の字つき）
      if (f2.spKind === "dive"){
        const dy = 22 + Math.min(14, f2.spT * 1.6);
        ctx.fillStyle = "#3a3550";
        roundRect(-14, dy, 28, 18, 4); ctx.fill();
        ctx.strokeStyle = "#191527"; ctx.lineWidth = 2; ctx.stroke();
        ctx.strokeStyle = "#8a7fb0"; ctx.lineWidth = 2.4;      // 取っ手
        ctx.beginPath(); ctx.arc(0, dy, 7, Math.PI, 0); ctx.stroke();
        ctx.fillStyle = "#cfc4ee"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("重", 0, dy + 14);
        ctx.textAlign = "start";
      }
    },
  });
}

// --- 妖精（異世界編 storyFairyDark の移植＝ようせいの ほんとうの すがた）---
//     まっくらな かげ＋ぬすんだ7つの力の 金。かたちは かわいい ころと 同じ
//     （三かくの からだ・まるい あたま・はね）＝「同じ子が 変わった」と わかるように
const FAIRY_ICONS = ["\u{1F409}","✨","⚔","\u{1F480}","\u{1F916}","❄","\u{1FA90}"];
function drawFairy(f){
  const sc = f.h / 62;                  // 元の絵は だいたい 62 の 高さ
  const t = f.animT;
  const flash = f.hurtFlash > 0 && Math.floor(f.hurtFlash/4) % 2 === 0;
  const DARK = "#1b1029", DARK2 = "#291a3d", GOLD = "rgba(255,216,94,";
  ctx.save();
  ctx.scale(sc, sc);
  ctx.translate(0, -22);                // 足元が 原点に なるように
  if (flash) ctx.globalAlpha = 0.55;
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.07);

  // ① 下からの 金の あかり（ぬすんだ 力）
  ctx.fillStyle = GOLD + (0.16 + 0.08 * pulse).toFixed(3) + ")";
  ctx.beginPath(); ctx.ellipse(0, 12, 40, 24, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(96,44,150,0.30)";
  ctx.beginPath(); ctx.arc(0, -2, 36 + pulse * 3, 0, 7); ctx.fill();

  // ② 7つの しるし＝頭のまわりを まわる わっか（おくがわ）
  const a0 = ctx.globalAlpha;
  const spin = f.spDef && f.spDef.sigils && f.spKind === "spin" ? f.spT * 0.22 : 0;
  const icon = (n, front) => {
    const a = t * 0.02 + spin + n * (Math.PI * 2 / 7);
    if ((Math.sin(a) > 0) !== front) return;
    const x = Math.cos(a) * 34, y = -6 + Math.sin(a) * 16;
    ctx.globalAlpha = a0 * (front ? 0.9 : 0.4);
    ctx.fillStyle = GOLD + "0.28)";
    ctx.beginPath(); ctx.arc(x, y, 6.5, 0, 7); ctx.fill();
    ctx.fillText(FAIRY_ICONS[n], x, y + 0.5);
    ctx.globalAlpha = a0;
  };
  ctx.font = "9px 'Segoe UI Emoji','Segoe UI',sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let n = 0; n < 7; n++) icon(n, false);

  // ③ はね：4まい・やぶれて とがっている。下べりだけ 金
  const flap = Math.sin(t * 0.22) * 0.26;
  for (const sgn of [-1, 1]){
    ctx.save(); ctx.scale(sgn, 1); ctx.rotate(-0.34 - flap * 0.4);
    ctx.fillStyle = "rgba(20,12,34,0.92)";
    ctx.beginPath();
    ctx.moveTo(3, -12);
    ctx.quadraticCurveTo(22, -34, 36, -20);
    ctx.lineTo(27, -15);
    ctx.lineTo(33, -8);
    ctx.quadraticCurveTo(18, -8, 3, -12);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = GOLD + "0.42)"; ctx.lineWidth = 1.1; ctx.stroke();
    ctx.fillStyle = "rgba(20,12,34,0.92)";
    ctx.beginPath();
    ctx.moveTo(3, -2);
    ctx.quadraticCurveTo(17, -13, 27, -3);
    ctx.lineTo(20, 0);
    ctx.lineTo(25, 6);
    ctx.quadraticCurveTo(14, 5, 3, -2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // ④ うで：長くのびた かげ。つめの さきだけ 金
  for (const sgn of [-1, 1]){
    const w2 = Math.sin(t * 0.07) * 2 * sgn;
    ctx.strokeStyle = DARK2; ctx.lineWidth = 2.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(sgn * 8, 1); ctx.lineTo(sgn * 18, 9 + w2); ctx.stroke();
    ctx.strokeStyle = GOLD + "0.55)"; ctx.lineWidth = 1.4;
    for (const dy of [-3.5, 0, 3.5]){
      ctx.beginPath(); ctx.moveTo(sgn * 18, 9 + w2); ctx.lineTo(sgn * 24, 9 + w2 + dy); ctx.stroke();
    }
  }

  // ⑤ からだ：三かく。まっくら＋下べりだけ 金のふち
  ctx.fillStyle = DARK;
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(13, 19); ctx.lineTo(-13, 19);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = GOLD + "0.60)"; ctx.lineWidth = 1.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-13, 19); ctx.lineTo(13, 19); ctx.stroke();
  ctx.strokeStyle = GOLD + "0.28)"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(13, 19); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(-13, 19); ctx.stroke();
  // むねの 中で 7つの 力が 光る
  ctx.fillStyle = GOLD + (0.35 + 0.3 * pulse).toFixed(3) + ")";
  ctx.beginPath(); ctx.ellipse(0, 8, 4.5, 6.5, 0, 0, 7); ctx.fill();

  // ⑥ かみ：まっくら。上へ 長くのびる
  ctx.fillStyle = DARK;
  for (const sgn of [-1, 1]){
    ctx.save(); ctx.scale(sgn, 1);
    ctx.beginPath();
    ctx.moveTo(1, -19);
    ctx.quadraticCurveTo(13, -30 - Math.sin(t * 0.08) * 3, 11, -40);
    ctx.quadraticCurveTo(16, -30, 8, -16);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ⑦ あたま
  ctx.fillStyle = DARK;
  ctx.beginPath(); ctx.arc(0, -14, 10, 0, 7); ctx.fill();
  ctx.strokeStyle = GOLD + "0.34)"; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(0, -14, 10, 0.35, Math.PI - 0.35); ctx.stroke();

  // ⑧ かお：つりあがった 金の すきま＝ここが「こわい」の 8わり
  for (const sgn of [-1, 1]){
    ctx.save(); ctx.scale(sgn, 1);
    ctx.fillStyle = GOLD + "0.28)";
    ctx.beginPath(); ctx.ellipse(4.6, -15.0, 5.4, 3.0, -0.5, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffe9a8";
    ctx.beginPath();
    ctx.moveTo(1.4, -12.4);
    ctx.lineTo(7.8, -17.2);
    ctx.lineTo(7.4, -14.2);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // 口：にやりと した わらい＋きば
  ctx.strokeStyle = GOLD + "0.75)"; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(-5.6, -8.8); ctx.quadraticCurveTo(0, -4.6, 5.6, -8.8); ctx.stroke();
  ctx.fillStyle = "#ffe9a8";
  ctx.beginPath(); ctx.moveTo(-5.2, -8.6); ctx.lineTo(-3.4, -8.2); ctx.lineTo(-4.2, -6.0); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(5.2, -8.6); ctx.lineTo(3.4, -8.2); ctx.lineTo(4.2, -6.0); ctx.closePath(); ctx.fill();

  // ⑨ てまえに 来た しるし
  ctx.font = "9px 'Segoe UI Emoji','Segoe UI',sans-serif";
  for (let n = 0; n < 7; n++) icon(n, true);
  ctx.restore();
}

// --- ケルベロス（異世界編 drawCerberus の移植・0.6倍に 縮めてある）---
function drawCerberus(f){
  const sc = f.h / 120;               // 元の絵は 足元0・頭のてっぺん -120 くらい
  const flash = f.hurtFlash > 0 && ((f.hurtFlash >> 2) & 1);
  const d = f.spDef;
  const run = (f.spKind === "dash" && d && f.spT > d.wind) || (Math.abs(f.vx) > 0.5 && f.onGround);
  const fireT = f.spKind === "proj" || f.spCharging ? 2 : (f.spKind === "rise" ? 0 : -1);
  const howl  = f.spKind === "press";       // 遠吠え
  const bite  = f.spKind === "multi";       // 三つ首噛み＝3つの首が 順ぐりに かむ
  ctx.save();
  ctx.scale(sc, sc);
  if (flash) ctx.globalAlpha = 0.6;
  // 遠吠え＝口から 音の わが 広がる（何が おきたか 見えなかったので 足した）
  if (howl){
    for (let i = 0; i < 3; i++){
      const k = ((f.spT * 3 + i * 22) % 66) / 66;
      ctx.strokeStyle = "rgba(190,225,255," + (0.65 * (1 - k)).toFixed(2) + ")";
      ctx.lineWidth = 4 - k * 2;
      ctx.beginPath();
      ctx.ellipse(20, -70, 30 + k * 150, 22 + k * 110, 0, -1.15, 1.15);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(20, -70, 30 + k * 150, 22 + k * 110, 0, Math.PI - 1.15, Math.PI + 1.15);
      ctx.stroke();
    }
  }
  const brth = Math.sin(f.animT * 0.06) * 2;
  const step = run ? Math.sin(f.animT * 0.7) * 12 : Math.sin(f.animT * 0.06) * 2;

  // しっぽ
  ctx.strokeStyle = "#1d1a26"; ctx.lineWidth = 11; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-56, -54);
  ctx.quadraticCurveTo(-84, -66 + brth * 2, -78, -92 + brth * 3);
  ctx.stroke();
  ctx.fillStyle = "#1d1a26";
  ctx.beginPath(); ctx.moveTo(-84, -88); ctx.lineTo(-72, -92); ctx.lineTo(-80, -106); ctx.closePath(); ctx.fill();
  // うしろあし
  ctx.strokeStyle = "#191622"; ctx.lineWidth = 15;
  ctx.beginPath(); ctx.moveTo(-40, -44); ctx.lineTo(-46 - step * 0.4, -3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-18, -44); ctx.lineTo(-14 + step * 0.4, -3); ctx.stroke();
  // 体
  ctx.fillStyle = "#312c42";
  ctx.beginPath(); ctx.ellipse(-6, -54 + brth * 0.4, 58, 30, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(143,216,228,0.30)"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = "#221e2f";
  ctx.beginPath(); ctx.ellipse(-10, -66 + brth * 0.4, 46, 14, 0, 0, 7); ctx.fill();
  // せなかの とげ
  ctx.fillStyle = "#3a3348";
  for (let i = 0; i < 4; i++){
    const sx2 = -40 + i * 20;
    ctx.beginPath(); ctx.moveTo(sx2 - 6, -76); ctx.lineTo(sx2, -90); ctx.lineTo(sx2 + 6, -76); ctx.closePath(); ctx.fill();
  }
  // まえあし
  ctx.strokeStyle = "#191622"; ctx.lineWidth = 15;
  ctx.beginPath(); ctx.moveTo(30, -44); ctx.lineTo(26 + step * 0.5, -3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(48, -44); ctx.lineTo(54 - step * 0.5, -3); ctx.stroke();
  ctx.fillStyle = "#0f0d16";
  for (const fx of [26 + step * 0.5, 54 - step * 0.5, -46 - step * 0.4, -14 + step * 0.4]){
    ctx.beginPath(); ctx.ellipse(fx, -3, 10, 5, 0, 0, 7); ctx.fill();
  }
  // 首わ（とげつき）
  ctx.fillStyle = "#5a2a2a"; ctx.fillRect(28, -76, 16, 34);
  ctx.fillStyle = "#c9a24a";
  for (let i = 0; i < 3; i++){
    const yy = -72 + i * 11;
    ctx.beginPath(); ctx.moveTo(44, yy - 4); ctx.lineTo(56, yy); ctx.lineTo(44, yy + 4); ctx.closePath(); ctx.fill();
  }
  // ---- 3つの 首（0=でんき・黄／1=こおり・水色／2=ほのお・オレンジ）----
  const HEAD_COL = ["#ffe86a", "#9fdcf5", "#ffb43c"];
  const HEAD_GLOW = ["rgba(255,232,106,", "rgba(160,220,250,", "rgba(255,140,50,"];
  const heads = [
    [34, -68, 40, -116 + brth, 0.82, 0],
    [34, -58, 54, -26 + brth, 0.82, 1],
    [40, -64, 92, -76 + brth, 1.0, 2],
  ];
  for (const h of heads){
    const nx = h[0], ny = h[1], hx = h[2], hy = h[3], k = h[4], el = h[5];
    const firing = fireT === el;
    ctx.strokeStyle = "#2b2639"; ctx.lineWidth = 20 * k; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(hx - 8 * k, hy + 6 * k); ctx.stroke();
    ctx.save();
    ctx.translate(hx, hy); ctx.scale(k, k);
    ctx.fillStyle = "#352f47";
    ctx.beginPath(); ctx.ellipse(0, 0, 21, 18, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(143,216,228,0.22)"; ctx.lineWidth = 2; ctx.stroke();
    // みみ
    ctx.fillStyle = "#1d1a26";
    ctx.beginPath(); ctx.moveTo(-10, -14); ctx.lineTo(-16, -33); ctx.lineTo(0, -19); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(9, -15); ctx.lineTo(6, -34); ctx.lineTo(19, -17); ctx.closePath(); ctx.fill();
    // はな先・口
    // 三つ首噛み＝首ごとに タイミングを ずらして 大きく 口を あける
    const biteK = bite ? Math.max(0, Math.sin(f.spT * 0.42 - el * 1.1)) : 0;
    const open = firing ? 10 : (howl ? 13 : (bite ? 3 + biteK * 15 : (run ? 6 : 2)));
    ctx.fillStyle = "#352f47";
    ctx.beginPath(); ctx.ellipse(20, 4, 17, 10, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#3b0f14";
    ctx.beginPath(); ctx.ellipse(24, 8 + open * 0.4, 15, 3 + open, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#f3efe2";
    for (let i = 0; i < 3; i++){
      const tx = 16 + i * 8;
      ctx.beginPath(); ctx.moveTo(tx - 3, 5 + open * 0.1); ctx.lineTo(tx, 12 + open * 0.5); ctx.lineTo(tx + 3, 5 + open * 0.1); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#0f0d16";
    ctx.beginPath(); ctx.ellipse(35, 0, 6, 5, 0, 0, 7); ctx.fill();
    // 目
    ctx.fillStyle = HEAD_GLOW[el] + (firing ? 0.75 : 0.45) + ")";
    ctx.beginPath(); ctx.arc(4, -6, firing ? 13 : 10, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-11, -7, firing ? 11 : 8, 0, 7); ctx.fill();
    ctx.fillStyle = HEAD_COL[el];
    ctx.beginPath(); ctx.ellipse(4, -6, 5.5, 4.5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-11, -7, 4.5, 3.8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#3b1004";
    ctx.beginPath(); ctx.ellipse(5, -6, 1.9, 3.6, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-10.5, -7, 1.6, 3, 0, 0, 7); ctx.fill();
    if (firing){
      if (el === 0){
        // ★電気のブレス＝ほのおと 同じ「もやっとした 玉」だと 電気に 見えないので、
        //   ギザギザの いなずまを 出す
        ctx.strokeStyle = "rgba(255,240,150,0.95)"; ctx.lineWidth = 3.2; ctx.lineJoin = "miter";
        for (let b = 0; b < 2; b++){
          const sd = b ? 1 : -1;
          ctx.beginPath(); ctx.moveTo(22, 8);
          for (let i = 1; i <= 4; i++){
            const px = 22 + i * 11;
            const py = 8 + sd * ((i % 2) ? 9 : -6) + Math.sin(f.animT * 0.9 + i) * 2;
            ctx.lineTo(px, py);
          }
          ctx.stroke();
        }
        ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(22, 8);
        for (let i = 1; i <= 4; i++) ctx.lineTo(22 + i*11, 8 + ((i%2) ? 5 : -4));
        ctx.stroke();
        ctx.fillStyle = "rgba(255,246,190,0.85)";
        ctx.beginPath(); ctx.arc(24, 8, 7, 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = HEAD_GLOW[el] + "0.85)";
        ctx.beginPath(); ctx.ellipse(30, 8, 13, 5 + open * 0.4, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "rgba(255,255,235,0.9)";
        ctx.beginPath(); ctx.ellipse(28, 8, 6, 2.5 + open * 0.2, 0, 0, 7); ctx.fill();
      }
    }
    ctx.restore();
  }
  ctx.restore();
}

// --- しにがみまるりん（異世界編 drawReaperGear の移植）---
const HOOD_CX = 6, HOOD_CY = 6, HOOD_RX = 13, HOOD_RY = 10;
function drawReaper(f){
  drawMaru(f, {
    front: (f2) => {
      const run = Math.abs(f2.vx) > 0.5 && f2.onGround;
      const flow = (run ? 2 : 0) + (!f2.onGround ? 3 : 0) + Math.sin(f2.animT * 0.1) * 1.2;
      // ---- 目の 光（ローブより 先に 描く）----
      const gl = 0.5 + 0.5 * Math.sin(f2.animT * 0.09);
      ctx.save();
      ctx.globalAlpha = 0.34 + gl * 0.3;
      for (const e of [[2, -3, 9], [13, -3, 8]]){
        const g2 = ctx.createRadialGradient(e[0], e[1], 1, e[0], e[1], e[2]);
        g2.addColorStop(0, "rgba(205,185,255,0.95)");
        g2.addColorStop(1, "rgba(150,110,255,0)");
        ctx.fillStyle = g2;
        ctx.beginPath(); ctx.arc(e[0], e[1], e[2], 0, 7); ctx.fill();
      }
      ctx.restore();
      // 目を 描きなおす（光で とばないように）
      ctx.fillStyle = "#4fb4ea";
      ctx.beginPath(); ctx.arc(2, -4, 5.4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(13, -4, 4.8, 0, 7); ctx.fill();
      ctx.fillStyle = "#15151a";
      ctx.beginPath(); ctx.arc(2, -4, 4.2, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(13, -4, 3.6, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(3.2, -2.2, 1.3, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(13.9, -2.1, 1.1, 0, 7); ctx.fill();

      // ---- ローブ（フードと つながった 1まいの 布。かおのところだけ 穴）----
      ctx.save();
      ctx.fillStyle = "#17142a";
      ctx.beginPath();
      ctx.moveTo(-25 - flow * 0.4, 27);
      ctx.quadraticCurveTo(-22, 2, -17, -11);
      ctx.quadraticCurveTo(-14, -23, 0, -24);
      ctx.quadraticCurveTo(14, -24, 18, -10);
      ctx.quadraticCurveTo(24, 4, 26, 27);
      ctx.lineTo(19, 18); ctx.lineTo(12, 29); ctx.lineTo(5, 18);
      ctx.lineTo(-2, 29); ctx.lineTo(-9, 18); ctx.lineTo(-17, 29);
      ctx.closePath();
      ctx.moveTo(HOOD_CX + HOOD_RX, HOOD_CY);
      ctx.ellipse(HOOD_CX, HOOD_CY, HOOD_RX, HOOD_RY, 0, 0, Math.PI * 2);
      ctx.fill("evenodd");
      // 光の あたる ところ
      ctx.fillStyle = "rgba(90,80,140,0.30)";
      ctx.beginPath();
      ctx.moveTo(-2, -22);
      ctx.quadraticCurveTo(12, -21.5, 15, -11);
      ctx.quadraticCurveTo(9, -14, -2, -16);
      ctx.closePath(); ctx.fill();
      // フードの うち がわ
      ctx.strokeStyle = "#7b7592"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(HOOD_CX, HOOD_CY, HOOD_RX, HOOD_RY, 0, 0, Math.PI * 2);
      ctx.stroke();
      // 耳は フードの 上から 出す
      for (const es of [-1, 1]){
        const ex = es < 0 ? -8 : 9, ey = -23;
        ctx.fillStyle = "#efe1c6";
        ctx.beginPath(); ctx.ellipse(ex, ey, 4.4, 5.6, es * 0.3, 0, 7); ctx.fill();
        ctx.fillStyle = "#e2d0ac";
        ctx.beginPath(); ctx.ellipse(ex, ey + 0.8, 2.1, 2.8, es * 0.3, 0, 7); ctx.fill();
        ctx.strokeStyle = "rgba(40,34,60,0.35)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(ex, ey, 4.4, 5.6, es * 0.3, 0, 7); ctx.stroke();
      }
      // すその ひだ
      ctx.strokeStyle = "rgba(70,62,110,0.55)"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-11, 6); ctx.quadraticCurveTo(-13, 16, -10, 25); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(16, 4); ctx.quadraticCurveTo(19, 15, 18, 25); ctx.stroke();
      ctx.restore();

      // ---- 大がま（もちかたが 技で かわる）----
      ctx.save();
      const d = f2.spDef;
      const swing = f2.spKind === "dash" && d && !d.shadow;
      if (swing && f2.spT <= d.wind){                 // ふりかぶり
        const k = f2.spT / d.wind;
        ctx.translate(-6 - k * 3, -4 - k * 3); ctx.rotate(-0.35 - k * 0.5);
      } else if (swing){                              // ふりおろし
        ctx.translate(14, 0); ctx.rotate(1.95);
      } else if (f2.spKind === "spin"){               // かまあらし
        ctx.rotate(f2.spT * 0.4);
      } else if (f2.spKind === "rise"){               // かまフック
        ctx.translate(10, -10); ctx.rotate(-0.9);
      } else {
        ctx.translate(15, 7); ctx.rotate(0.34);       // ふだんの かまえ
      }
      drawScytheWeapon();
      ctx.restore();
    },
  });
}

// --- ロボットまるりん（異世界編 drawRobotGear の移植）---
const RB_ARM = "#e9eff7", RB_ARM_D = "#b3c0d2", RB_ARM_E = "#6e7c93",
      RB_DARK = "#2b3550", RB_CYAN = "#46e0ff";
function drawRobot(f){
  drawMaru(f, {
    front: (f2) => {
      const t = f2.animT;
      const run = Math.abs(f2.vx) > 0.5 && f2.onGround;
      const legPhase = Math.sin(t * 0.4);
      const footSwing = run ? legPhase * 6 : (!f2.onGround ? -3 : 0);
      // メカブーツ
      for (const ft of [[-6, 15 - footSwing * 0.3], [7, 15 + footSwing * 0.3]]){
        ctx.fillStyle = RB_ARM;
        ctx.beginPath(); ctx.ellipse(ft[0], ft[1] - 0.6, 6.4, 4.8, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = RB_ARM_E; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = RB_DARK;
        ctx.beginPath(); ctx.ellipse(ft[0], ft[1] + 3, 6.2, 2.2, 0, 0, 7); ctx.fill();
        ctx.fillStyle = RB_CYAN;
        ctx.beginPath(); ctx.ellipse(ft[0] + 3, ft[1] - 1.4, 1.5, 1, 0, 0, 7); ctx.fill();
      }
      // そうこう（下必殺で 出している あいだ）＝かたい 板で 表す
      if (f2.shield){
        const sh = 0.55 + 0.45 * Math.sin(t * 0.07);
        for (const sd of [-1, 1]){
          ctx.save();
          ctx.translate(sd * 15, -4); ctx.rotate(sd * 0.26);
          ctx.fillStyle = RB_ARM;
          roundRect(-6, -7, 12, 13, 4); ctx.fill();
          ctx.strokeStyle = RB_ARM_E; ctx.lineWidth = 1.2; ctx.stroke();
          ctx.strokeStyle = "rgba(70,224,255," + (0.5 + sh * 0.45) + ")"; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(-3.4, 2.4); ctx.lineTo(3.4, 2.4); ctx.stroke();
          ctx.restore();
        }
        ctx.fillStyle = RB_ARM_D;
        roundRect(-4, 6, 14, 9, 3); ctx.fill();
        ctx.strokeStyle = RB_ARM_E; ctx.lineWidth = 1.1; ctx.stroke();
        ctx.fillStyle = "rgba(70,224,255," + (0.35 + sh * 0.4) + ")";
        roundRect(-2, 8, 10, 2.4, 1.2); ctx.fill();
      }
      // 体の よこの ほうねつ口
      for (const s of [[-15.5, 1], [16.5, 1]]){
        ctx.fillStyle = RB_ARM_D;
        roundRect(s[0] - 2, s[1] - 4.5, 4, 9, 1.8); ctx.fill();
        ctx.strokeStyle = RB_ARM_E; ctx.lineWidth = 0.9; ctx.stroke();
        ctx.strokeStyle = RB_DARK; ctx.lineWidth = 0.9;
        for (let i = -1; i <= 1; i++){
          ctx.beginPath(); ctx.moveTo(s[0] - 1.4, s[1] + i * 2.4); ctx.lineTo(s[0] + 1.4, s[1] + i * 2.4); ctx.stroke();
        }
      }
      // 手（ふだんは ガントレット／ビームのときは ほう／ドリルダッシュのときは ドリル）
      const d = f2.spDef;
      const beaming = f2.spKind === "proj" || f2.spCharging;
      const drilling = f2.spKind === "multi" && d && d.drill && f2.spT > d.wind * 0.5;
      const hx = 16, hy = 8;
      if (drilling){
        // ★ドリルは「自分の 長い じく」で 回る。ここを ctx.rotate() で 全体ごと 回すと
        //   持ち手が ぐるぐる 回って見える（ユーザー指摘）。円すいは 止めたまま、
        //   らせんの みぞだけ 先へ 流して 回転を 見せる。
        ctx.save(); ctx.translate(hx + 2, hy - 4);
        const DL = 25, DR = 7;                       // 長さ・根もとの太さ
        ctx.beginPath(); ctx.moveTo(0, -DR); ctx.lineTo(DL, 0); ctx.lineTo(0, DR); ctx.closePath();
        ctx.fillStyle = RB_ARM; ctx.fill();
        ctx.save(); ctx.clip();
        const ph = (t * 1.6) % 8;
        for (let i = -2; i < 6; i++){
          const gx = i * 8 + ph;
          ctx.strokeStyle = "rgba(120,136,160,0.95)"; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(gx, -DR-2); ctx.lineTo(gx + 5.5, DR+2); ctx.stroke();
          ctx.strokeStyle = "rgba(70,224,255,0.55)"; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(gx + 3, -DR-2); ctx.lineTo(gx + 8.5, DR+2); ctx.stroke();
        }
        ctx.restore();
        ctx.strokeStyle = RB_ARM_E; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(0, -DR); ctx.lineTo(DL, 0); ctx.lineTo(0, DR); ctx.closePath(); ctx.stroke();
        // 根もとの じく受け（ここは 回らない）
        ctx.fillStyle = RB_ARM_D; roundRect(-6, -DR-1, 8, DR*2+2, 2.5); ctx.fill();
        ctx.strokeStyle = RB_ARM_E; ctx.lineWidth = 1; ctx.stroke();
        // 先っぽの 火花
        ctx.fillStyle = "rgba(255,240,180,0.9)";
        for (let i=0;i<3;i++){
          const a = t * 0.7 + i * 2.1;
          ctx.beginPath(); ctx.arc(DL + 2 + Math.cos(a)*3, Math.sin(a)*5, 1.6, 0, 7); ctx.fill();
        }
        ctx.restore();
      } else if (beaming){
        ctx.fillStyle = RB_ARM_D;
        roundRect(hx - 4, hy - 6, 18, 11, 4); ctx.fill();
        ctx.strokeStyle = RB_ARM_E; ctx.lineWidth = 1.1; ctx.stroke();
        ctx.fillStyle = RB_CYAN;
        ctx.beginPath(); ctx.arc(hx + 13, hy - 0.5, 3.2, 0, 7); ctx.fill();
      } else {
        for (const hh of [[-13, 8], [hx, hy]]){
          ctx.fillStyle = RB_ARM;
          roundRect(hh[0] - 4, hh[1] - 4.5, 8.5, 9, 3); ctx.fill();
          ctx.strokeStyle = RB_ARM_E; ctx.lineWidth = 1; ctx.stroke();
          ctx.fillStyle = RB_CYAN;
          ctx.beginPath(); ctx.arc(hh[0] + 0.3, hh[1], 1.4, 0, 7); ctx.fill();
        }
      }
      // ヘルメット（あたまの てっぺんだけ）
      ctx.fillStyle = RB_ARM_D;
      ctx.beginPath(); ctx.ellipse(3, -18, 15, 6.8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = RB_ARM;
      ctx.beginPath(); ctx.ellipse(3, -19.4, 14.2, 5.4, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = RB_ARM_E; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.ellipse(3, -18, 15, 6.8, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = RB_ARM_D;
      ctx.beginPath(); ctx.ellipse(3, -21.4, 5.6, 3.1, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = RB_ARM_E; ctx.lineWidth = 1; ctx.stroke();
      ctx.strokeStyle = RB_ARM_E; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.moveTo(-9, -16.5); ctx.lineTo(15, -16.5); ctx.stroke();
      // 耳は ヘルメットの 上から
      for (const es of [-1, 1]){
        const ex = es * 9;
        ctx.fillStyle = "#efe1c6";
        ctx.beginPath(); ctx.ellipse(ex, -21.5, 4.6, 5.6, es * 0.3, 0, 7); ctx.fill();
        ctx.fillStyle = "#e2d0ac";
        ctx.beginPath(); ctx.ellipse(ex, -20.6, 2.2, 2.8, es * 0.3, 0, 7); ctx.fill();
      }
      // ゴーグル（おでこに はねあげ）
      ctx.fillStyle = "rgba(70,224,255,0.62)";
      roundRect(-7, -13.6, 22, 4.4, 2.1); ctx.fill();
      ctx.strokeStyle = "rgba(200,250,255,0.9)"; ctx.lineWidth = 1.1; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      roundRect(-5, -12.9, 9, 1.3, 0.65); ctx.fill();
      // アンテナ
      ctx.strokeStyle = RB_ARM_E; ctx.lineWidth = 1.6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(11, -21); ctx.lineTo(15, -28); ctx.stroke();
      ctx.fillStyle = RB_CYAN;
      ctx.beginPath(); ctx.arc(15, -29, 2, 0, 7); ctx.fill();
      // ジェット中は 足もとから 炎
      if (f2.spDef && f2.spDef.jet && f2.spKind === "rise"){
        ctx.fillStyle = "rgba(255,160,60,0.85)";
        for (const fx of [-6, 7]){
          ctx.beginPath(); ctx.ellipse(fx, 22 + Math.random()*3, 3.4, 7 + Math.random()*4, 0, 0, 7); ctx.fill();
        }
        ctx.fillStyle = "rgba(255,240,180,0.9)";
        for (const fx of [-6, 7]){ ctx.beginPath(); ctx.ellipse(fx, 20, 2, 4, 0, 0, 7); ctx.fill(); }
      }
    },
  });
}

// --- こおりまるりん（異世界編 drawIceCloak / drawIceCrown の移植）---
function drawIce(f){
  drawMaru(f, {
    behind: (f2) => {
      const run = Math.abs(f2.vx) > 0.5 && f2.onGround;
      const flow = (run ? 6 : 0) + (!f2.onGround ? 5 : 0) + Math.sin(f2.animT * 0.11) * 2;
      ctx.save();
      // 氷の マント（雪景色に とけないよう はっきりした青）
      const g = ctx.createLinearGradient(-26, -14, -2, 18);
      g.addColorStop(0, "#8fdcff");
      g.addColorStop(0.55, "#3f96c8");
      g.addColorStop(1, "#1c5f8c");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-6, -14);
      ctx.quadraticCurveTo(-27 - flow, -4, -25 - flow * 1.3, 17);
      ctx.quadraticCurveTo(-11, 12, -1, 15);
      ctx.quadraticCurveTo(-4, 0, -6, -14);
      ctx.closePath(); ctx.fill();
      // マントの すそに ぎざぎざの つらら
      ctx.fillStyle = "#eafaff";
      for (let i = 0; i < 4; i++){
        const bx = -23 - flow + i * 5.4;
        ctx.beginPath();
        ctx.moveTo(bx, 12 + i * 0.8); ctx.lineTo(bx + 4, 12 + i * 0.8); ctx.lineTo(bx + 2, 20 + i * 0.5);
        ctx.closePath(); ctx.fill();
      }
      // えり（白い ふわふわ）
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.ellipse(-4, -12, 9.5, 4, -0.3, 0, 7); ctx.fill();
      ctx.fillStyle = "#dceefb";
      ctx.beginPath(); ctx.ellipse(-6, -11, 5, 2.4, -0.3, 0, 7); ctx.fill();
      ctx.restore();
    },
    front: (f2) => {
      ctx.save();
      ctx.rotate(Math.sin(f2.animT * 0.09) * 0.05);
      // つららの かんむり（みみと みみの あいだ）
      const g = ctx.createLinearGradient(0, -30, 0, -14);
      g.addColorStop(0, "#ffffff");
      g.addColorStop(1, "#7fcbea");
      ctx.fillStyle = g;
      for (const sp of [[-6.5, 9], [0.5, 14], [7.5, 9]]){
        ctx.beginPath();
        ctx.moveTo(sp[0] - 3, -16);
        ctx.lineTo(sp[0], -16 - sp[1]);
        ctx.lineTo(sp[0] + 3, -16);
        ctx.closePath(); ctx.fill();
      }
      // わっか
      ctx.fillStyle = "#a9e2f7";
      ctx.fillRect(-11, -17.5, 22, 3.2);
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.fillRect(-11, -17.5, 22, 1.2);
      // ほっぺの しも
      ctx.strokeStyle = "rgba(150,220,250,0.8)"; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(11, 5); ctx.lineTo(15, 4);
      ctx.moveTo(11.5, 7); ctx.lineTo(14.5, 6.4);
      ctx.stroke();
      // 白い いき（ときどき ふわっと）
      const br = (f2.animT % 90);
      if (br < 26){
        ctx.globalAlpha = 0.5 * (1 - br / 26);
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.ellipse(20 + br * 0.5, 2, 4 + br * 0.24, 3 + br * 0.18, 0, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
      // ホッケーショット＝スティックを ふりぬく（飛び道具を 撃つ だけ だったので 足した）
      if (f2.spKind === "proj" && f2.spSlot === "side"){
        const th = Math.min(1, f2.spT / 8);
        ctx.save();
        ctx.translate(10, 6); ctx.rotate(-1.5 + th * 1.9);
        ctx.strokeStyle = "#8a6a3a"; ctx.lineWidth = 3.2; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(24, 0); ctx.stroke();
        ctx.strokeStyle = "#3a4a58"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(23, 0); ctx.lineTo(31, 5); ctx.stroke();
        ctx.restore();
      }
      // 氷の橋＝のぼりながら 足もとに 氷の あしばが できて 積み上がる
      if (f2.spKind === "rise"){
        for (let i = 0; i < 3; i++){
          const k = f2.spT - i * 7;
          if (k < 0) continue;
          ctx.globalAlpha = Math.max(0, 0.75 - k * 0.02);
          ctx.fillStyle = "#cdeeff";
          ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 1.4;
          const by = 20 + k * 1.9, bw = 17 - i * 3;
          ctx.beginPath();
          ctx.moveTo(-bw, by); ctx.lineTo(bw, by - 2);
          ctx.lineTo(bw - 4, by + 6); ctx.lineTo(-bw + 3, by + 7);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    },
  });
}

// --- さむらいまるりん（異世界編 drawSamuraiCoat / drawSamuraiGear の移植）---
function drawSamurai(f){
  const guarding = f.spKind === "reflect";                                  // かまえ
  const charging = f.spCharging;                                            // しゅくちぎりの ため（居合のかまえ）
  const cutting  = !!f.atkName || f.spKind === "rise" || f.spKind === "multi";  // 斬り／つばめがえし／二段斬り
  const cutUp    = f.atkName === "up" || f.spKind === "rise";
  const diving   = f.spKind === "dive";                                     // かぶとわり

  drawMaru(f, {
    // 陣羽織（からだの うしろ）
    behind: (f2) => {
      const run = Math.abs(f2.vx) > 0.5 && f2.onGround;
      const flow = (run ? 6 : 0) + (!f2.onGround ? 5 : 0) + Math.sin(f2.animT * 0.12) * 2;
      ctx.save();
      ctx.fillStyle = "#2b3150";
      ctx.beginPath();
      ctx.moveTo(-6, -14);
      ctx.quadraticCurveTo(-29 - flow, -6, -27 - flow * 1.3, 19);
      ctx.quadraticCurveTo(-14, 13, 2, 17);
      ctx.quadraticCurveTo(-1, 0, -6, -14);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#b23a2e";                  // 裏地（赤）
      ctx.beginPath();
      ctx.moveTo(-6, -14);
      ctx.quadraticCurveTo(-21 - flow * 0.7, -5, -19 - flow, 14);
      ctx.quadraticCurveTo(-10, 10, -2, 14);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#e8e2d0";                  // えり
      ctx.beginPath(); ctx.ellipse(-4, -12, 6.5, 3, -0.3, 0, 7); ctx.fill();
      ctx.restore();
    },
    // 兜と刀（からだの 手前）
    front: () => {
      const GOLD = "#d9b23f", GOLD_HI = "#f3d878", BLACK = "#20242e";
      ctx.save();
      ctx.translate(0, -17);
      // しころ（首まわりの たれ）
      ctx.fillStyle = BLACK;
      ctx.beginPath();
      ctx.moveTo(-12, -2);
      ctx.quadraticCurveTo(-16, 2, -15, 7);
      ctx.lineTo(13, 7);
      ctx.quadraticCurveTo(14, 2, 12, -2);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.moveTo(-15, 3); ctx.lineTo(13.5, 3); ctx.stroke();
      // 吹返し（左右に そりあがる板）＝兜の いちばんの 目じるし
      for (const s2 of [-1, 1]){
        ctx.save();
        ctx.translate(s2 * 10, 1);
        ctx.scale(s2, 1);
        ctx.rotate(-0.46);
        ctx.beginPath();
        ctx.moveTo(0, -5.5);
        ctx.lineTo(11.5, -7.5);
        ctx.quadraticCurveTo(14.5, -1.5, 12.5, 4.5);
        ctx.lineTo(0, 6);
        ctx.closePath();
        ctx.fillStyle = BLACK; ctx.fill();
        ctx.strokeStyle = GOLD; ctx.lineWidth = 2.1; ctx.lineJoin = "round"; ctx.stroke();
        ctx.fillStyle = GOLD;
        ctx.beginPath(); ctx.arc(7, -1, 2.2, 0, 7); ctx.fill();
        ctx.restore();
      }
      // 鉢（兜の本体）
      ctx.fillStyle = BLACK;
      ctx.beginPath(); ctx.ellipse(0, 0, 15.5, 10.5, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#31363f";
      ctx.beginPath(); ctx.ellipse(-3, -0.5, 10, 7.2, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.16)";
      ctx.beginPath(); ctx.ellipse(-6, -3.5, 4, 2.6, -0.5, 0, 7); ctx.fill();
      // 眉庇（ひさし）
      ctx.fillStyle = BLACK;
      ctx.beginPath(); ctx.ellipse(1, 0, 16, 3, 0, 0, 7); ctx.fill();
      ctx.fillStyle = GOLD;
      ctx.beginPath(); ctx.ellipse(1, 1.4, 16, 1.3, 0, 0, 7); ctx.fill();
      // 大鍬形（金のつの2本）
      for (const s2 of [-1, 1]){
        ctx.save();
        ctx.translate(2 + s2 * 6.2, -3);
        ctx.rotate(s2 * 0.16);
        ctx.fillStyle = GOLD;
        ctx.beginPath();
        ctx.moveTo(-2.3, 1); ctx.lineTo(-2.0, -14); ctx.lineTo(-4.8, -18);
        ctx.lineTo(-2.4, -21.5); ctx.lineTo(0.8, -19.5); ctx.lineTo(2.2, -14.5); ctx.lineTo(2.3, 1);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = GOLD_HI;
        ctx.beginPath();
        ctx.moveTo(-0.9, 0.4); ctx.lineTo(-0.7, -14); ctx.lineTo(-2.6, -17.9);
        ctx.lineTo(-1.3, -19.7); ctx.lineTo(0.2, -18.2); ctx.lineTo(0.9, -14.3); ctx.lineTo(1.0, 0.4);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      // 前立ての 花の紋
      ctx.fillStyle = GOLD;
      ctx.beginPath(); ctx.ellipse(2, -6.5, 7.5, 3.6, 0, 0, 7); ctx.fill();
      for (let i = 0; i < 5; i++){
        const a2 = -Math.PI / 2 + i * Math.PI * 0.4;
        ctx.fillStyle = GOLD_HI;
        ctx.beginPath(); ctx.arc(2 + Math.cos(a2) * 3.1, -6.8 + Math.sin(a2) * 3.1, 2.3, 0, 7); ctx.fill();
      }
      ctx.fillStyle = "#8a6b1e";
      ctx.beginPath(); ctx.arc(2, -6.8, 1.5, 0, 7); ctx.fill();
      ctx.restore();

      // ---- 刀（かまえ・ため・斬りで もちかたが かわる）----
      ctx.save();
      let sheathed = true, len = 22;
      if (diving)        { ctx.translate(9, 5);   ctx.rotate(1.5);   sheathed = false; len = 30; }
      else if (guarding) { ctx.translate(19, 2);  ctx.rotate(-1.5);  sheathed = false; len = 26; }
      else if (cutting)  { ctx.translate(15, 2);  ctx.rotate(cutUp ? -1.85 : -0.3); sheathed = false; len = 28; }
      else if (charging) { ctx.translate(2, 9);   ctx.rotate(3.38); }
      else               { ctx.translate(-1, 9);  ctx.rotate(3.32); }
      ctx.strokeStyle = "#26262e"; ctx.lineWidth = 3.2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(7, 0); ctx.stroke();
      ctx.strokeStyle = "#c9a24a"; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(8.4, -3); ctx.lineTo(8.4, 3); ctx.stroke();
      if (sheathed){
        ctx.strokeStyle = "#1f2430"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(10, 0); ctx.quadraticCurveTo(16, -1, len, -2.6); ctx.stroke();
      } else {
        ctx.strokeStyle = "#dfeaf7"; ctx.lineWidth = 2.8;
        ctx.beginPath(); ctx.moveTo(10, 0); ctx.quadraticCurveTo(18, -1.4, len, -4); ctx.stroke();
        ctx.strokeStyle = "rgba(255,255,255,0.95)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(11, -1.1); ctx.quadraticCurveTo(18, -2.4, len - 1, -4.8); ctx.stroke();
      }
      ctx.restore();
      // かまえが 決まった瞬間の きらめき
      if (guarding && f.spT < 14){
        ctx.save();
        ctx.globalAlpha = Math.min(1, (14 - f.spT) / 14) * 0.85;
        ctx.strokeStyle = "#fff7c4"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(12, 0, 18 + f.spT * 1.4, -1.1, 1.1); ctx.stroke();
        ctx.restore();
      }
    },
  });
}

// --- こうよう（S3ボスの絵を移植・簡略） ---
function drawKouyou(f){
  const W2 = f.w, H2 = f.h;
  const flash = f.hurtFlash > 0 && Math.floor(f.hurtFlash/3) % 2 === 0;
  const skin  = flash ? "#ffdccb" : "#f6cfa4";
  const skinD = flash ? "#f6c4b0" : "#e6b184";
  const d = f.spDef;
  const charging = f.spKind === "dash" && d && f.spT > d.wind && f.spT <= d.wind + d.dur;
  const crouch  = (f.spKind === "dash" && d && f.spT <= d.wind) || (f.spKind === "press" && f.spT >= 900);
  const shikoUp = f.spKind === "press" && f.spT < 900;      // しこ：足を開いて 落ちてくる
  const rising  = f.spKind === "rise";                      // のぼりつっぱり：両手を 上へ
  const salting = f.spKind === "proj";                      // 塩まき：手を 高く上げて まく
  const holding = f.spKind === "counter";                   // はっけよい：低くかまえて 待つ
  const lean = charging ? 6 : 0;
  const stance = crouch ? 13 : (f.atkName ? 5 : 0);
  const punch = (f.atkName === "side" || f.atkName === "air") ? 14 : 0;

  // 影
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath(); ctx.ellipse(0, 2, W2*0.6, 8, 0, 0, 7); ctx.fill();
  // 足（しこ中は 大きく開いて 足を上げる）
  const legSpread = (crouch || shikoUp || holding) ? W2*0.46 : W2*0.28;
  const footY = shikoUp ? -12 : -5;
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.ellipse(-legSpread, footY, 12, 8, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( legSpread, footY, 12, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = skinD;
  ctx.beginPath(); ctx.ellipse(-legSpread, -18 + stance, 15, 16, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( legSpread, -18 + stance, 15, 16, 0, 0, 7); ctx.fill();
  // まわし
  ctx.fillStyle = "#f7f4ea";
  roundRect(-W2*0.42, -H2*0.52, W2*0.84, H2*0.30, 6); ctx.fill();
  ctx.fillStyle = "#e7e1cf"; ctx.fillRect(-6 + lean*0.5, -H2*0.52, 12, H2*0.30);
  // 胴
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.ellipse(lean*0.4, -H2*0.52, W2*0.46, H2*0.34, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = skinD; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(lean*0.4, -H2*0.44, 2.5, 0, 7); ctx.stroke();
  // 腕（のぼりつっぱり中は 両手を 上へ／交互に 突き出す）
  ctx.fillStyle = skin;
  if (rising){
    const alt = Math.sin(f.spT * 0.9) * 8;
    ctx.beginPath(); ctx.ellipse(-W2*0.34, -H2*0.92 - 10 + alt, 11, 10, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse( W2*0.34, -H2*0.92 - 10 - alt, 11, 10, 0, 0, 7); ctx.fill();
  } else if (holding){
    // はっけよい＝両手を 前に 出して 低くかまえる（うけとめ 待ち）
    const bob = Math.sin(f.spT * 0.35) * 2;
    ctx.beginPath(); ctx.ellipse(W2*0.46, -H2*0.46 + bob, 12, 10, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(W2*0.30, -H2*0.62 - bob, 12, 10, 0, 0, 7); ctx.fill();
    if (f.counterT > 0){                       // うけとめ中＝黄色い ふちが 光る
      ctx.strokeStyle = "rgba(255,214,90," + (0.45 + Math.abs(Math.sin(frame*0.4))*0.5).toFixed(2) + ")";
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(0, -H2*0.5, W2*0.7, H2*0.58, 0, 0, 7); ctx.stroke();
    }
    ctx.fillStyle = skin;
  } else if (salting){
    // 塩まき＝うしろ手は こしに、まえ手を 高く ふりあげて まく
    const th = Math.min(1, f.spT / 8);                       // ふりあげ→ふりおろし
    const ay = -H2*0.95 + th * 18, ax = W2*0.52 + th * 10;
    ctx.beginPath(); ctx.ellipse(-W2*0.5, -H2*0.5, 11, 9, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ax, ay, 12, 10, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffffff";                               // 手からこぼれる 塩
    for (let i=0;i<5;i++){
      const a = f.spT * 0.4 + i * 1.3;
      ctx.beginPath(); ctx.arc(ax + Math.cos(a)*9, ay + 6 + ((f.spT*1.5 + i*5) % 16), 1.8, 0, 7); ctx.fill();
    }
    ctx.fillStyle = skin;
  } else {
    ctx.beginPath(); ctx.ellipse(-W2*0.5 + lean, -H2*0.55 - stance*0.5, 11, 9, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse( W2*0.5 + lean + punch, -H2*0.55 - stance*0.5 - punch*0.3, 12, 10, 0, 0, 7); ctx.fill();
  }
  // 頭
  const hy = -H2*0.86 - stance*0.3;
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.ellipse(lean, hy, W2*0.36, W2*0.34, 0, 0, 7); ctx.fill();
  // 髪
  ctx.fillStyle = "#241a14";
  ctx.beginPath(); ctx.ellipse(lean, hy - W2*0.14, W2*0.37, W2*0.22, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(lean - W2*0.37, hy - W2*0.05);
  ctx.quadraticCurveTo(lean - W2*0.2, hy - W2*0.02, lean - W2*0.05, hy - W2*0.1);
  ctx.quadraticCurveTo(lean + W2*0.1, hy - W2*0.02, lean + W2*0.37, hy - W2*0.05);
  ctx.lineTo(lean + W2*0.37, hy - W2*0.16); ctx.lineTo(lean - W2*0.37, hy - W2*0.16);
  ctx.closePath(); ctx.fill();
  // めがね
  const ex = W2*0.15, ey = hy + 2;
  ctx.strokeStyle = "#222"; ctx.lineWidth = 2.4; ctx.fillStyle = "#fff";
  roundRect(lean - ex - 9 + 1.5, ey - 6, 16, 12, 4); ctx.fill(); ctx.stroke();
  roundRect(lean + ex - 7 + 1.5, ey - 6, 16, 12, 4); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lean - ex + 7 + 1.5, ey); ctx.lineTo(lean + ex - 7 + 1.5, ey); ctx.stroke();
  // 目
  ctx.fillStyle = "#241a14";
  ctx.beginPath(); ctx.arc(lean - ex + 1.5, ey, 2.6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(lean + ex + 2.5, ey, 2.6, 0, 7); ctx.fill();
  // 口
  ctx.strokeStyle = "#a85a3e"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(lean + 1.5, hy + W2*0.16, 7, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  // ほっぺ
  ctx.fillStyle = "rgba(244,150,120,0.5)";
  ctx.beginPath(); ctx.arc(lean - W2*0.24, hy + W2*0.12, 4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(lean + W2*0.24, hy + W2*0.12, 4, 0, 7); ctx.fill();
  // ためのオーラ
  if (crouch){
    ctx.strokeStyle = "rgba(255,120,60," + (0.3 + Math.sin(f.spT*0.6)*0.25).toFixed(2) + ")";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, -H2*0.5, W2*0.75, H2*0.62, 0, 0, 7); ctx.stroke();
  }
}

// 攻撃の「当たっているあいだ」だけ光る しろい弧。
// 見た目だけでなく、当たり判定が出ている時間がそのまま見えるので、
// タイミングを覚える手がかりになる。
function drawPenguin(f, green, alive){
  const body  = green ? "#c8d27c" : "#aed4e7";
  const line  = green ? "#93925f" : "#8a9aa2";
  const belly = green ? "#f3efd4" : "#fdfbf3";
  const flashBody = green ? "#eef0d8" : "#e6f2f8";
  const W2 = f.w, H2 = f.h;
  const flash = f.hurtFlash > 0 && Math.floor(f.hurtFlash / 4) % 2 === 0;
  // 影
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath(); ctx.ellipse(0, 2, W2*0.6, 7, 0, 0, 7); ctx.fill();
  // 足
  ctx.fillStyle = "#efc04a"; ctx.strokeStyle = "#cf9f2e"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(-W2*0.26, -3, 8, 5, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse( W2*0.26, -3, 8, 5, 0, 0, 7); ctx.fill(); ctx.stroke();
  // ペギの頭の ワンポイントの ギザギザ（体のうしろ）
  if (!green){
    const ty = -H2 + 5;
    ctx.fillStyle = "#9fc6da"; ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(-13, ty + 8); ctx.lineTo(-8, ty - 2); ctx.lineTo(-3, ty + 6);
    ctx.lineTo(2, ty - 4); ctx.lineTo(7, ty + 6); ctx.lineTo(12, ty - 2); ctx.lineTo(15, ty + 8);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // 体（まるい）
  ctx.fillStyle = flash ? flashBody : body;
  ctx.strokeStyle = line; ctx.lineWidth = 3;
  roundRect(-W2/2, -H2, W2, H2, Math.min(W2, H2) * 0.46);
  ctx.fill(); ctx.stroke();
  // お腹
  ctx.fillStyle = belly;
  ctx.beginPath(); ctx.ellipse(0, -H2*0.30, W2*0.34, H2*0.30, 0, 0, 7); ctx.fill();
  if (alive !== false){
    // 目（やや横長）
    ctx.fillStyle = "#33312a";
    ctx.beginPath(); ctx.ellipse(-W2*0.16 + 1.5, -H2*0.55, 4.6, 3.4, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse( W2*0.16 + 1.5, -H2*0.55, 4.6, 3.4, 0, 0, 7); ctx.fill();
    // くちばし
    ctx.fillStyle = "#e6bf5c"; ctx.strokeStyle = "#c39f42"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(1.5, -H2*0.42, 6, 3.6, 0, 0, 7); ctx.fill(); ctx.stroke();
  }
}
// プレイヤーが つかうのは ペギ（水いろ）のほう
function drawPenguins(f){
  const d = f.spDef;
  // 腹すべり＝おなかを 下にして ねそべって すべる（立ったまま 走っていた のを 直した）
  if (f.spKind === "dash" && d && d.slide && f.spT > d.wind){
    ctx.save();
    ctx.translate(-f.h * 0.30, -f.w * 0.44);
    ctx.rotate(1.25);
    drawPenguin(f, false);
    ctx.restore();
    // すべった あとの 雪けむり
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    for (let i = 0; i < 4; i++){
      const k = (f.spT * 2 + i * 7) % 24;
      ctx.beginPath();
      ctx.arc(-14 - k, -4 - Math.sin(k * 0.4) * 5, 5 - k * 0.14, 0, 7); ctx.fill();
    }
    return;
  }
  drawPenguin(f, false);
  // キュウリ投げ＝つばさを ふりかぶって 投げる
  if (f.spKind === "proj"){
    const th = Math.min(1, f.spT / 7);
    ctx.save();
    ctx.translate(f.w * 0.34, -f.h * 0.52);
    ctx.rotate(-2.1 + th * 2.6);
    ctx.fillStyle = "#9fc6da"; ctx.strokeStyle = "#8a9aa2"; ctx.lineWidth = 2;
    roundRect(-3, -3, 18, 7, 3.5); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

// --- クリウド（世界編 pkDrawClovis の移植）---
//     元の絵は 足元0・頭-117 の 大きさで 描いてあるので、身長に あわせて 縮める
function drawClovis(f){
  const sc = f.h / 117;
  const d = f.spDef;
  // グラウンダーシュートも「けって 撃つ」技なので 足をふる（棒立ちだった）
  const kick  = f.spKind === "rise" || f.spKind === "proj" ||
                f.atkName === "side" || f.atkName === "air";
  const runup = (f.spKind === "dash" && d && f.spT > d.wind) || (Math.abs(f.vx) > 0.5 && f.onGround)
                ? f.animT : 0;
  const flash = f.hurtFlash > 0 && Math.floor(f.hurtFlash/4) % 2 === 0;
  ctx.save();
  ctx.scale(sc, sc);
  if (flash) ctx.globalAlpha = 0.75;
  ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.beginPath(); ctx.ellipse(0, 2, 22, 5, 0, 0, 7); ctx.fill();
  const legSwing = runup ? Math.sin(runup * 0.4) * 8 : 0;
  // 脚（肌）
  ctx.strokeStyle = "#dca87e"; ctx.lineWidth = 8; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-6, -40); ctx.lineTo(-8 + legSwing, -6); ctx.stroke();
  if (kick){ ctx.beginPath(); ctx.moveTo(6, -40); ctx.lineTo(26, -30); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(6, -40); ctx.lineTo(8 - legSwing, -6); ctx.stroke(); }
  // 緑のソックス
  ctx.strokeStyle = "#1f7a44"; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(-8 + legSwing, -11); ctx.lineTo(-8 + legSwing, -4); ctx.stroke();
  if (kick){ ctx.beginPath(); ctx.moveTo(23, -31); ctx.lineTo(27, -30); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(8 - legSwing, -11); ctx.lineTo(8 - legSwing, -4); ctx.stroke(); }
  // シューズ（黒）
  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath(); ctx.ellipse(-8 + legSwing, -2, 6, 3, 0, 0, 7); ctx.fill();
  if (kick){ ctx.beginPath(); ctx.ellipse(29, -29, 6, 3, 0, 0, 7); ctx.fill(); }
  else { ctx.beginPath(); ctx.ellipse(8 - legSwing, -2, 6, 3, 0, 0, 7); ctx.fill(); }
  // 緑の短パン
  ctx.fillStyle = "#1f7a44"; roundRect(-12, -58, 24, 22, 4); ctx.fill();
  ctx.fillStyle = "#186235"; ctx.fillRect(-12, -44, 24, 3);
  // 赤いユニフォーム（胴）
  ctx.fillStyle = "#d8232a"; roundRect(-14, -92, 28, 38, 6); ctx.fill();
  ctx.fillStyle = "#c01d24"; ctx.fillRect(-14, -60, 28, 4);
  // 緑のV襟
  ctx.strokeStyle = "#0a6b3b"; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-7, -91); ctx.lineTo(0, -84); ctx.lineTo(7, -91); ctx.stroke();
  // 胸のマーク
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(-8, -84, 2.4, 1.4, -0.3, 0, 7); ctx.fill();
  ctx.fillStyle = "#f5d20c"; ctx.beginPath(); ctx.arc(8, -84, 2.2, 0, 7); ctx.fill();
  // 背番号7
  ctx.fillStyle = "#fff"; ctx.font = "bold 15px 'Segoe UI',sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("7", 0, -72);
  // 腕
  ctx.lineCap = "round";
  const armsUp = f.spKind === "rise" ? Math.min(1, f.spT / 8) : 0;
  if (armsUp){
    ctx.strokeStyle = "#d8232a"; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(-12, -86); ctx.lineTo(-14 - 14*armsUp, -94 - 10*armsUp); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, -86); ctx.lineTo(14 + 14*armsUp, -94 - 10*armsUp); ctx.stroke();
    ctx.fillStyle = "#dca87e";
    ctx.beginPath(); ctx.arc(-14 - 14*armsUp, -94 - 10*armsUp, 4, 0, 7);
    ctx.arc(14 + 14*armsUp, -94 - 10*armsUp, 4, 0, 7); ctx.fill();
  } else {
    ctx.strokeStyle = "#d8232a"; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(-12, -86); ctx.lineTo(-19, -64); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, -86); ctx.lineTo(19, -64); ctx.stroke();
    ctx.fillStyle = "#dca87e"; ctx.beginPath(); ctx.arc(-19, -63, 3.6, 0, 7); ctx.arc(19, -63, 3.6, 0, 7); ctx.fill();
  }
  // キャプテンマーク（左腕・青）
  ctx.strokeStyle = "#2b4aa0"; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(-13, -82); ctx.lineTo(-14, -77); ctx.stroke();
  // 頭
  ctx.fillStyle = "#e3b487"; ctx.beginPath(); ctx.arc(0, -104, 10, 0, 7); ctx.fill();
  // 髪（短髪）
  ctx.fillStyle = "#2a2018";
  ctx.beginPath();
  ctx.moveTo(-9.5, -109);
  ctx.quadraticCurveTo(-10.5, -113.5, -6, -114);
  ctx.quadraticCurveTo(0, -115.5, 6, -114);
  ctx.quadraticCurveTo(10.5, -113.5, 9.5, -109);
  ctx.quadraticCurveTo(5, -110.5, 2.4, -109.6);
  ctx.quadraticCurveTo(0, -108.8, -2.4, -109.6);
  ctx.quadraticCurveTo(-5, -110.5, -9.5, -109);
  ctx.closePath(); ctx.fill();
  for (let i = -1; i <= 1; i++){
    ctx.beginPath(); ctx.moveTo(i*5 - 2, -113.5); ctx.lineTo(i*5 + 0.5, -117); ctx.lineTo(i*5 + 2, -113.5);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = "#3a2c20";
  ctx.fillRect(-10, -110, 1.6, 5); ctx.fillRect(8.4, -110, 1.6, 5);
  // 眉＋目
  ctx.strokeStyle = "#241c14"; ctx.lineWidth = 1.4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-6.3, -107); ctx.lineTo(-1.8, -106.6);
  ctx.moveTo(1.8, -106.6); ctx.lineTo(6.3, -107); ctx.stroke();
  ctx.fillStyle = "#20303a"; ctx.beginPath(); ctx.arc(-3.6, -104.5, 1.5, 0, 7); ctx.arc(3.6, -104.5, 1.5, 0, 7); ctx.fill();
  // 大きな笑顔
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(0, -99.5, 4.2, 2.4, 0, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = "#a85a3a"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, -100, 4.4, 0.15, Math.PI - 0.15); ctx.stroke();
  // ドリブル中は 足もとに ボール
  if (f.spKind === "dash" && d && d.ball && f.spT > d.wind){
    drawSoccerBall(20, -8, 9, f.spT * 0.5);
  }
  ctx.restore();
}

// サッカーボール（クリウドの技で 何度も使う）
function drawSoccerBall(x, y, r, rot){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.strokeStyle = "#c9ccd4"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.fillStyle = "#22262e";
  ctx.beginPath();
  for (let i=0;i<5;i++){
    const a = i * Math.PI*2/5 - Math.PI/2;
    ctx.lineTo(Math.cos(a)*r*0.42, Math.sin(a)*r*0.42);
  }
  ctx.closePath(); ctx.fill();
  for (let i=0;i<5;i++){
    const a = i * Math.PI*2/5 - Math.PI/2 + Math.PI/5;
    ctx.beginPath(); ctx.arc(Math.cos(a)*r*0.78, Math.sin(a)*r*0.78, r*0.2, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// --- ドランプ大統領（世界編 drawDrampBoss の移植・演壇なしの立ち姿）---
// SP（シークレットサービス）＝黒スーツ・サングラス・耳の コード。
//   ドランプの「SP突撃」で 前後を かためて いっしょに 走る。
//   ★ドランプの ローカル座標（足元0・頭-95）で 描く。本人より 少し 小さめ。
function drampSP(ox, t){
  const run = Math.sin(t * 0.55) * 5;
  ctx.save();
  ctx.translate(ox, 0); ctx.scale(0.82, 0.82);
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath(); ctx.ellipse(0, 0, 22, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#15181f";                                  // 脚（走っている）
  ctx.save(); ctx.translate(-6, -30); ctx.rotate(run * 0.05); ctx.fillRect(-5, 0, 10, 30); ctx.restore();
  ctx.save(); ctx.translate(6, -30); ctx.rotate(-run * 0.05); ctx.fillRect(-5, 0, 10, 30); ctx.restore();
  ctx.fillStyle = "#0b0d12";
  ctx.beginPath(); ctx.ellipse(-7 + run*0.3, -1, 8, 4, 0, 0, 7); ctx.ellipse(7 - run*0.3, -1, 8, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#1b1f29"; roundRect(-18, -64, 36, 36, 5); ctx.fill();   // 黒スーツ
  ctx.fillStyle = "#e8eaee";                                              // 白シャツ
  ctx.beginPath(); ctx.moveTo(-6, -64); ctx.lineTo(6, -64); ctx.lineTo(4, -34); ctx.lineTo(-4, -34); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#20242e";                                              // 黒ネクタイ
  ctx.beginPath(); ctx.moveTo(-3, -61); ctx.lineTo(3, -61); ctx.lineTo(2, -38); ctx.lineTo(0, -34); ctx.lineTo(-2, -38); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#1b1f29"; ctx.fillRect(-25, -62, 8, 26); ctx.fillRect(17, -62, 8, 26);  // 腕
  ctx.fillStyle = "#c99a72";
  ctx.beginPath(); ctx.arc(-21, -35, 4, 0, 7); ctx.arc(21, -35, 4, 0, 7); ctx.fill();
  ctx.fillStyle = "#c99a72";                                              // 頭
  ctx.beginPath(); ctx.arc(0, -76, 13, 0, 7); ctx.fill();
  ctx.fillStyle = "#23262c";                                              // かりあげ頭
  ctx.beginPath(); ctx.arc(0, -79, 13, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#0d0f14";                                              // サングラス
  roundRect(-11, -80, 22, 7, 3); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.35)"; roundRect(-9, -79, 6, 2.2, 1); ctx.fill();
  ctx.strokeStyle = "#d8d2c6"; ctx.lineWidth = 1.4;                       // 耳の コード
  ctx.beginPath(); ctx.moveTo(11, -76); ctx.quadraticCurveTo(16, -68, 13, -60); ctx.stroke();
  ctx.restore();
}

function drawDramp(f){
  const sc = f.h / 95;                  // 元の絵は 足元0・頭のてっぺん -95
  const flash = f.hurtFlash > 0 && Math.floor(f.hurtFlash/4) % 2 === 0;
  const d = f.spDef;
  // ゴルフは 通常B だけ（横Bの SPも proj なので スロットで 見わける）
  const golf = (f.spKind === "proj" && f.spSlot !== "side") || f.spCharging;
  const eating = f.spKind === "heal";
  const call   = f.spKind === "proj" && f.spSlot === "side";   // SP出動＝よび出す ポーズ
  const heli   = f.spKind === "rise";                          // 大統領ヘリ＝ローターが 回る
  ctx.save();
  ctx.scale(sc, sc);
  if (flash) ctx.globalAlpha = 0.4;
  const bob = Math.sin(f.animT * 0.1) * 1.5;
  ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.beginPath(); ctx.ellipse(0, 0, 30, 6, 0, 0, 7); ctx.fill();
  // 脚（濃紺スーツのズボン）
  ctx.fillStyle = "#22314a";
  ctx.fillRect(-15, -30, 12, 30); ctx.fillRect(3, -30, 12, 30);
  // 靴
  ctx.fillStyle = "#111";
  ctx.beginPath(); ctx.ellipse(-9, -1, 9, 4, 0, 0, 7); ctx.ellipse(9, -1, 9, 4, 0, 0, 7); ctx.fill();
  // ジャケット（濃紺）
  ctx.fillStyle = "#26374f"; roundRect(-22, -66, 44, 40, 6); ctx.fill();
  // 白いシャツ
  ctx.fillStyle = "#f4f4f0";
  ctx.beginPath(); ctx.moveTo(-7, -66); ctx.lineTo(7, -66); ctx.lineTo(5, -30); ctx.lineTo(-5, -30); ctx.closePath(); ctx.fill();
  // 赤い長いネクタイ
  ctx.fillStyle = "#d8232a";
  ctx.beginPath(); ctx.moveTo(-4, -62); ctx.lineTo(4, -62); ctx.lineTo(3, -34); ctx.lineTo(0, -28); ctx.lineTo(-3, -34); ctx.closePath(); ctx.fill();
  // ジャケットの襟
  ctx.fillStyle = "#1e2c40";
  ctx.beginPath(); ctx.moveTo(-8, -66); ctx.lineTo(0, -50); ctx.lineTo(-14, -52); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(8, -66); ctx.lineTo(0, -50); ctx.lineTo(14, -52); ctx.closePath(); ctx.fill();
  // 腕
  ctx.fillStyle = "#26374f"; ctx.fillRect(-28, -64, 8, 26); ctx.fillRect(20, -64, 8, 26);
  ctx.fillStyle = "#e8b98c";
  ctx.beginPath(); ctx.arc(-24, -36, 4, 0, 7); ctx.arc(24, -36, 4, 0, 7); ctx.fill();
  // 頭（日焼けオレンジ）
  ctx.fillStyle = "#e8a86a"; ctx.beginPath(); ctx.arc(0, -78 + bob, 15, 0, 7); ctx.fill();
  // 目・眉・口
  ctx.fillStyle = "#3a2a1a";
  ctx.beginPath(); ctx.arc(-5, -80 + bob, 1.8, 0, 7); ctx.arc(5, -80 + bob, 1.8, 0, 7); ctx.fill();
  ctx.strokeStyle = "#c8935a"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-8, -84 + bob); ctx.lineTo(-2, -83 + bob);
  ctx.moveTo(2, -83 + bob); ctx.lineTo(8, -84 + bob); ctx.stroke();
  ctx.strokeStyle = "#8a5a3a"; ctx.lineWidth = 1.6;
  if (eating){ ctx.beginPath(); ctx.arc(0, -72 + bob, 4, 0.1, Math.PI - 0.1); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(-4, -72 + bob); ctx.lineTo(4, -72 + bob); ctx.stroke(); }
  // 金髪（横分けのボリューム）
  ctx.fillStyle = "#e8cf6a";
  ctx.beginPath();
  ctx.moveTo(-15, -82 + bob);
  ctx.quadraticCurveTo(-18, -96 + bob, -4, -95 + bob);
  ctx.quadraticCurveTo(10, -96 + bob, 16, -88 + bob);
  ctx.quadraticCurveTo(10, -90 + bob, 2, -89 + bob);
  ctx.quadraticCurveTo(-8, -88 + bob, -15, -82 + bob);
  ctx.closePath(); ctx.fill();
  // ゴルフクラブ（ため中は 振りかぶり／撃つとき 振りぬく）
  if (golf){
    const hx = 16, hy = -44;
    const ang = f.spCharging ? -2.0 : (-0.2 + Math.min(16, f.spT) * 0.1);
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(ang);
    ctx.strokeStyle = "#2f343c"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(52, 0); ctx.stroke();
    ctx.fillStyle = "#c9ccd2"; ctx.beginPath(); ctx.ellipse(54, 3, 10, 6, 0.4, 0, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#e8b98c"; ctx.beginPath(); ctx.arc(hx, hy, 4.5, 0, 7); ctx.fill();
  }
  // 大統領ヘリ＝あたまの上で ローターが 回る（＋しっぽと そり）
  if (heli){
    const spin = Math.sin(f.spT * 1.5);          // 横から見た ローターの ちぢみ
    ctx.strokeStyle = "#3a4658"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -96); ctx.lineTo(0, -106); ctx.stroke();
    ctx.fillStyle = "#4a5768";
    ctx.beginPath(); ctx.ellipse(0, -108, 7, 4, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(220,232,245,0.95)"; ctx.lineWidth = 3.4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-44*spin, -110); ctx.lineTo(44*spin, -110); ctx.stroke();
    ctx.strokeStyle = "rgba(220,232,245,0.35)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -110, 44, 4, 0, 0, 7); ctx.stroke();
    // しっぽローター（うしろ）
    ctx.strokeStyle = "#3a4658"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-18, -68); ctx.lineTo(-40, -74); ctx.stroke();
    ctx.strokeStyle = "rgba(220,232,245,0.9)"; ctx.lineWidth = 2.4;
    const ts = Math.cos(f.spT * 1.7);
    ctx.beginPath(); ctx.moveTo(-42, -74 - 9*ts); ctx.lineTo(-42, -74 + 9*ts); ctx.stroke();
    // 風（下へ ふきおろす）
    ctx.strokeStyle = "rgba(200,225,255,0.5)"; ctx.lineWidth = 2;
    for (let i=-1;i<=1;i++){
      const yy = -18 + ((f.spT*4 + i*11) % 26);
      ctx.beginPath(); ctx.moveTo(i*16 - 4, yy); ctx.lineTo(i*16 + 4, yy + 7); ctx.stroke();
    }
  }
  // SP出動＝腕を まっすぐ 前に 出して「行け」と 指さす
  if (call){
    ctx.strokeStyle = "#26374f"; ctx.lineWidth = 9; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(20, -62); ctx.lineTo(40, -62); ctx.stroke();
    ctx.fillStyle = "#e8b98c"; ctx.beginPath(); ctx.arc(44, -62, 5, 0, 7); ctx.fill();
  }
  // ハンバーガー（食べているあいだ だんだん小さく）
  if (eating && d){
    const left = Math.max(0, 1 - f.spT / d.dur);
    const bx = 20, by = -62, s = 0.6 + left * 0.6;
    ctx.save(); ctx.translate(bx, by); ctx.scale(s, s);
    ctx.fillStyle = "#e0a552"; ctx.beginPath(); ctx.ellipse(0, -5, 11, 7, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#6fae3f"; ctx.fillRect(-11, -1, 22, 3);
    ctx.fillStyle = "#8a4a2a"; ctx.fillRect(-10, 2, 20, 4);
    ctx.fillStyle = "#e0a552"; ctx.beginPath(); ctx.ellipse(0, 8, 11, 5, 0, 0, Math.PI); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// --- 織田信長（異世界編 drawNobunaga の移植）---
function drawNobunaga(f){
  const sc = f.h / 88;                  // 元の絵は 足元0・まげのてっぺん -87
  const hurt = f.hurtFlash > 0 && Math.floor(f.hurtFlash/4) % 2 === 0;
  const d = f.spDef;
  const dashing = f.spKind === "dash" && d && f.spT > d.wind;
  const bow = f.spKind === "proj" || f.spCharging;      // 弓をかまえる

  ctx.fillStyle = "rgba(0,0,0,0.25)";

  const flow = (dashing ? 10 : 0) + Math.sin(f.animT * 0.06) * 3;
  ctx.fillStyle = hurt ? "#ffffff" : "#4a1420";
  ctx.beginPath();
  ctx.moveTo(-8, -62);
  ctx.quadraticCurveTo(-34 - flow, -40, -30 - flow, 0);
  ctx.lineTo(-4, 0);
  ctx.quadraticCurveTo(-8, -30, -8, -62);
  ctx.closePath(); ctx.fill();
  // はかま
  ctx.fillStyle = hurt ? "#ffffff" : "#241f2b";
  ctx.beginPath();
  ctx.moveTo(-18, 0); ctx.lineTo(-13, -30); ctx.lineTo(13, -30); ctx.lineTo(18, 0);
  ctx.closePath(); ctx.fill();
  // どう（黒＋金のふち）
  ctx.fillStyle = hurt ? "#ffffff" : "#16161e";
  roundRect(-17, -60, 34, 32, 6); ctx.fill();
  ctx.strokeStyle = "#c9a24a"; ctx.lineWidth = 2;
  roundRect(-17, -60, 34, 32, 6); ctx.stroke();
  ctx.fillStyle = "#c9a24a";
  ctx.beginPath(); ctx.arc(0, -46, 5.5, 0, 7); ctx.fill();
  ctx.fillStyle = "#16161e";
  ctx.beginPath(); ctx.arc(0, -46, 2.4, 0, 7); ctx.fill();
  // 髪の 土台
  ctx.fillStyle = hurt ? "#ffffff" : "#1b1720";
  ctx.beginPath(); ctx.ellipse(1, -67, 13.5, 13.5, 0, 0, 7); ctx.fill();
  // かお（月代＝前あたまを そっている）
  ctx.fillStyle = hurt ? "#ffffff" : "#e6c39a";
  ctx.beginPath(); ctx.ellipse(1, -70, 11, 12, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(1, -72.5, 12.5, 11.5, 0, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = "#241d18"; ctx.lineWidth = 1.8; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(2, -75); ctx.lineTo(9, -73); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-3, -75); ctx.lineTo(-8, -73.5); ctx.stroke();
  ctx.fillStyle = "#241d18";
  ctx.beginPath(); ctx.ellipse(6, -70, 2, 2.6, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-3, -70, 2, 2.6, 0, 0, 7); ctx.fill();
  // ひげ
  ctx.strokeStyle = "#241d18"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-2, -62); ctx.lineTo(5, -62); ctx.stroke();
  // ちょんまげ
  ctx.fillStyle = hurt ? "#ffffff" : "#1b1720";
  ctx.beginPath(); ctx.ellipse(-6.5, -79, 4.6, 3.6, 0, 0, 7); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-8, -80.5);
  ctx.quadraticCurveTo(-1, -87, 7, -85.5);
  ctx.quadraticCurveTo(8.6, -84, 6.4, -82.8);
  ctx.quadraticCurveTo(-1, -81.8, -6.5, -77.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#efe6d2"; ctx.lineWidth = 1.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-8.2, -81); ctx.lineTo(-6.2, -77); ctx.stroke();
  // 弓（前にかまえる）／太刀（それ以外の技）
  if (bow){
    ctx.strokeStyle = "#8a6a3a"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(16, -50, 20, -1.15, 1.15); ctx.stroke();
    ctx.strokeStyle = "#efe6d2"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(24, -68); ctx.lineTo(10, -50); ctx.lineTo(24, -32); ctx.stroke();
  } else if (f.atkName || f.spKind === "rise" || f.spKind === "spin" || dashing){
    ctx.save();
    ctx.translate(16, -48);

    ctx.strokeStyle = "#dfeaf7"; ctx.lineWidth = 3; ctx.lineCap = "round";
