}

// --- ばつりん（異世界編 batsuRealBody の移植）＝まるりんの「うら」---
function drawBatsurin(f){
  const sc = f.h / 59;                  // 元の絵は だいたい 59 の 高さ
  const hurt = f.hurtFlash > 0 && Math.floor(f.hurtFlash/4) % 2 === 0;
  const rolling = f.spKind === "dash" && f.spDef && f.spT > f.spDef.wind;
  ctx.save();
  ctx.scale(sc, sc);
  ctx.translate(0, -27);
  if (rolling){
    // まるまった すがた（ころがる中）
    ctx.fillStyle = hurt ? "#ffffff" : "#c9c3d8";
    ctx.beginPath(); ctx.arc(0, 6, 25, 0, 7); ctx.fill();
    ctx.fillStyle = hurt ? "#ffffff" : "#e4e0ee";
    ctx.beginPath(); ctx.arc(3, 9, 15, 0, 7); ctx.fill();
    ctx.strokeStyle = "#7b7392"; ctx.lineWidth = 1.4;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(-19, -5); ctx.lineTo(-8, 1); ctx.lineTo(-16, 10); ctx.lineTo(-4, 17);
    ctx.stroke();
    // ★ばつ印（ころがって いる ときも 見える。異世界編の drawBatsuBall と 同じ）
    ctx.save();
    ctx.translate(9, -6); ctx.rotate(0.15);
    ctx.strokeStyle = "#a33c58"; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(-4.6, -4.6); ctx.lineTo(4.6, 4.6);
    ctx.moveTo(4.6, -4.6); ctx.lineTo(-4.6, 4.6);
    ctx.stroke();
    ctx.restore();
    ctx.restore(); return;
  }
  // からだ（耳・足・胴を まとめて ひとつの かたちに）
  ctx.beginPath();
  const el2 = (x, y, rx, ry, rot) => {
    ctx.moveTo(x + rx * Math.cos(rot), y + rx * Math.sin(rot));
    ctx.ellipse(x, y, rx, ry, rot, 0, 7);
  };
  el2(-8, 20.5, 8, 6.4, 0);
  el2(9.5, 20.5, 8, 6.4, 0);
  el2(-13, -23, 6.6, 9, -0.32);
  el2(13, -23, 6.6, 9, 0.32);
  el2(0, 0, 22.5, 25.5, 0);
  el2(11, 3, 12, 13, 0);
  ctx.fillStyle = hurt ? "#ffffff" : "#c9c3d8"; ctx.fill();
  ctx.fillStyle = hurt ? "#ffffff" : "#e4e0ee";
  ctx.beginPath(); ctx.ellipse(4, 5, 13, 14, 0, 0, 7); ctx.fill();
  ctx.fillStyle = hurt ? "#f2f2f8" : "#b3aac6";
  ctx.beginPath(); ctx.ellipse(-13, -22, 3.2, 4.6, -0.32, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -22, 3.2, 4.6, 0.32, 0, 7); ctx.fill();
  // ひび（みみの つけねから 足もとまで）
  ctx.strokeStyle = "#7b7392"; ctx.lineWidth = 1.2;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(-11, -23);
  ctx.lineTo(-17, -13); ctx.lineTo(-10, -4); ctx.lineTo(-17, 5);
  ctx.lineTo(-9, 13); ctx.lineTo(-12, 22);
  ctx.moveTo(-10, -4); ctx.lineTo(-1, -1); ctx.lineTo(3, 8);
  ctx.moveTo(-17, 5); ctx.lineTo(-22, 2);
  ctx.moveTo(-5, -21); ctx.lineTo(-9, -14); ctx.lineTo(-4, -8);
  ctx.stroke();
  // 左目＝とじた まま
  ctx.strokeStyle = "#4a4560"; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-3.4, -6); ctx.quadraticCurveTo(2, -2.4, 7, -6); ctx.stroke();
  // 右目＝まるりんと 同じ
  const dizzy = f.stun > 0;
  if (dizzy){
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(14, -6, 5.4, 0, 7); ctx.fill();
    ctx.strokeStyle = "#4a4560"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i <= 22; i++){
      const a = i * 0.52, rr = i * 0.235;
      const xx = 14 + Math.cos(a) * rr, yy = -6 + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
    }
    ctx.stroke();
  } else {
    ctx.fillStyle = "#4fb4ea";
    ctx.beginPath(); ctx.arc(14, -6, 5.4, 0, 7); ctx.fill();
    ctx.fillStyle = "#15151a";
    ctx.beginPath(); ctx.arc(14, -6, 4.1, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(15.2, -7.4, 1.5, 0, 7); ctx.fill();
  }
  // はなと まっすぐな 口
  ctx.fillStyle = "#4a4560";
  ctx.beginPath(); ctx.ellipse(9, 2, 5.0, 4.2, 0, 0, 7); ctx.fill();
  const mouth = (f.spKind === "proj" && f.spT < 12) ? 0.45 : 0;
  if (mouth > 0.02){
    // 口を あける（たね）。前歯が 見える＝異世界編と 同じ 出しかた
    const mh = 2.5 + mouth * 8, mw = 5 + mouth * 7, my = 8 + mouth * 2;
    ctx.fillStyle = "#3a2130";
    ctx.beginPath(); ctx.ellipse(10.5, my, mw, mh, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffffff";
    const th = 3 + mouth * 2.6;
    ctx.fillRect(7.2, my - mh, 3.6, th);
    ctx.fillRect(11.6, my - mh, 3.6, th);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.fillRect(7.6, my + mh - th * 0.6, 7.4, th * 0.6);
  } else {
    // 「おこって いるのか かなしいのか 分からない」少し しなった 口（原作どおり）
    ctx.strokeStyle = "#4a4560"; ctx.lineWidth = 1.7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(4, 9); ctx.quadraticCurveTo(9, 7.4, 15, 8.6); ctx.stroke();
  }
  // ★ばつ印（左の こめかみ）＝ばつりんの いちばんの 目じるし。
  //   移植したとき 入れわすれて いて、ユーザーに「×マークが ない」と 指摘された。
  //   異世界編 `batsuRealBody` と 同じ 位置・角度・色。
  ctx.save();
  ctx.translate(-12, -9); ctx.rotate(0.15);
  ctx.strokeStyle = "#a33c58"; ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(-4.2, -4.2); ctx.lineTo(4.2, 4.2);
  ctx.moveTo(4.2, -4.2); ctx.lineTo(-4.2, 4.2);
  ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// --- 大まどうし ゲドルフ（異世界編ステージ2のボス）---
function drawGedorufu(f){
  const W2 = f.w, H2 = f.h;
  const flash = f.hurtFlash > 0 && Math.floor(f.hurtFlash/3) % 2 === 0;
  const robe  = flash ? "#c9a6e8" : "#4b3a7a";
  const robeD = flash ? "#b48fd8" : "#382a5e";
  const cast  = f.spKind === "proj" || f.spKind === "pillar";

  // 影
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath(); ctx.ellipse(0, 2, W2*0.55, 7, 0, 0, 7); ctx.fill();

  // ローブ（すそが 広がった 三角）
  ctx.fillStyle = robe;
  ctx.beginPath();
  ctx.moveTo(-W2*0.20, -H2*0.72);
  ctx.lineTo( W2*0.20, -H2*0.72);
  ctx.lineTo( W2*0.58, 0);
  ctx.lineTo(-W2*0.58, 0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = robeD;
  ctx.beginPath();
  ctx.moveTo(-4, -H2*0.72); ctx.lineTo(4, -H2*0.72); ctx.lineTo(10, 0); ctx.lineTo(-10, 0);
  ctx.closePath(); ctx.fill();
  // ★金の ふちどり（異世界編 drawWizardBoss の #d8b955）＝移植で 抜けていた
  ctx.strokeStyle = "#d8b955"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-4, -H2*0.72); ctx.lineTo(-10, 0);
  ctx.moveTo( 4, -H2*0.72); ctx.lineTo( 10, 0);
  ctx.stroke();

  // つえ（先の玉が 技のときに 光る）
  ctx.save();
  ctx.translate(W2*0.44, -H2*0.34); ctx.rotate(0.12);
  ctx.strokeStyle = "#6b4a2f"; ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(0, -30); ctx.stroke();
  const glow = cast ? 8 + Math.sin(f.spT*0.6)*2.5 : 5;
  ctx.fillStyle = cast ? "#ffe27a" : "#7fd6ff";
  ctx.beginPath(); ctx.arc(0, -33, glow, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.beginPath(); ctx.arc(-2, -35, glow*0.35, 0, 7); ctx.fill();
  ctx.restore();

  // 手（技のときは 前に出す）
  ctx.fillStyle = robeD;
  ctx.beginPath(); ctx.ellipse(-W2*0.34, -H2*0.42, 7, 8, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( W2*0.30 + (cast?10:0), -H2*0.46, 7, 8, 0, 0, 7); ctx.fill();

  // 顔（ローブのフードの 中は くらい）
  const hy = -H2*0.80;
  ctx.fillStyle = "#efe0c8";
  ctx.beginPath(); ctx.ellipse(0, hy, W2*0.30, W2*0.30, 0, 0, 7); ctx.fill();
  // 目（光る）
  ctx.fillStyle = flash ? "#ff6b6b" : "#3aa0e8";
  ctx.beginPath(); ctx.ellipse(-W2*0.12, hy - 1, 3.2, 3.6, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( W2*0.12, hy - 1, 3.2, 3.6, 0, 0, 7); ctx.fill();
  // まゆ（きりっと）
  ctx.strokeStyle = "#cfcfd8"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-W2*0.22, hy - 7); ctx.lineTo(-W2*0.04, hy - 4);
  ctx.moveTo( W2*0.22, hy - 7); ctx.lineTo( W2*0.04, hy - 4);
  ctx.stroke();
  // ながい 白ひげ
  ctx.fillStyle = "#eef0f5";
  ctx.beginPath();
  ctx.moveTo(-W2*0.22, hy + 5);
  ctx.quadraticCurveTo(0, hy + 12, W2*0.22, hy + 5);
  ctx.quadraticCurveTo(W2*0.14, hy + 34, 0, hy + 40);
  ctx.quadraticCurveTo(-W2*0.14, hy + 34, -W2*0.22, hy + 5);
  ctx.closePath(); ctx.fill();

  // とんがりぼうし
  ctx.fillStyle = robe;
  ctx.beginPath();
  ctx.moveTo(-W2*0.40, hy - W2*0.22);
  ctx.quadraticCurveTo(-W2*0.16, hy - H2*0.52, W2*0.30, hy - H2*0.42);
  ctx.quadraticCurveTo(W2*0.16, hy - W2*0.20, W2*0.40, hy - W2*0.22);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ffd54a";
  ctx.fillRect(-W2*0.42, hy - W2*0.26, W2*0.84, 5);
  // ★ほしの かざり＝まるい 点では なく 5とがりの 星（異世界編 #ffd85e と 同じ）
  ctx.fillStyle = "#ffd85e";
  const sx = W2*0.28, sy = hy - H2*0.40;
  ctx.beginPath();
  for (let i = 0; i < 5; i++){
    const a = -Math.PI/2 + i * 1.257;
    ctx.lineTo(sx + Math.cos(a) * 6, sy + Math.sin(a) * 6);
    ctx.lineTo(sx + Math.cos(a + 0.628) * 2.6, sy + Math.sin(a + 0.628) * 2.6);
  }
  ctx.closePath(); ctx.fill();
}

// --- ザガット（世界編 drawZagat の移植）---
function drawZagat(f){
  const W2 = f.w, H2 = f.h * 0.88;      // 頭が h より上に出る絵なので すこし縮めて 背丈を合わせる
  const flash = f.hurtFlash > 0 && Math.floor(f.hurtFlash/4) % 2 === 0;
  const skin  = flash ? "#ffdcb4" : "#e2a064";   // 日焼けした肌
  const skinD = "#c07c44";
  const wrap  = "#f2efe6";                        // 白いテープ（拳・足首）
  const shooting  = f.spKind === "proj";
  const shotLow   = shooting && f.spSlot === "down";   // グランドアイガーショット
  const upper     = f.spKind === "rise";
  const knee      = f.spKind === "dash";               // アイガーニー＝とびひざ
  ctx.save();
  if (shotLow) ctx.scale(1.08, 0.78);             // 下段は 低くしゃがむ
  if (knee) ctx.rotate(-0.22);                    // とびひざ＝前のめりに とびこむ

  // 影
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath(); ctx.ellipse(0, 2, W2*0.62, 7, 0, 0, 7); ctx.fill();
  if (knee){
    // ★アイガーニー＝ヒザは トランクスより 手前に 描く（下に 描くと かくれる）。
    //   ここでは うしろ足だけ。まえヒザは トランクスの あとで。
    ctx.strokeStyle = skin; ctx.lineWidth = W2*0.28; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(-W2*0.1, -H2*0.4); ctx.lineTo(-W2*0.36, -H2*0.26); ctx.lineTo(-W2*0.54, -H2*0.4);
    ctx.stroke();
    ctx.fillStyle = skinD;
    ctx.beginPath(); ctx.ellipse(-W2*0.56, -H2*0.42, W2*0.16, 5, -0.5, 0, 7); ctx.fill();
  } else {
  // 脚（太もも→ふくらはぎ）
  ctx.fillStyle = skin;
  roundRect(-W2*0.37, -H2*0.34, W2*0.3, H2*0.34, 6); ctx.fill();
  roundRect(W2*0.07, -H2*0.34, W2*0.3, H2*0.34, 6); ctx.fill();
  // 足首の白テープ
  ctx.fillStyle = wrap;
  ctx.fillRect(-W2*0.37, -H2*0.11, W2*0.3, H2*0.06);
  ctx.fillRect(W2*0.07, -H2*0.11, W2*0.3, H2*0.06);
  // 足
  ctx.fillStyle = skinD;
  ctx.beginPath(); ctx.ellipse(-W2*0.2, -2, W2*0.18, 5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(W2*0.24, -2, W2*0.18, 5, 0, 0, 7); ctx.fill();
  }
  // 青いトランクス（赤サイドライン＋白ベルト）
  ctx.fillStyle = "#2a4fb5";
  roundRect(-W2*0.45, -H2*0.53, W2*0.9, H2*0.26, 7); ctx.fill();
  ctx.fillStyle = skin;                 // 股の切れ込み
  ctx.beginPath(); ctx.moveTo(-W2*0.07, -H2*0.27); ctx.lineTo(0, -H2*0.42); ctx.lineTo(W2*0.07, -H2*0.27); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#d62c2c";            // 赤サイドライン
  ctx.fillRect(-W2*0.45, -H2*0.53, W2*0.08, H2*0.26);
  ctx.fillRect(W2*0.37, -H2*0.53, W2*0.08, H2*0.26);
  ctx.fillStyle = wrap;                 // 白ベルト
  ctx.fillRect(-W2*0.45, -H2*0.53, W2*0.9, H2*0.05);
  ctx.fillStyle = "#cfcabb"; ctx.fillRect(-W2*0.07, -H2*0.525, W2*0.14, H2*0.035);  // バックル

  // まえヒザ（アイガーニー）＝トランクスの 手前に 高く かかげる
  if (knee){
    ctx.strokeStyle = skin; ctx.lineWidth = W2*0.28; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(W2*0.06, -H2*0.36); ctx.lineTo(W2*0.5, -H2*0.52); ctx.lineTo(W2*0.3, -H2*0.16);
    ctx.stroke();
    ctx.fillStyle = skinD;                                    // つまさき
    ctx.beginPath(); ctx.ellipse(W2*0.3, -H2*0.13, W2*0.15, 5, 0.4, 0, 7); ctx.fill();
    ctx.fillStyle = wrap;                                     // ヒザの 白テープ
    ctx.beginPath(); ctx.ellipse(W2*0.5, -H2*0.52, W2*0.2, W2*0.17, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "#cfcabb"; ctx.lineWidth = 1.4;
    for (let k = -1; k <= 1; k++){
      ctx.beginPath();
      ctx.moveTo(W2*0.4, -H2*0.52 + k*4); ctx.lineTo(W2*0.6, -H2*0.52 + k*4); ctx.stroke();
    }
    ctx.fillStyle = "rgba(255,220,120,0.5)";                  // ヒザの 光
    ctx.beginPath(); ctx.arc(W2*0.62, -H2*0.54, 9, 0, 7); ctx.fill();
  }

  // 胴（広い肩・逆三角の筋肉質）
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.moveTo(-W2*0.4, -H2*0.5);
  ctx.lineTo(W2*0.4, -H2*0.5);
  ctx.lineTo(W2*0.52, -H2*0.82);
  ctx.quadraticCurveTo(W2*0.42, -H2*0.9, W2*0.22, -H2*0.88);
  ctx.lineTo(-W2*0.22, -H2*0.88);
  ctx.quadraticCurveTo(-W2*0.42, -H2*0.9, -W2*0.52, -H2*0.82);
  ctx.closePath(); ctx.fill();
  // 胸筋・腹筋
  ctx.strokeStyle = skinD; ctx.lineWidth = 1.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -H2*0.52); ctx.lineTo(0, -H2*0.8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-W2*0.28, -H2*0.72); ctx.lineTo(W2*0.28, -H2*0.72); ctx.stroke();
  for (let i = 1; i <= 2; i++){ const yy = -H2*(0.52 + i*0.055); ctx.beginPath(); ctx.moveTo(-W2*0.15, yy); ctx.lineTo(W2*0.15, yy); ctx.stroke(); }
  // 胸の大きな傷跡
  ctx.strokeStyle = "#a85a3a"; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(-W2*0.28, -H2*0.82); ctx.lineTo(W2*0.22, -H2*0.55); ctx.stroke();

  // 拳（白いテープ）
  const fist = (fx, fy) => {
    ctx.fillStyle = wrap;
    ctx.beginPath(); ctx.arc(fx, fy, W2*0.17, 0, 7); ctx.fill();
    ctx.strokeStyle = "#cfcabb"; ctx.lineWidth = 1.4;
    for (let k = -1; k <= 1; k++){ ctx.beginPath(); ctx.moveTo(fx - W2*0.09, fy + k*3.4); ctx.lineTo(fx + W2*0.09, fy + k*3.4); ctx.stroke(); }
  };
  // 腕は 肌色の太いストローク。先端に 白い拳を置く
  ctx.strokeStyle = skin; ctx.lineWidth = W2*0.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (upper){
    // アイガーアッパーカット：前腕を まっすぐ上へ 突き上げる
    ctx.beginPath(); ctx.moveTo(-W2*0.4, -H2*0.8); ctx.lineTo(-W2*0.3, -H2*0.56); ctx.lineTo(-W2*0.08, -H2*0.66); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W2*0.34, -H2*0.82); ctx.lineTo(W2*0.3, -H2*1.02); ctx.lineTo(W2*0.27, -H2*1.2); ctx.stroke();
    fist(-W2*0.08, -H2*0.66);
    fist(W2*0.27, -H2*1.24);
    ctx.fillStyle = "#fff2b0"; ctx.beginPath(); ctx.arc(W2*0.27, -H2*1.38, 9, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffd34d"; ctx.beginPath(); ctx.arc(W2*0.27, -H2*1.38, 4, 0, 7); ctx.fill();
  } else if (shooting){
    // アイガーショット：前腕を まっすぐ前へ 伸ばして撃つ
    const fy = shotLow ? -H2*0.34 : -H2*0.66;
    ctx.beginPath(); ctx.moveTo(-W2*0.4, -H2*0.82); ctx.lineTo(-W2*0.3, -H2*0.58); ctx.lineTo(-W2*0.08, -H2*0.72); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W2*0.26, -H2*0.8); ctx.lineTo(W2*0.5, fy - H2*0.03); ctx.lineTo(W2*0.76, fy); ctx.stroke();
    fist(-W2*0.08, -H2*0.72);
    fist(W2*0.76, fy);
    ctx.fillStyle = "#ffd8a0"; ctx.beginPath(); ctx.arc(W2*0.94, fy, 8, 0, 7); ctx.fill();
    ctx.fillStyle = "#ff9a3c"; ctx.beginPath(); ctx.arc(W2*0.94, fy, 4.5, 0, 7); ctx.fill();
  } else {
    // 構え：両腕を曲げて こぶしを 胸の前に
    ctx.beginPath(); ctx.moveTo(-W2*0.4, -H2*0.82); ctx.lineTo(-W2*0.34, -H2*0.58); ctx.lineTo(-W2*0.06, -H2*0.72); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W2*0.4, -H2*0.82); ctx.lineTo(W2*0.46, -H2*0.58); ctx.lineTo(W2*0.18, -H2*0.78); ctx.stroke();
    fist(-W2*0.06, -H2*0.72);
    fist(W2*0.18, -H2*0.78);
  }

  // 首
  ctx.fillStyle = skin; ctx.fillRect(-W2*0.13, -H2*0.92, W2*0.26, H2*0.1);
  // つるつる頭
  ctx.beginPath(); ctx.arc(0, -H2*1.0, W2*0.31, 0, 7); ctx.fill();
  // 耳
  ctx.beginPath(); ctx.arc(-W2*0.29, -H2*1.0, 4, 0, 7); ctx.arc(W2*0.29, -H2*1.0, 4, 0, 7); ctx.fill();
  // 怒り眉（前の目）
  ctx.strokeStyle = "#3a2418"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-W2*0.02, -H2*1.07); ctx.lineTo(W2*0.2, -H2*1.01); ctx.stroke();
  // 前の目
  ctx.fillStyle = "#3a2418"; ctx.beginPath(); ctx.arc(W2*0.13, -H2*0.99, 2.7, 0, 7); ctx.fill();
  // 眼帯（奥の目＋ストラップ）
  ctx.strokeStyle = "#242424"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-W2*0.3, -H2*1.11); ctx.lineTo(-W2*0.02, -H2*0.96); ctx.stroke();
  ctx.fillStyle = "#1c1c1c";
  ctx.beginPath(); ctx.ellipse(-W2*0.13, -H2*1.02, 6, 4.6, -0.3, 0, 7); ctx.fill();
  // への字口
  ctx.strokeStyle = "#7a4a2a"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W2*0.03, -H2*0.9); ctx.lineTo(W2*0.19, -H2*0.9); ctx.stroke();
  ctx.restore();
}


// ============================================================
//  キャラを 出す（絵は 上の 移植ぶんを そのまま つかう）
// ============================================================
function makeActor(key, face){
  const ch = CHARS[key] || CHARS.maru;
  return { ch, w:ch.w, h:ch.h, face, hurtFlash:0, animT:0, vx:0, onGround:true,
           atkName:null, spKind:null, spDef:null, spT:0, squash:1, stun:0, shield:false,
           // ↓ここから下は ビートバトル用
           poseT:0, poseLane:1, bob:0, sweat:0 };
}

// キャラの 絵は 当たり判定(ch.h)より 上に はみ出す ことが 多い（兜・つの・大がま）。
// 実さいに 描いた はんいを 一度だけ 測って おき、はみ出さないように 入れる。
// （大乱闘の artBox と 同じ。測る キャンバスは 大きめに とること）
const artBoxCache = Object.create(null);
function artBox(key){
  if (artBoxCache[key]) return artBoxCache[key];
  const ch = CHARS[key];
  const S = 3;
  const w = Math.ceil(ch.w * S * 5), h = Math.ceil(ch.h * S * 3.4);
  const t = document.createElement("canvas"); t.width = w; t.height = h;
  const c = t.getContext("2d");
  const footY = h * 0.75;
  const old = ctx;
  try {
    ctx = c;
    c.save(); c.translate(w/2, footY); c.scale(S, S);
    drawCharBoth(makeActor(key, 1));      // ペギ＆にせペギの 2人ぶんも 入れて 測る
    c.restore();
  } catch(e){ } finally { ctx = old; }
  let x0 = w, y0 = h, x1 = 0, y1 = 0, found = false;
  try {
    const d = c.getImageData(0, 0, w, h).data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      if (d[(y*w + x)*4 + 3] > 10){
        found = true;
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  } catch(e){}
  const box = found
    ? { w:(x1-x0+1)/S, h:(y1-y0+1)/S, cx:((x0+x1)/2 - w/2)/S, cy:((y0+y1)/2 - footY)/S }
    : { w:ch.w, h:ch.h, cx:0, cy:-ch.h/2 };
  artBoxCache[key] = box;
  return box;
}

// ★ペギ＆にせペギ は 2人セット。1人ぶんの 絵しか ない ので ここで 2人 ならべる
function drawCharBoth(a){
  if (a.ch.key === "penguins"){
    ctx.save(); ctx.translate(-a.w * 0.42, 0); ctx.scale(0.92, 0.92);
    drawPenguin({ w:a.w, h:a.h, hurtFlash:0 }, true); ctx.restore();
  }
  drawChar(a);
}

const POSE_T = 15;                    // ノーツを たたいた ポーズが つづく フレーム数
// ★キャラは 「実さいに 描いた はんい(artBox)」に あわせて 入れる。
//   ch.h（当たり判定の 高さ）で 縮めると、まるりんの ように 原点より 下にも
//   描く キャラが 画面の 下に はみ出して 足が 切れる（1回 これで 切れた）。
//   cx=まん中の x／botY=絵の 下の はし（ゆか）／tall=高さの 上げんど／maxW=よこ幅の 上げんど
//   ★「上の はし」で 合わせては いけない。よこ幅で 縮んだ ときに 下が 浮いて、
//     足もとの かげと 体が はなれる（1回 これで 浮いた）。かならず 下で そろえる。
function drawActor(a, cx, botY, tall, maxW){
  const ch = a.ch;
  const box = artBox(ch.key);
  const sc = Math.min(tall / box.h, (maxW || 240) / box.w);
  const x = cx - box.cx * sc * a.face;
  const footY = botY - (box.cy + box.h / 2) * sc;
  const p  = a.poseT > 0 ? a.poseT / POSE_T : 0;    // 1 → 0
  const e  = p * p;                                  // おわりを なめらかに
  let dx = 0, dy = 0, rot = 0, sq = 1;
  if (a.poseLane === 0){ dx = -15 * e; rot = -0.17 * e; }
  if (a.poseLane === 1){ dy =  13 * e; sq  = 1 - 0.17 * e; }
  if (a.poseLane === 2){ dy = -17 * e; sq  = 1 + 0.13 * e; }
  if (a.poseLane === 3){ dx =  15 * e; rot =  0.17 * e; }
  // 拍に あわせて ぴょこぴょこ する
  const b = a.bob;
  dy += 7 * b; sq *= 1 - 0.09 * b;

  ctx.save();
  ctx.translate(x + dx * a.face, footY + dy);
  ctx.scale(sc, sc);
  if (rot) ctx.rotate(rot * a.face);
  ctx.scale(a.face, 1);
  ctx.scale(1 + (1 - sq) * 0.45, sq);
  a.animT = frame;
  drawCharBoth(a);
  ctx.restore();
}

// ゲージの はしに 出す まるい 顔アイコン。
// ★これが ないと 体力が 満タンの とき ゲージが 一色に なって、
//   ただの おびに 見える（オーナーに「ライフゲージが なくなった」と 言われた）。
function drawBadge(a, cx, cy, r, ring){
  const box = artBox(a.ch.key);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip();
  ctx.fillStyle = "rgba(20,12,40,0.9)"; ctx.fillRect(cx-r, cy-r, r*2, r*2);
  const sc = Math.min((r * 2.05) / box.h, (r * 2.05) / box.w);
  ctx.translate(cx - box.cx * sc, cy - box.cy * sc);
  ctx.scale(sc, sc);
  drawCharBoth(a);
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7);
  ctx.lineWidth = 3.4; ctx.strokeStyle = ring; ctx.stroke();
}

function poseActor(a, lane){ a.poseT = POSE_T; a.poseLane = lane; }
function stepActor(a){ if (a.poseT > 0) a.poseT--; a.bob *= 0.80; }

// 小さな 顔アイコン（曲えらびの 一覧用）
function drawFace(cv2, key){
  const ch = CHARS[key]; if (!ch) return;
  const r = cv2.getBoundingClientRect();
  const dw = Math.max(30, Math.round(r.width)), dh = Math.max(30, Math.round(r.height));
  if (cv2.width !== dw*2 || cv2.height !== dh*2){ cv2.width = dw*2; cv2.height = dh*2; }
  const c = cv2.getContext("2d");
  c.clearRect(0, 0, cv2.width, cv2.height);
  const old = ctx;
  try {
    ctx = c;
    const box = artBox(key);
    const sc = Math.min((cv2.height * 0.92) / box.h, (cv2.width * 0.92) / box.w);
    c.save();
    c.translate(cv2.width/2 - box.cx * sc, cv2.height/2 - box.cy * sc);
    c.scale(sc, sc);
    drawCharBoth(makeActor(key, 1));
    c.restore();
  } catch(e){} finally { ctx = old; }
}

// ============================================================
//  ゲームの 状態
// ============================================================
let state = "menu";        // menu | songsel | play | result
let song = null;           // いま えらんでいる 曲
let diff = "normal";
let notes = [];            // {t, lane, who, hit, dead}
let spawnI = 0;
let pre = 0;               // 曲が はじまる までの カウントダウン（秒）
let me = null, foe = null; // キャラ
let hp = 50;
let score = 0, combo = 0, maxCombo = 0, counts = null, myTotal = 0, myDone = 0;
let judgePop = null;       // {name, col, t}
let hitFx = [];            // やじるしの ひかり
let shake = 0, flashT = 0;
let result = null;
let laneLit = [0,0,0,0];       // 自分の 受け皿の ひかり
let foeLit  = [0,0,0,0];
let laneHeld= [false,false,false,false];
let endT = 0;              // 曲が おわってからの 待ち
let failed = false;

function approachSec(){
  const d = DIFFS.find(d => d.id === diff) || DIFFS[1];
  // むずかしい ほど 速く 落とす（そのほうが 一つ一つが はなれて 読みやすい）
  const base = d.id === "easy" ? 1.00 : d.id === "normal" ? 0.85
             : d.id === "hard" ? 0.72 : d.id === "extreme" ? 0.60 : 0.52;
  return base / Math.max(0.5, Math.min(2.0, cfg.speed));
}

function startSong(s, d){
  song = s; diff = d;
  const chart = (s.charts && s.charts[d]) || [];
  notes = chart.map(n => ({ t:n[0]/1000, lane:n[1], who:n[2], hit:false, dead:false }));
  notes.sort((a,b) => a.t - b.t);
  spawnI = 0;
  myTotal = notes.filter(n => n.who === 0).length;
  myDone = 0;
  hp = 50; score = 0; combo = 0; maxCombo = 0; failed = false; endT = 0;
  counts = { perfect:0, great:0, good:0, near:0, miss:0 };
  judgePop = null; hitFx = []; shake = 0; flashT = 0;
  laneLit = [0,0,0,0]; foeLit = [0,0,0,0]; laneHeld = [false,false,false,false];
  heldPointers.clear(); for (let i = 0; i < 4; i++) laneFingers[i] = 0;
  me  = makeActor(cfg.me, -1);        // 右がわ＝左を むく
  foe = makeActor(s.foe, 1);          // 左がわ＝右を むく
  pre = 2.4;                          // 3・2・1 の カウントダウン
  resetClock();
  if (music){ try { music.pause(); } catch(e){} }
  music = new Audio("audio/" + s.id + ".mp3");
  music.preload = "auto";
  music.volume = 0.55;
  music.load();
  audioCtx();
  // ★iPad・iPhone は 「指で さわった その ながれ」の 中で play() しないと 音を 出さない。
  //   ほんとうに 鳴らすのは カウントダウンの あと（＝指から はなれた あと）なので、
  //   ここで 一度 鳴らして すぐ 止め、その 曲を 「さわり ずみ」に して おく。
  //   これを 入れないと iPad で むおんの まま ノーツだけ 落ちてくる。
  try {
    const p0 = music.play();
    const unlocked = music;
    if (p0 && p0.then) p0.then(() => {
      // ★カウントダウンが もう おわって いたら 止めない（止めると 本番の 音が 消える）
      if (music === unlocked && pre > 0){ try { music.pause(); music.currentTime = 0; } catch(e){} }
    }).catch(()=>{});
  } catch(e){}
  state = "play";
  overlayEl.classList.add("hide");
  document.body.classList.add("playing");
}

function stopSong(){
  if (music){ try { music.pause(); } catch(e){} }
  document.body.classList.remove("playing");
}

// ★曲の 時計。カウントダウン中は マイナスの 時間を 返す（ノーツは もう 落ちてくる）。
//   ズレ調整(cfg.offset ミリ秒)は ここで 足す。＋にすると ノーツが 遅く 来る。
let testT = null;      // テストの ときだけ 使う にせの 時計（__beat.setT）
function nowT(){
  if (testT !== null) return testT;
  if (pre > 0) return -pre;
  return songTime() - cfg.offset / 1000;
}
let AUTO = false;      // オート（自分の ノーツも かってに 当たる）
let AUTO_LAG = 0;      // オートを わざと ずらす（判定の テスト用・秒）

// ============================================================
//  たたく
// ============================================================
function pressLane(lane){
  if (state !== "play") return;
  if (laneHeld[lane]) return;
  laneHeld[lane] = true;
  laneLit[lane] = 8;
  const t = nowT();
  // その レーンで いちばん 近い、まだ 叩いてない 自分の ノーツ
  let target = null, bestDt = 1e9;
  for (const n of notes){
    if (n.who !== 0 || n.hit || n.dead || n.lane !== lane) continue;
    const dt = Math.abs(n.t - t);
    if (n.t - t > MISS_MS / 1000) break;      // まだ ずっと 先
    if (dt < bestDt){ bestDt = dt; target = n; }
  }
  if (!target || bestDt > MISS_MS / 1000){
    // 空うち＝ペナルティ なし（子どもが 遊べなく なる ので）
    return;
  }
  const ms = bestDt * 1000;
  let j = JUDGE[JUDGE.length - 1];
  for (const k of JUDGE) if (ms <= k.ms){ j = k; break; }
  target.hit = true; myDone++;
  score += j.score;
  combo++; if (combo > maxCombo) maxCombo = combo;
  hp = Math.max(0, Math.min(100, hp + j.hp));
  const key = j.name === "パーフェクト" ? "perfect" : j.name === "グレート" ? "great"
            : j.name === "グッド" ? "good" : "near";
  counts[key]++;
  judgePop = { name:j.name, col:j.col, t:26 };
  hitFx.push({ x:LANE_X[lane], y:HIT_Y, t:16, col:LANE_COL[lane] });
  poseActor(me, lane);
  me.bob = 1;
  se("hit");
}
function releaseLane(lane){ laneHeld[lane] = false; }

function missNote(n){
  n.dead = true;
  if (n.who === 0){
    myDone++;
    counts.miss++;
    combo = 0;
    hp = Math.max(0, hp - (diff === "easy" ? 2.6 : diff === "normal" ? 3.4
                         : diff === "hard" ? 4.2 : diff === "extreme" ? 4.6 : 3.6));
    judgePop = { name:"ミス", col:"#ff8f9c", t:26 };
    shake = 7;
    se("miss");
  }
}

// ============================================================
//  1コマ すすめる
// ============================================================
function update(){
  frame++;
  if (shake > 0) shake *= 0.82;
  if (flashT > 0) flashT--;
  if (judgePop && judgePop.t > 0) judgePop.t--;
  for (let i = 0; i < 4; i++){ if (laneLit[i] > 0) laneLit[i]--; if (foeLit[i] > 0) foeLit[i]--; }
  for (let i = hitFx.length - 1; i >= 0; i--){ if (--hitFx[i].t <= 0) hitFx.splice(i, 1); }
  if (state !== "play") return;

  if (pre > 0){
    pre -= 1/60;
    if (pre <= 0){
      pre = 0;
      resetClock();
      const p = music.play();
      if (p && p.catch) p.catch(()=>{});
    }
  }
  const t = nowT();
  stepActor(me); stepActor(foe);

  // 拍で ぴょこぴょこ（曲の BPM から）
  if (song && song.bpm > 0){
    const beat = (t - song.offset) / (60 / song.bpm);
    const bi = Math.floor(beat);
    if (bi !== update._lastBeat && bi > update._lastBeat){
      update._lastBeat = bi;
      if (me.poseT <= 0)  me.bob  = Math.max(me.bob, 0.75);
      if (foe.poseT <= 0) foe.bob = Math.max(foe.bob, 0.75);
      flashT = Math.max(flashT, 4);
    }
  }

  for (const n of notes){
    if (n.hit || n.dead) continue;
    if (AUTO && n.who === 0 && t >= n.t + AUTO_LAG){ pressLane(n.lane); releaseLane(n.lane); continue; }
    if (n.who === 1){
      // 相手のノーツ＝自動で 当たる
      if (t >= n.t){
        n.hit = true;
        foeLit[n.lane] = 9;
        poseActor(foe, n.lane); foe.bob = 1;
        hitFx.push({ x:LANE_X[n.lane], y:HIT_Y, t:12, col:"#ff9a5c", small:true });
        hp = Math.max(0, hp - 0.26);
      }
    } else {
      if (t > n.t + MISS_MS / 1000) missNote(n);
    }
  }

  if (hp <= 0 && !failed){
    failed = true;
    finishSong();
    return;
  }
  const done = myDone >= myTotal;
  if ((done || (song && t > song.end + 0.6))){
    endT += 1/60;
    if (endT > 1.1) finishSong();
  }
}
update._lastBeat = -1;

function finishSong(){
  stopSong();
  const maxScore = Math.max(1, myTotal * 350);
  const acc = Math.max(0, Math.min(1, score / maxScore));
  let rank = RANKS[RANKS.length - 1];
  for (const r of RANKS) if (acc >= r.acc){ rank = r; break; }
  const full = counts.miss === 0 && counts.near === 0 && myTotal > 0 && !failed;
  result = { score, acc, rank, full, failed, counts:Object.assign({}, counts),
             maxCombo, total:myTotal };
  const key = song.id + ":" + diff;
  const b = best[key];
  // テスト（にせの 時計）で 出た 点は 記ろくに しない
  if (testT === null && !failed && (!b || score > b.score)){
    best[key] = { score, acc:Math.round(acc*1000)/1000, rank:rank.r, full };
    saveBest();
  }
  state = "result";
  showResult();
}

// ============================================================
function beatPulse(){
  if (!song || !song.bpm) return 0;
  const t = nowT();
  const b = (t - song.offset) / (60 / song.bpm);
  const f = b - Math.floor(b);
  return Math.max(0, 1 - f * 2.2);        // 拍の しゅんかんに 1 → すぐ 0
}

function drawBg(){
  const p = beatPulse();
  const th = song ? song.stage : "void";
  if (th === "station")      bgStation(p);
  else if (th === "ring")    bgRing(p);
  else if (th === "honnouji")bgHonnouji(p);
  else if (th === "neon")    bgNeon(p);
  else                       bgVoid(p);
  // 下は 少し 暗く して ノーツを 見やすく
  // ノーツが 見やすい ように 上下を すこし 暗く する
  const g = ctx.createLinearGradient(0, 0, 0, 220);
  g.addColorStop(0, "rgba(8,4,20,0.55)"); g.addColorStop(1, "rgba(8,4,20,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 220);
  const g2 = ctx.createLinearGradient(0, FLOOR_Y, 0, H);
  g2.addColorStop(0, "rgba(8,4,20,0)"); g2.addColorStop(1, "rgba(8,4,20,0.55)");
  ctx.fillStyle = g2; ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
}

function skyGrad(c1, c2, c3){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, c1); g.addColorStop(0.55, c2); g.addColorStop(1, c3);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function bgNeon(p){                          // ネオ・ハムシティ（マザーAI）

function bgVoid(p){                          // 虚空（妖精・ラスボス）

    ctx.beginPath(); ctx.arc(x, y, 1.2 + (i % 4) * 0.8, 0, 7); ctx.fill();
  }
  ctx.restore();
  const rr = 160 + p * 30;
  const g = ctx.createRadialGradient(W/2, 430, 10, W/2, 430, rr);
  g.addColorStop(0, "rgba(200,150,255,.30)"); g.addColorStop(1, "rgba(200,150,255,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(W/2, 430, rr, 0, 7); ctx.fill();
  const gg = ctx.createLinearGradient(0, FLOOR_Y, 0, H);

  ctx.fillStyle = gg; ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
}

// --- やじるし ------------------------------------------------------
// 上むきの やじるしを 1つ 作って、レーンごとに 回して つかう
function arrowPath(s){
  const a = s * 0.5, b = s * 0.20;
  ctx.beginPath();
  ctx.moveTo(0, -a);
  ctx.lineTo(a, 0);
  ctx.lineTo(b * 1.5, 0);
  ctx.lineTo(b * 1.5, a);
  ctx.lineTo(-b * 1.5, a);
  ctx.lineTo(-b * 1.5, 0);
  ctx.lineTo(-a, 0);
  ctx.closePath();
}
const LANE_ROT = [-Math.PI/2, Math.PI, 0, Math.PI/2];
function drawArrow(cx, cy, s, lane, kind, alpha){
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.translate(cx, cy);
  ctx.rotate(LANE_ROT[lane]);
  arrowPath(s);
  if (kind === "ghost"){
    ctx.fillStyle = "rgba(255,255,255,0.07)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 4; ctx.stroke();
  } else if (kind === "lit"){
    ctx.fillStyle = LANE_COL[lane];
    ctx.shadowColor = LANE_COL[lane]; ctx.shadowBlur = 22;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.stroke();
  } else if (kind === "note"){
    const g = ctx.createLinearGradient(0, -s*0.5, 0, s*0.5);
    g.addColorStop(0, LANE_COL[lane]); g.addColorStop(1, LANE_COL_D[lane]);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3.2; ctx.stroke();
  } else {                                   // 相手のノーツ＝すきとおった オレンジ
    ctx.fillStyle = "rgba(255,150,70,0.45)"; ctx.fill();
    ctx.strokeStyle = "rgba(255,205,140,0.95)"; ctx.lineWidth = 3.0;
    ctx.setLineDash([7, 5]); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawLanes(){
  // レーンの おび（キャラの 手前を 通る ので うすく。こくすると キャラが かすむ）
  const lg = ctx.createLinearGradient(0, 0, 0, HIT_Y + 70);
  lg.addColorStop(0,    "rgba(10,6,26,0.24)");
  lg.addColorStop(0.80, "rgba(10,6,26,0.20)");
  lg.addColorStop(1,    "rgba(10,6,26,0)");
  ctx.fillStyle = lg;
  for (let i = 0; i < LANES; i++)
    ctx.fillRect(LANE_X[i] - LANE_W/2 + 3, 0, LANE_W - 6, HIT_Y + 70);

  // ★受け皿＝下の 丸ボタン。ここが そのまま さわる ボタンに 見える ように する
  for (let i = 0; i < LANES; i++){
    const lit = laneLit[i] > 0, foeL = foeLit[i] > 0;
    const r = RECEPT_R * (lit ? 1.08 : 1);
    ctx.save();
    ctx.translate(LANE_X[i], HIT_Y);
    // そとわく
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7);
    ctx.fillStyle = lit ? LANE_COL[i] : (foeL ? "rgba(255,150,70,0.55)" : "rgba(16,10,32,0.72)");
    if (lit){ ctx.shadowColor = LANE_COL[i]; ctx.shadowBlur = 26; }
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.lineWidth = 5;
    ctx.strokeStyle = lit ? "#fff" : LANE_COL[i];
    ctx.stroke();
    ctx.restore();
    // 中の やじるし
    ctx.save();
    ctx.translate(LANE_X[i], HIT_Y); ctx.rotate(LANE_ROT[i]);
    arrowPath(ARROW * (lit ? 0.80 : 0.74));
    ctx.fillStyle = lit ? "#ffffff" : "rgba(190,196,220,0.92)";
    ctx.fill();
    ctx.lineWidth = 2.4; ctx.strokeStyle = "rgba(20,12,40,0.65)"; ctx.stroke();
    ctx.restore();
  }
}

function drawNotes(){
  const t = nowT(), app = approachSec();
  const top = NOTE_TOP;   // 画面の 上の そとから 落ちてくる
  // 拍の 線（4拍めは こく＝小節の あたま）。リズムが 目でも わかる
  if (song && song.bpm > 0){
    const beat = 60 / song.bpm;
    const b0 = Math.ceil((t - song.offset) / beat);
    ctx.save();
    for (let k = b0; ; k++){
      const bt = song.offset + k * beat;
      const dt = bt - t;
      if (dt > app) break;
      if (dt < 0) continue;
      const y = HIT_Y - (dt / app) * (HIT_Y - top);
      const bar = ((k % 4) + 4) % 4 === 0;
      ctx.strokeStyle = bar ? "rgba(255,255,255,0.20)" : "rgba(255,255,255,0.08)";
      ctx.lineWidth = bar ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(6, y); ctx.lineTo(W - 6, y);
      ctx.stroke();
    }
    ctx.restore();
  }
  for (const n of notes){
    if (n.hit || n.dead) continue;
    const dt = n.t - t;
    if (dt > app || dt < -0.13) continue;
    let y = HIT_Y - (dt / app) * (HIT_Y - top);
    let a = dt > app * 0.86 ? (app - dt) / (app * 0.14) : 1;
    // ★判定ラインを すぎた ノーツは その場で うすくして 消す。
    //   そのまま 落とすと 丸ボタンを 通りこして 画面の 下まで 行き、
    //   「ボタンの 下に ノーツが ある」ように 見えて まぎらわしい。
    if (dt < 0){ y = Math.min(y, HIT_Y + 40); a *= Math.max(0, 1 + dt / 0.13); }
    drawArrow(LANE_X[n.lane], y, ARROW * (n.who === 0 ? 1 : 0.78), n.lane,
              n.who === 0 ? "note" : "foe", Math.max(0, Math.min(1, a)));
  }
  // 当たった ひかり
  for (const f of hitFx){
    const k = f.t / 16;
    ctx.save();
    ctx.globalAlpha = k * 0.85;
    ctx.strokeStyle = f.col; ctx.lineWidth = 4 + (1-k) * 4;
    ctx.beginPath(); ctx.arc(f.x, f.y, (1 - k) * 52 + 14, 0, 7); ctx.stroke();
    ctx.restore();
  }
}

function drawChars(){
  // うしろに やわらかい 光。妖精の ように 黒い キャラが 暗い 背景に 沈む ため
  // ★キャラは 大きく、ゆかに 立たせる。ノーツは この 手前を 通る（本家と 同じ）
  for (const [x, c] of [[118, "255,140,110"], [422, "120,210,255"]]){
    const g = ctx.createRadialGradient(x, 570, 10, x, 570, 185);
    g.addColorStop(0, "rgba(" + c + ",0.22)");
    g.addColorStop(1, "rgba(" + c + ",0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, 570, 185, 0, 7); ctx.fill();
  }
  // 足もとの かげ
  for (const x of [118, 422]){
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.beginPath(); ctx.ellipse(x, FLOOR_Y + 6, 78, 13, 0, 0, 7); ctx.fill();
  }
  // ★大きすぎると 2人が くっついて 背景も 見えなく なる。
  //   よこ幅は 200 まで、あいだに すきまが のこる くらいが ちょうどよい。
  if (foe) drawActor(foe, 118, FLOOR_Y, 290, 200);
  if (me)  drawActor(me,  422, FLOOR_Y, 290, 200);
}

function drawHUD(){
  // ---- いちばん 上：つなひきゲージ（＝ライフ）----
  //   左＝あいて(オレンジ)／右＝じぶん(青)。まん中の しるしが 右に 行くほど まけ。
  const cy = 28, bx = 54, bw = 390, by = 16, bh = 24;
  ctx.fillStyle = "rgba(0,0,0,.5)";
  roundRect(bx - 4, by - 4, bw + 8, bh + 8, 15); ctx.fill();
  const k = Math.max(0, Math.min(1, hp / 100));
  const mx = bx + bw * (1 - k);                 // さかいめ
  ctx.save();
  ctx.beginPath(); roundRect(bx, by, bw, bh, 12); ctx.clip();
  ctx.fillStyle = "#ff6a4d"; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = "#5fd0ff"; ctx.fillRect(mx, by, bw - (mx - bx), bh);
  // まん中の めもり（どちらが かって いるか ひと目で わかる）
  ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bx + bw/2, by); ctx.lineTo(bx + bw/2, by + bh); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
  roundRect(bx, by, bw, bh, 12); ctx.stroke();
  // さかいめの しるし（白だけだと 青の上で 消える ので 黒ぶちを つける）
  ctx.beginPath(); ctx.arc(mx, cy, 8, 0, 7);
  ctx.fillStyle = "#fff"; ctx.fill();
  ctx.lineWidth = 2.6; ctx.strokeStyle = "#241338"; ctx.stroke();

  // りょうはしに 顔（この2人の 取り合い だと ひと目で わかる）
  drawBadge(foe, 28, cy, 21, "#ff6a4d");
  drawBadge(me, bx + bw + 22, cy, 21, "#5fd0ff");

  // やめる（右上）
  ctx.beginPath(); ctx.arc(W - 26, cy, 17, 0, 7);
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.65)"; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.font = "bold 16px system-ui";
  ctx.fillText("✕", W - 26, cy + 6);

  // ---- ふだ（左＝コンボ／右＝スコア／まん中＝曲名）----
  const panel = (x, w, y, h) => {
    ctx.fillStyle = "rgba(255,255,255,.92)";
    roundRect(x, y, w, h, 11); ctx.fill();
    ctx.strokeStyle = "rgba(30,16,56,.55)"; ctx.lineWidth = 2.6;
    roundRect(x, y, w, h, 11); ctx.stroke();
  };
  panel(10, 150, 50, 38);
  panel(W - 160, 150, 50, 38);
  ctx.textAlign = "left";
  ctx.font = "bold 11px system-ui"; ctx.fillStyle = "#7a5bb5";
  ctx.fillText("コンボ", 20, 66);
  ctx.font = "900 21px system-ui"; ctx.fillStyle = combo >= 50 ? "#e07a10" : "#2b1750";
  ctx.fillText(String(combo), 20, 84);
  ctx.textAlign = "right";
  ctx.font = "bold 11px system-ui"; ctx.fillStyle = "#7a5bb5";
  ctx.fillText("スコア", W - 20, 66);
  ctx.font = "900 21px system-ui"; ctx.fillStyle = "#2b1750";
  ctx.fillText(String(score), W - 20, 84);

  ctx.textAlign = "center";
  ctx.font = "bold 14px system-ui"; ctx.fillStyle = "#fff";
  ctx.strokeStyle = "rgba(0,0,0,.65)"; ctx.lineWidth = 4;
  ctx.strokeText(song.title, W/2, 68); ctx.fillText(song.title, W/2, 68);
  const d = DIFFS.find(x => x.id === diff);
  const accNow = myDone > 0 ? Math.round(score / (myDone * 350) * 1000) / 10 : 100;
  ctx.font = "bold 11px system-ui"; ctx.fillStyle = d ? d.col : "#fff";
  ctx.lineWidth = 3;
  const line = (d ? d.name : "") + "　" + accNow.toFixed(1) + "%";
  ctx.strokeText(line, W/2, 84); ctx.fillText(line, W/2, 84);

  // ---- 判定の 文字（ゆかと 丸ボタンの あいだ）----
  if (judgePop && judgePop.t > 0){
    const k2 = judgePop.t / 26;
    ctx.save();
    ctx.globalAlpha = Math.min(1, k2 * 2.2);
    ctx.translate(W/2, 734 - (1 - k2) * 10);
    ctx.scale(1 + (1 - k2) * 0.12, 1 + (1 - k2) * 0.12);
    ctx.font = "900 30px system-ui";
    ctx.strokeStyle = "rgba(0,0,0,.75)"; ctx.lineWidth = 7;
    ctx.strokeText(judgePop.name, 0, 0);
    ctx.fillStyle = judgePop.col; ctx.fillText(judgePop.name, 0, 0);
    ctx.restore();
  }
  // ---- 「きみの ばん！」----
  if (turnPop > 0){
    const k3 = turnPop / 42;
    ctx.save(); ctx.globalAlpha = Math.min(1, k3 * 2.4);
    ctx.font = "900 26px system-ui";
    ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.lineWidth = 7;
    const t2 = turnWho === 0 ? "きみの ばん！" : "あいての ばん";
    ctx.strokeText(t2, W/2, 300); ctx.fillStyle = turnWho === 0 ? "#5fe08a" : "#ff9a5c";
    ctx.fillText(t2, W/2, 300);
    ctx.restore();
  }
}

function drawCountdown(){
  if (pre <= 0) return;
  const n = Math.ceil(pre - 0.4);
  const s = n >= 3 ? "3" : n === 2 ? "2" : n === 1 ? "1" : "スタート！";
  const f = (pre - 0.4) - Math.floor(pre - 0.4);
  ctx.save();
  ctx.textAlign = "center";
  ctx.globalAlpha = 0.5 + 0.5 * f;
  ctx.translate(W/2, 480);
  ctx.scale(1 + (1 - f) * 0.35, 1 + (1 - f) * 0.35);
  ctx.font = "900 64px system-ui";
  ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.lineWidth = 10;
  ctx.strokeText(s, 0, 0);
  ctx.fillStyle = "#ffe14d"; ctx.fillText(s, 0, 0);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 1) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawBg();
  drawChars();
  drawLanes();
  drawNotes();
  if (song && me && foe) drawHUD();
  drawCountdown();
  ctx.restore();
}

// ============================================================
//  「きみの ばん」の 合図
// ============================================================
let turns = [];        // {t, who}
let turnI = 0, turnPop = 0, turnWho = 0;
function buildTurns(){
  turns = []; turnI = 0; turnPop = 0;
  let last = -1;
  for (const n of notes){
    if (n.who !== last){ turns.push({ t:n.t, who:n.who }); last = n.who; }
  }
}
function stepTurns(t){
  if (turnPop > 0) turnPop--;
  while (turnI < turns.length && t >= turns[turnI].t - 0.75){
    turnWho = turns[turnI].who; turnPop = 42; turnI++;
  }
}

// ============================================================
//  入力
// ============================================================
// ★スライド入力（オーナー要望）:
//   ↑を おした 親指を そのまま →に ずらすと →が 鳴る。
//   ゆびが 何本 あっても いい ように、レーンごとに 「今 何本の ゆびが いるか」を
//   かぞえる。0→1 に なった ときだけ たたいた ことに する。
const heldPointers = new Map();       // pointerId → いま いる レーン
const laneFingers = [0, 0, 0, 0];     // レーンごとの ゆびの 数
function laneFromXY(x, y){
  if (y < TOUCH_TOP) return -1;
  return Math.max(0, Math.min(3, Math.floor(x / (W / 4))));
}
// ゆびを レーンに 置きなおす（-1 は はなした）
function movePointer(id, lane){
  const old = heldPointers.get(id);
  if (old === lane) return;
  if (old !== undefined && old >= 0){
    laneFingers[old] = Math.max(0, laneFingers[old] - 1);
    if (laneFingers[old] === 0) releaseLane(old);
  }
  if (lane < 0){ heldPointers.delete(id); return; }
  heldPointers.set(id, lane);
  laneFingers[lane]++;
  pressLane(lane);                    // すでに だれかが 押して いれば 中で 空ぶりする
}
function canvasXY(ev){
  const r = cv.getBoundingClientRect();
  return [ (ev.clientX - r.left) / r.width * W, (ev.clientY - r.top) / r.height * H ];
}
cv.addEventListener("pointerdown", ev => {
  ev.preventDefault();
  audioCtx();
  if (state !== "play") return;
  const [x, y] = canvasXY(ev);
  if (x > W - 46 && y < 52){ quitPlay(); return; }               // ✕（右上）
  const l = laneFromXY(x, y);
  if (l >= 0){
    try { cv.setPointerCapture(ev.pointerId); } catch(e){}
    movePointer(ev.pointerId, l);
  }
}, { passive:false });
// ★ゆびを ずらした とき。いちど 下がわで 押しはじめたら、そのあとは
//   よこの ばしょ(x)だけで レーンを きめる（上に すこし ずれても 切れない）
cv.addEventListener("pointermove", ev => {
  if (state !== "play" || !cfg.slide) return;
  if (!heldPointers.has(ev.pointerId)) return;
  ev.preventDefault();
  const [x, y] = canvasXY(ev);
  if (y < TOUCH_TOP - 160){ movePointer(ev.pointerId, -1); return; }
  movePointer(ev.pointerId, Math.max(0, Math.min(3, Math.floor(x / (W / 4)))));
}, { passive:false });
function endPointer(ev){ movePointer(ev.pointerId, -1); }
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);

window.addEventListener("keydown", ev => {
  if (ev.repeat) return;
  if (state === "play"){
    if (ev.key === "Escape"){ quitPlay(); return; }
    const l = KEYMAP[ev.key];
    if (l !== undefined){ ev.preventDefault(); pressLane(l); }
  }
});
window.addEventListener("keyup", ev => {
  const l = KEYMAP[ev.key];
  if (l !== undefined) releaseLane(l);
});

// コントローラー（十字キー）
const padPrev = [false,false,false,false];
const PAD_BTN = [14, 13, 12, 15];    // ← ↓ ↑ →（W3C ひょうじゅん）
function pollPad(){
  if (state !== "play" || !navigator.getGamepads) return;
  const gps = navigator.getGamepads();
  const on = [false,false,false,false];
  for (const gp of gps){
    if (!gp) continue;
    for (let i = 0; i < 4; i++){
      const b = gp.buttons[PAD_BTN[i]];
      if (b && b.pressed) on[i] = true;
    }
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (ax < -0.5) on[0] = true;
    if (ax >  0.5) on[3] = true;
    if (ay >  0.5) on[1] = true;
    if (ay < -0.5) on[2] = true;
  }
  for (let i = 0; i < 4; i++){
    if (on[i] && !padPrev[i]) pressLane(i);
    if (!on[i] && padPrev[i]) releaseLane(i);
    padPrev[i] = on[i];
  }
}

// スマホの ダブルタップ拡大・ピンチを 止める（大乱闘・世界編と同じ 手あて）
function blockZoomGestures(){
  let lastTouch = 0;
  document.addEventListener("gesturestart", e => e.preventDefault(), { passive:false });
  document.addEventListener("gesturechange", e => e.preventDefault(), { passive:false });
  document.addEventListener("gestureend", e => e.preventDefault(), { passive:false });
  document.addEventListener("touchend", e => {
    const t = Date.now();
    if (t - lastTouch < 320 && !e.target.closest("#overlay")) e.preventDefault();
    lastTouch = t;
  }, { passive:false });
  document.addEventListener("dblclick", e => e.preventDefault(), { passive:false });
}

function quitPlay(){
  stopSong();
  state = "songsel";
  showSongSel();
}

// ============================================================
//  ループ
// ============================================================
function loop(){
  pollPad();
  if (state === "play"){
    update();
    if (state === "play") stepTurns(nowT());
    draw();
  } else if (state === "menu" || state === "songsel" || state === "result"){
    frame++;
    ctx.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(loop);
}

  document.getElementById("bBack").onclick = () => { se("menu"); showMenu(); };

    se("menu");
    const s = SONGS[selSong];
    startSong(s, cfg.diff);
    buildTurns();
  }
}

// ============================================================
//  開発用の テスト窓口（大乱闘の window.__smash と 同じ やくわり）
//  ★ブラウザの タブが うしろに あると requestAnimationFrame が 止まる ので、
//    実時間を 待つ テストは 1コマも 進まずに 「ぜんぶ 通った」に 見える。
//    かならず setT() と tick() で 自分で コマを 進めて しらべること。
// ============================================================
window.__beat = {
  info(){
    return { state, song: song && song.id, diff, pre:Math.round(pre*100)/100,
             t: Math.round(nowT()*1000)/1000, hp:Math.round(hp*10)/10,
             score, combo, maxCombo, myTotal, myDone, notes:notes.length,
             counts: counts && Object.assign({}, counts), frame, failed,
             turnWho, turnPop };
  },
  songs(){ return SONGS.map(s => ({ id:s.id, bpm:s.bpm, end:s.end, foe:s.foe,
             n:Object.fromEntries(Object.entries(s.charts).map(([k,v]) => [k, v.length])) })); },
  start(id, d){
    const s = SONGS.find(x => x.id === id) || SONGS[0];
    startSong(s, d || cfg.diff); buildTurns();
    if (music){ try { music.pause(); } catch(e){} }     // テストでは 音は 鳴らさない
    return this.info();
  },
  setT(v){ testT = v; pre = 0; return nowT(); },        // にせの 時計に する
  realT(){ testT = null; },
  tick(n){ for (let i = 0; i < (n || 1); i++){ if (state === "play"){ update(); if (state === "play") stepTurns(nowT()); } } return this.info(); },
  press(l){ pressLane(l); releaseLane(l); return this.info(); },
  lanes(){ return { held:laneHeld.slice(), fingers:laneFingers.slice(), lit:laneLit.slice() }; },
  // ゆびを 直に 動かす（画面の 大きさに たよらず スライドの しくみを ためせる）
  finger(id, lane){ movePointer(id, lane); return this.lanes(); },
  nextNote(){ const t = nowT();
    for (const n of notes) if (n.who === 0 && !n.hit && !n.dead && n.t >= t)
      return { t:Math.round(n.t*1000)/1000, lane:n.lane };
    return null; },
  // 本物の 音で 動かす ときの ようす（時計が 音に ついて いけて いるか）
  audio(){
    if (!music) return null;
    return { ct: Math.round(music.currentTime*1000)/1000, paused: music.paused,
             dur: Math.round((music.duration||0)*10)/10, ready: music.readyState,
             clock: Math.round(clock.t*1000)/1000,
             zure: Math.round((clock.t - music.currentTime)*1000) };   // 時計と 音の ずれ(ms)
  },
  // rAF が 止まる ところ（うしろの タブ など）で、手で コマを まわす
  pump(sec){
    const id = setInterval(() => { if (state === "play"){ update(); if (state === "play") stepTurns(nowT()); } }, 16);
    return new Promise(r => setTimeout(() => { clearInterval(id); r(true); }, (sec || 3) * 1000));
  },
  auto(on, lag){ AUTO = on !== false; AUTO_LAG = lag || 0; return { AUTO, AUTO_LAG }; },
  render(){ if (state === "play") draw(); return true; },
  // 「にせの 時計」で 曲を 最後まで 流して、判定が ただしいか しらべる
  simulate(id, d, opt){
    opt = opt || {};
    this.start(id, d);
    this.auto(!opt.noAuto, opt.lag || 0);
    const step = opt.step || 1/60;
    const end = (song.end || 60) + 1.5;
    for (let t = 0; t <= end && state === "play"; t += step){
      testT = t;
      update(); if (state === "play") stepTurns(nowT());
    }
    const r = result ? Object.assign({}, result, { rank:result.rank.r }) : null;
    testT = null; AUTO = false; AUTO_LAG = 0;
    return { end:state, result:r };
  },
  // レーンの かたよりを しらべる（4つに ちらばって いるか）
  laneStats(id, d){
    const s = SONGS.find(x => x.id === id) || SONGS[0];
    const c = s.charts[d || "normal"] || [];
    const mine = c.filter(n => n[2] === 0);
    const by = [0,0,0,0]; for (const n of mine) by[n[1]]++;
    let jack = 0, prev = -1, run = 0, minGap = 9, pt = -9;
    for (const n of mine){
      if (n[1] === prev){ run++; if (run >= 3) jack++; } else { run = 1; prev = n[1]; }
      const g = (n[0] - pt) / 1000; if (g < minGap) minGap = g; pt = n[0];
    }
    return { total:c.length, mine:mine.length, by, jack3:jack, minGapSec:Math.round(minGap*1000)/1000 };
  },
};

// ============================================================
//  はじまり
// ============================================================
blockZoomGestures();
showMenu();
loop();
})();
