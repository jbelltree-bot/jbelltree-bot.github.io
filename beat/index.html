<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>まるりんビート</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overscroll-behavior:none;
               background:linear-gradient(180deg,#2b1c4a 0%, #1a1233 55%, #120c24 100%); }
  body { color:#fff; font-family:"Segoe UI","Yu Gothic UI",system-ui,sans-serif;
         display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  /* ★たて画面（9:16）。本家の ビートバトルが たて画面 なので それに あわせた。
     高さで きまる ので、iPad(4:3)では 左右に すこし よはくが 出る。 */
  #stage { position:relative; width:min(100vw, calc(100vh * 0.5625), 620px); touch-action:none; }
  canvas { display:block; width:100%; height:auto;
           touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  /* ★背景の 色は ゲーム画面(#cv)だけ。canvas 全部に かけると
     曲えらびの 顔アイコン(canvas)まで ぬりつぶされる（大乱闘で 1回 やった） */
  #cv { background:#100b1e; }
  .ssFace { background:transparent; }

  /* ===== オーバーレイ（メニュー） ===== */
  #overlay { position:absolute; inset:0; z-index:30; display:flex; flex-direction:column;
             align-items:center; justify-content:center; gap:8px; padding:8px 14px;
             text-align:center; overflow-y:auto; color:#f2e9ff;
             background:
               radial-gradient(circle at 12% 14%, rgba(255,120,220,.35), transparent 30%),
               radial-gradient(circle at 88% 12%, rgba(90,200,255,.35), transparent 28%),
               radial-gradient(circle at 50% 92%, rgba(255,210,90,.28), transparent 34%),
               linear-gradient(180deg,#3a1f66 0%, #26154a 45%, #150d2c 100%); }
  #overlay.hide { display:none; }
  .logo { line-height:1; transform:rotate(-1.5deg); margin-bottom:2px; }
  .logo span { display:block; font-weight:900;
               font-family:"Yu Gothic UI","Hiragino Sans","Segoe UI",sans-serif;
               -webkit-text-stroke:4px #1b0f33; paint-order:stroke fill; }
  .logo .l1 { font-size:38px; letter-spacing:4px; color:#ffd23f;
              text-shadow:0 3px 0 #b8791a, 0 6px 0 #8d5a0e, 0 9px 14px rgba(0,0,0,.5); }
  .logo .l2 { font-size:20px; letter-spacing:3px; color:#ffe9fb;
              margin-top:3px; -webkit-text-stroke-width:3.4px;
              text-shadow:0 3px 0 #a13f8e, 0 5px 0 #6d2760, 0 8px 12px rgba(0,0,0,.45); }
  .sub { display:inline-block; padding:2px 14px; border-radius:999px;
         background:rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.55);
         color:#ffe9fb; font-size:11px; font-weight:800; letter-spacing:3px; }
  #menuBody { display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; }
  .menu { display:flex; flex-direction:column; gap:10px; width:100%; max-width:340px; }
  button.big { font:inherit; font-size:17px; font-weight:800; padding:11px; border-radius:14px;
               border:3px solid rgba(255,255,255,.95); color:#fff; cursor:pointer;
               background:linear-gradient(180deg,#8a5ce6,#5a2fb0);
               box-shadow:0 5px 0 rgba(0,0,0,.35); text-shadow:0 2px 0 rgba(0,0,0,.3);
               -webkit-tap-highlight-color:transparent; transition:filter .1s, transform .1s; }
  button.big:hover { filter:brightness(1.14); }
  button.big:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.35); }
  button.big.prim   { background:linear-gradient(180deg,#ff7b8c,#e0344f); }
  button.big.c-blue { background:linear-gradient(180deg,#5fbdf5,#2a7fd0); }
  button.big.c-grn  { background:linear-gradient(180deg,#7fd86a,#3f9e3a); }
  button.big.c-yel  { background:linear-gradient(180deg,#ffd257,#f0a81e); color:#3b2b06;
                      text-shadow:0 1px 0 rgba(255,255,255,.5); }
  button.big.focus { outline:4px solid #ffe14d; outline-offset:3px; filter:brightness(1.14); }
  button.big:disabled { opacity:.45; cursor:default; }
  .note { color:#d9cbf2; font-size:11.5px; line-height:1.7; width:100%; max-width:480px; font-weight:600; }
  .note b { color:#ffd54a; }
  #ver { position:absolute; right:10px; bottom:8px; font-size:11px; color:#a493c9; }

  /* ===== 曲えらび ===== */
  #overlay.songsel { justify-content:center; gap:8px; padding:8px 10px; }
  #overlay.songsel .logo, #overlay.songsel .sub { display:none; }
  .ssTitle { display:inline-block; padding:4px 28px; border-radius:999px;
             background:linear-gradient(180deg,#ffdf70,#f0a81e);
             border:3px solid #fff; box-shadow:0 3px 0 rgba(0,0,0,.3);
             font-size:16px; font-weight:900; color:#4a2f04; letter-spacing:5px; }
  .ssList { display:flex; flex-direction:column; gap:5px; width:100%; max-width:500px; }
  .ssRow { display:flex; align-items:center; gap:8px; padding:4px 8px 4px 4px;
           border:3px solid rgba(255,255,255,.7); border-radius:13px; cursor:pointer;
           background:linear-gradient(100deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
           -webkit-tap-highlight-color:transparent; text-align:left; }
  .ssRow:hover { filter:brightness(1.15); }
  .ssRow.sel { border-color:#ffe14d; background:linear-gradient(100deg,#6d3fb8,#3d2170);
               box-shadow:0 0 0 3px rgba(255,225,77,.5); }
  .ssFace { width:46px; height:46px; flex:0 0 46px; border-radius:9px;
            background:rgba(0,0,0,.28); border:2px solid rgba(255,255,255,.45); }
  /* ★min-width:0 が ないと flex の 中身が ちぢまず、行が 画面から はみ出す */
  .ssInfo { flex:1; min-width:0; display:flex; flex-direction:column; gap:0; }
  .ssName { font-size:14px; font-weight:900; letter-spacing:.3px; line-height:1.25;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ssFoe  { font-size:11px; font-weight:700; color:#ffe1b0; line-height:1.3;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ssMeta { font-size:9.5px; color:#bcaadd; font-weight:600; line-height:1.3;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ssBest { flex:0 0 auto; text-align:right; font-size:10px; color:#ffe14d;
            font-weight:800; line-height:1.35; white-space:nowrap; }
  .ssRank { flex:0 0 26px; font-size:24px; font-weight:900; text-align:center;
            -webkit-text-stroke:2px #1b0f33; paint-order:stroke fill; }
  .ssBar { display:flex; gap:5px; align-items:center; justify-content:center; flex-wrap:wrap;
           width:100%; max-width:500px; }
  .pill { font:inherit; font-size:12.5px; font-weight:800; padding:5px 13px; border-radius:999px;
          border:2px solid rgba(255,255,255,.75); background:rgba(255,255,255,.12); color:#fff;
          cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .pill.on { background:#ffd257; color:#3b2b06; border-color:#fff; }
  .pill.sm { padding:4px 9px; font-size:13px; }
  .ssMe { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.1);
          border:2px solid rgba(255,255,255,.4); border-radius:999px; padding:3px 8px 3px 3px; }
  .ssMe canvas { width:34px; height:34px; background:transparent; }
  .ssMe span { font-size:11.5px; font-weight:800; min-width:96px; text-align:center; }

  #rotate { display:none; position:fixed; inset:0; z-index:60; background:#14142a; text-align:center;
            flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:30px; }
  #rotate .ico { font-size:60px; }
  @media (orientation:landscape){ body.has-touch #rotate { display:flex; } }
</style>
</head>

let music = null;             // いま 鳴っている 曲
let actx = null;              // 効果音は その場で 合成する（音ファイル いらず）
function audioCtx(){
  if (!actx){
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; }
  }
  if (actx && actx.state === "suspended") actx.resume().catch(()=>{});
  return actx;
}
function se(kind){
  if (!cfg.se) return;
  const c = audioCtx(); if (!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.connect(g); g.connect(c.destination);
  if (kind === "hit"){        o.type="square";   o.frequency.setValueAtTime(880, t);
                              o.frequency.exponentialRampToValueAtTime(1500, t+0.05);
                              g.gain.setValueAtTime(0.055, t); g.gain.exponentialRampToValueAtTime(0.0007, t+0.07);
                              o.start(t); o.stop(t+0.08); return; }
  if (kind === "miss"){       o.type="sawtooth"; o.frequency.setValueAtTime(210, t);
                              o.frequency.exponentialRampToValueAtTime(70, t+0.14);
                              g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.0007, t+0.16);
                              o.start(t); o.stop(t+0.17); return; }
  if (kind === "foe"){        o.type="triangle"; o.frequency.setValueAtTime(330, t);
                              g.gain.setValueAtTime(0.03, t); g.gain.exponentialRampToValueAtTime(0.0007, t+0.06);
                              o.start(t); o.stop(t+0.07); return; }
  if (kind === "menu"){       o.type="square";   o.frequency.setValueAtTime(660, t);
                              g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0007, t+0.08);
                              o.start(t); o.stop(t+0.09); return; }
}

// ★曲の 時計。audio.currentTime は カクカク 動く（1秒に 何回かしか 変わらない）ので、
//   そのまま つかうと ノーツが ガタガタ する。
//   「currentTime が 動いた しゅんかん」を 基準に して、あとは
//   performance.now() で なめらかに 進める。ずれたら 直す。
const clock = { base:0, wall:0, last:-1, t:0 };
function resetClock(){ clock.base = 0; clock.wall = performance.now(); clock.last = -1; clock.t = 0; }
function songTime(){
  if (!music) return 0;
  const raw = music.currentTime;
  const now = performance.now();
  if (raw !== clock.last){                       // 本物の 時計が 進んだ
    clock.last = raw;
    const est = clock.base + (now - clock.wall) / 1000;
    // ずれが 小さければ なめらかに よせる。大きければ 一気に 合わせる
    if (Math.abs(est - raw) > 0.09 || clock.base === 0) { clock.base = raw; }
    else { clock.base = est * 0.7 + raw * 0.3; }
    clock.wall = now;
  }
  clock.t = clock.base + (now - clock.wall) / 1000;
  return clock.t;
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x,y,w,h,r);
  else ctx.rect(x,y,w,h);
}

function drawMaru(f, o){
  o = o || {};
  const sc = f.h / 42;
  ctx.save();
  ctx.scale(sc, sc);
  ctx.translate(0, -21);      // 足元が原点になるように
  const flash = f.hurtFlash > 0 && Math.floor(f.hurtFlash/3) % 2 === 0;
  const run = Math.abs(f.vx) > 0.5 && f.onGround;
  const air = !f.onGround;
  const legPhase = Math.sin(f.animT * 0.4);
  const bodyR = 17;

  // 影
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath(); ctx.ellipse(0, 18, 15, 4, 0, 0, 7); ctx.fill();
  // 後ろ足
  ctx.fillStyle = "#f6e2c0";
  const fs = run ? legPhase*6 : (air ? -3 : 0);
  ctx.beginPath(); ctx.ellipse(-6, 15 - fs*0.3, 6, 5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 7, 15 + fs*0.3, 6, 5, 0, 0, 7); ctx.fill();

  // はねジャンプ（上必殺）：背中に 白いはねが 生えて パタパタする
  if (f.spDef && f.spDef.wings){
    const wf = Math.sin(f.spT * 0.7) * 0.6;
    for (const s of [-1, 1]){
      ctx.save();
      ctx.translate(s*12, -4);
      ctx.rotate(s*(0.55 + wf));
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.beginPath(); ctx.ellipse(0, 0, 6, 14, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(150,200,240,0.8)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0, 0, 6, 14, 0, 0, 7); ctx.stroke();
      ctx.restore();
    }
  }
  if (o.behind) o.behind(f, flash);        // つばさ・しっぽ・陣羽織 など（体のうしろ）
  // 体
  ctx.fillStyle = flash ? "#ffd7d7" : (o.bodyA || "#b8bcc4");
  ctx.beginPath(); ctx.ellipse(0, 0, bodyR, bodyR+2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = flash ? "#ffc2c2" : (o.bodyB || "#a7abb4");
  ctx.beginPath(); ctx.ellipse(-6, -2, bodyR*0.7, bodyR*0.85, 0, 0, 7); ctx.fill();
  // 体の 上に かさねる もの（うちゅう服 など）。かおより 先に 描く
  if (o.onBody) o.onBody(f, flash);
  // 耳
  ctx.fillStyle = "#efe1c6";
  ctx.beginPath(); ctx.ellipse(-9, -15, 5, 6, -0.3, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 9, -15, 5, 6,  0.3, 0, 7); ctx.fill();
  ctx.fillStyle = "#e2d0ac";
  ctx.beginPath(); ctx.ellipse(-9, -14, 2.4, 3, -0.3, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 9, -14, 2.4, 3,  0.3, 0, 7); ctx.fill();
  // お腹
  ctx.fillStyle = "#fbf3e2";
  ctx.beginPath(); ctx.ellipse(3, 3, 13, 15, 0, 0, 7); ctx.fill();
  // ほっぺ
  ctx.fillStyle = "#f7d3ca";
  ctx.beginPath(); ctx.arc(-2, 2, 3.2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(12, 2, 3.2, 0, 7); ctx.fill();
  // 目
  ctx.fillStyle = "#4fb4ea";
  ctx.beginPath(); ctx.arc(2, -4, 5.4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -4, 4.8, 0, 7); ctx.fill();
  ctx.fillStyle = "#15151a";
  ctx.beginPath(); ctx.arc(2, -4, 4.2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -4, 3.6, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(3.4, -5.2, 1.4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(14, -5, 1.2, 0, 7); ctx.fill();
  // 鼻
  ctx.fillStyle = "#161619";
  ctx.beginPath(); ctx.ellipse(8, 1, 4.6, 3.9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.beginPath(); ctx.arc(6.6, -0.4, 1.3, 0, 7); ctx.fill();
  // 口
  ctx.strokeStyle = "#3a3128"; ctx.lineWidth = 1.4; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(8, 4); ctx.quadraticCurveTo(5, 8, 2, 5.5);
  ctx.moveTo(8, 4); ctx.quadraticCurveTo(11, 8, 14, 5.5);
  ctx.stroke();
  // 前足（攻撃中は前に突き出す）
  const swing = run ? legPhase * 2 : 0;
  const punch = (f.atkName === "side" || f.atkName === "air") ? 9 : 0;
  const lift  = air ? -2 : 0;
  ctx.fillStyle = "#f6e2c0";
  ctx.beginPath(); ctx.ellipse(-13, 8 + lift - swing, 3.3, 4.2, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(15 + punch, 8 + lift + swing - punch*0.4, 3.6, 4.4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#f0bd98";
  ctx.beginPath(); ctx.arc(-13, 9 + lift - swing, 1.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(15 + punch, 9 + lift + swing - punch*0.4, 1.6, 0, 7); ctx.fill();
  if (o.front) o.front(f, flash, punch);   // つの・はちまき・刀 など（体の手前）
  ctx.restore();
}

// ドラゴンの つばさ：おなかの横から「下向き」に生える（原画どおり）
function dragonWingShape(s, flap, k){
  ctx.save();
  ctx.translate(s * 12 * k, -1 * k);
  ctx.rotate(s * (-0.06 + flap));
  ctx.scale(s * k * 0.8, -k * 0.8);   // y反転で 翼先が 下を向く
  ctx.fillStyle = "#6f9e5e";
  ctx.beginPath();
  ctx.moveTo(0, 2);
  ctx.quadraticCurveTo(4, -20, 20, -22);       // 前縁→翼端
  ctx.quadraticCurveTo(16, -13, 14, -8);       // 谷1
  ctx.quadraticCurveTo(12, -9, 9, -4);         // 山→谷2
  ctx.quadraticCurveTo(6, -4, 3, 0);           // ふち
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#557a46"; ctx.lineWidth = 1.6; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(1, 0); ctx.lineTo(20, -22);
  ctx.moveTo(1, 0); ctx.lineTo(14, -9);
  ctx.stroke();
  ctx.restore();
}

// しっぽスピンの しっぽ（異世界編 drawSpinTail の移植）。
// ★体は 回らない。しっぽだけが 楕円を えがいて ぐるっと 一周する。
//   front=false は 体より奥、true は 手前。
function drawSpinTail(f, front){
  const a = f.spT * 0.55;            // 異世界編の spinAngle と同じ進みかた
  const RX = 44, RY = 13;
  ctx.save();
  ctx.translate(0, 15);              // おしりの高さ（顔を横切らないように 低め）
  ctx.lineCap = "round";
  if (!front){
    // 回った跡（うしろに残る 光の輪）
    for (let k = 1; k <= 4; k++){
      ctx.strokeStyle = "rgba(226,255,205," + (0.30 - k * 0.06).toFixed(2) + ")";
      ctx.lineWidth = 10 - k * 1.6;
      ctx.beginPath(); ctx.ellipse(0, 0, RX, RY, 0, a - k * 0.55 - 0.5, a - k * 0.55 + 0.1); ctx.stroke();
    }
  }
  // しっぽが 下半分（sin>=0）に あるときが 手前
  if ((Math.sin(a) >= 0) === front){
    const tipX = Math.cos(a) * RX, tipY = Math.sin(a) * RY;
    const mx = tipX * 0.5, my = tipY * 0.5;
    const ca = Math.cos(-0.6), sa = Math.sin(-0.6);
    const qx = mx * ca - my * sa, qy = mx * sa + my * ca;   // しなり
    const bez = (t, p0, c1, p1) => (1-t)*(1-t)*p0 + 2*(1-t)*t*c1 + t*t*p1;
    const N = 6;
    for (let pass = 0; pass < 2; pass++){
      ctx.strokeStyle = pass === 0 ? "#4f7c42" : "#8fc97c";
      for (let i = 0; i < N; i++){
        const t0 = i / N, t1 = (i + 1) / N;
        ctx.lineWidth = (pass === 0 ? 13 : 9) - i * (pass === 0 ? 1.5 : 1.2);
        ctx.beginPath();
        ctx.moveTo(bez(t0, 0, qx, tipX), bez(t0, -2, qy, tipY));
        ctx.lineTo(bez(t1, 0, qx, tipX), bez(t1, -2, qy, tipY));
        ctx.stroke();
      }
    }
    // 先っぽの ヒレ
    const px = bez(0.85, 0, qx, tipX), py = bez(0.85, -2, qy, tipY);
    ctx.save();
    ctx.translate(tipX, tipY);
    ctx.rotate(Math.atan2(tipY - py, tipX - px));
    ctx.fillStyle = "#4f7c42";
    ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(8, -7); ctx.lineTo(5, 0); ctx.lineTo(8, 7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// --- ドラゴンまるりん（異世界編 drawDragonMaruBody の移植）---
function drawDragon(f){
  const sc = f.h / 42;
  ctx.save();
  ctx.scale(sc, sc);
  ctx.translate(0, -21);
  const run = Math.abs(f.vx) > 0.5 && f.onGround;
  const airborne = !f.onGround;
  const legPhase = Math.sin(f.animT * 0.4);
  // はばたき（上必殺）の あいだは 翼を 大きく ふりおろす
  let flap = airborne ? Math.sin(f.animT * 0.55) * 0.7 : Math.sin(f.animT * 0.1) * 0.15;
  if (f.spKind === "rise" && f.spT < 15) flap = 1.15 - f.spT * 0.13;

  const spinning = f.spKind === "spin";
  if (spinning){
    drawSpinTail(f, false);           // 体より 奥のしっぽ（と 回った跡）
  } else {
    // ふだんの しっぽ（後ろへ。先に とがったヒレ）
    ctx.save();
    ctx.rotate(Math.sin(f.animT * 0.15) * 0.08);
    ctx.strokeStyle = "#8fb87e"; ctx.lineWidth = 6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-12, 6); ctx.quadraticCurveTo(-24, 10, -27, 1); ctx.stroke();
    ctx.fillStyle = "#6f9e5e";
    ctx.beginPath(); ctx.moveTo(-29, 5); ctx.lineTo(-36, -4); ctx.lineTo(-23, -3); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // つばさ（コウモリ型・2枚）
  dragonWingShape(-1, flap, 1);
  dragonWingShape( 1, flap, 1);
  // 後ろ足
  ctx.fillStyle = "#7fae6e";
  const footSwing = run ? legPhase * 6 : (airborne ? -3 : 0);
  ctx.beginPath(); ctx.ellipse(-6, 15 - footSwing*0.3, 6, 5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 7, 15 + footSwing*0.3, 6, 5, 0, 0, 7); ctx.fill();
  // 体（みどりのドラゴンボディ）
  ctx.fillStyle = "#9cc488";
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 19, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#8ab577";
  ctx.beginPath(); ctx.ellipse(-6, -2, 12, 16, 0, 0, 7); ctx.fill();
  // 耳（ピンクの内側）
  ctx.fillStyle = "#a8cf94";
  ctx.beginPath(); ctx.ellipse(-9, -16, 4.5, 6, -0.35, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 9, -16, 4.5, 6,  0.35, 0, 7); ctx.fill();
  ctx.fillStyle = "#f0b8c8";
  ctx.beginPath(); ctx.ellipse(-9, -15, 2.2, 3, -0.35, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 9, -15, 2.2, 3,  0.35, 0, 7); ctx.fill();
  // つの（クリーム色の 小さなツノ2本）
  ctx.fillStyle = "#f2e8c8";
  ctx.beginPath(); ctx.moveTo(-4, -18); ctx.lineTo(-2, -26); ctx.lineTo(0, -18); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo( 4, -18); ctx.lineTo( 6, -26); ctx.lineTo(8, -18); ctx.closePath(); ctx.fill();
  // 大きな白いおなか
  ctx.fillStyle = "#fbf7ea";
  ctx.beginPath(); ctx.ellipse(3, 4, 12, 13.5, 0, 0, 7); ctx.fill();
  // ほっぺ
  ctx.fillStyle = "#f7d3ca";
  ctx.beginPath(); ctx.arc(-2, 2, 3.2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(12, 2, 3.2, 0, 7); ctx.fill();
  // 目
  ctx.fillStyle = "#4fb4ea";
  ctx.beginPath(); ctx.arc(2, -4, 5.4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -4, 4.8, 0, 7); ctx.fill();
  ctx.fillStyle = "#15151a";
  ctx.beginPath(); ctx.arc(2, -4, 4.2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -4, 3.6, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(3.4, -5.2, 1.4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(14, -5, 1.2, 0, 7); ctx.fill();
  // 火を噴くとき：口を 大きくあける
  // 火の玉・火柱 どちらも「口から 火を はく」ので 口を あける
  const open = ((f.spKind === "proj" || f.spKind === "pillar") && f.spT < 20)
             ? Math.min(1, (20 - f.spT) / 14) : 0;
  if (open > 0){
    const mw = 4.2 + open * 1.6, mh = 1.8 + open * 2.4;
    ctx.fillStyle = "#5b2a22";
    ctx.beginPath(); ctx.ellipse(8.5, 7.2 + mh * 0.3, mw, mh, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#dd8b8b";
    ctx.beginPath(); ctx.ellipse(8.5, 7.8 + mh * 0.6, mw * 0.5, mh * 0.4, 0, 0, 7); ctx.fill();
  }
  // 鼻
  ctx.fillStyle = "#161619";
  ctx.beginPath(); ctx.ellipse(8, 1, 4.6, 3.9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.beginPath(); ctx.arc(6.6, -0.4, 1.3, 0, 7); ctx.fill();
  // 口とキバ
  if (open > 0){
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.moveTo(4.4, 4.8); ctx.lineTo(7.2, 5.4); ctx.lineTo(5.6, 9.6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(9.9, 5.4); ctx.lineTo(12.7, 4.8); ctx.lineTo(11.4, 9.6); ctx.closePath(); ctx.fill();
  } else {
    ctx.strokeStyle = "#3a4a32"; ctx.lineWidth = 1.4; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(8, 5); ctx.quadraticCurveTo(5, 8.5, 2, 6);
    ctx.moveTo(8, 5); ctx.quadraticCurveTo(11, 8.5, 14, 6);
    ctx.stroke();
  }
  // 前足
  const swing = run ? legPhase * 2 : 0;
  const lift = airborne ? -2 : 0;
  ctx.fillStyle = "#f6e2c0";
  ctx.beginPath(); ctx.ellipse(-14, 8 + lift - swing, 3.6, 4.6, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 16, 8 + lift + swing, 3.6, 4.6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#f0bd98";
  ctx.beginPath(); ctx.arc(-14, 9 + lift - swing, 1.6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc( 16, 9 + lift + swing, 1.6, 0, 7); ctx.fill();
  // 口から ふき出す炎
  if (open > 0){
    const g = 1 - open;
    ctx.fillStyle = "rgba(255,140,50,0.92)";
    ctx.beginPath(); ctx.arc(16 + g * 6, 8, 4.5 + Math.random() * 2, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,205,110,0.95)";
    ctx.beginPath(); ctx.arc(14 + g * 5, 8, 2.6 + Math.random(), 0, 7); ctx.fill();
  }
  if (spinning) drawSpinTail(f, true);   // 体より 手前のしっぽ
  ctx.restore();
}
